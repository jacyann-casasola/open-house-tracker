<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Open House Tracker — Villa Casa Home Group</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0c">
<style>
/* ============================================================
   VILLA CASA HOME GROUP — OPEN HOUSE TRACKER
   Design system: calm, premium, black/white/gray, serif + sans
   ============================================================ */

:root{
  --ink:#111110;
  --ink-soft:#4a4a47;
  --ink-faint:#8a8a86;
  --paper:#ffffff;
  --mist:#f4f3f1;
  --mist-deep:#eceae6;
  --line:#e3e1dc;
  --line-soft:#edece8;
  --accent:#111110;
  --danger:#a13b2b;
  --success:#3b6b4f;
  --gold:#a6813d;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(17,17,16,0.04), 0 1px 1px rgba(17,17,16,0.03);
  --shadow-2: 0 8px 28px rgba(17,17,16,0.08), 0 2px 8px rgba(17,17,16,0.04);
  --shadow-3: 0 24px 64px rgba(17,17,16,0.18), 0 4px 16px rgba(17,17,16,0.08);

  --ease: cubic-bezier(.16,.84,.32,1);
  --ease-spring: cubic-bezier(.2,1.1,.3,1);

  color-scheme: light;
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: var(--mist);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  min-height: 100vh;
  min-height: 100dvh;
}
h1,h2,h3,h4{ font-family: var(--serif); font-weight: 700; margin:0; letter-spacing:-0.02em; }
p{ margin:0; }
button{ font-family: inherit; cursor:pointer; }
input,textarea,select{ font-family: inherit; }
::selection{ background: var(--ink); color:var(--paper); }

/* ---------- App shell ---------- */
#app{
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  background: var(--mist);
}

.screen{ animation: rise .38s var(--ease); }
@keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:none; } }

.topbar{
  position: sticky; top:0; z-index: 20;
  display:flex; align-items:center; gap:12px;
  padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
  background: linear-gradient(var(--mist) 78%, transparent);
  backdrop-filter: saturate(160%) blur(8px);
}
.topbar .back{
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: var(--paper); border:1px solid var(--line);
  box-shadow: var(--shadow-1);
  flex:none;
  transition: transform .15s var(--ease), background .15s var(--ease);
}
.topbar .back:active{ transform: scale(.9); background: var(--mist-deep); }
.topbar .back svg{ width:16px; height:16px; }
.topbar h1{ font-size: 20px; flex:1; font-weight:700; }
.topbar .side-action{
  font-size:14px; color: var(--ink-soft); background:none; border:none; padding:8px; font-weight:600;
}

.content{ padding: 4px 20px 24px; }
.eyebrow{
  text-transform: uppercase; letter-spacing: .12em; font-size:11px; font-weight:600;
  color: var(--ink-faint); margin-bottom: 6px;
}

/* ---------- Buttons ---------- */
.btn{
  appearance:none; border:none; border-radius: var(--r-pill);
  padding: 16px 24px; font-size:16px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition: transform .15s var(--ease-spring), box-shadow .2s var(--ease), background .15s var(--ease), opacity .15s;
  width:100%;
}
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--ink); color: var(--paper); box-shadow: var(--shadow-2); }
.btn-primary:active{ box-shadow: var(--shadow-1); }
.btn-secondary{ background: var(--paper); color: var(--ink); border:1px solid var(--line); }
.btn-ghost{ background:transparent; color: var(--ink-soft); }
.btn-danger-ghost{ background:transparent; color: var(--danger); }
.btn-danger{ background: var(--danger); color:#fff; box-shadow: var(--shadow-2); }
.btn-danger:active{ box-shadow: var(--shadow-1); }
.btn-sm{ padding:10px 18px; font-size:14px; width:auto; }
.btn[disabled]{ opacity:.35; pointer-events:none; }
.btn-row{ display:flex; gap:12px; }
.btn-row .btn{ flex:1; }

.link-row{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:14px; color: var(--ink-soft); font-size:14px; font-weight:500;
}

/* ---------- Cards ---------- */
.card{
  background: var(--paper); border-radius: var(--r-md);
  box-shadow: var(--shadow-1); border:1px solid var(--line-soft);
  padding: 22px;
}
.card + .card{ margin-top:14px; }

.property-card{
  background: linear-gradient(160deg, #171613, #0c0c0b);
  color: var(--paper); border-radius: var(--r-lg);
  padding: 28px 24px; position:relative; overflow:hidden;
  box-shadow: var(--shadow-3);
}
.property-card::after{
  content:""; position:absolute; inset:0;
  background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.08), transparent 60%);
}
.property-card .pc-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:10px; }
.property-card h2{ font-size: 26px; line-height:1.25; color:#fff; font-weight:700; }
.property-card .pc-meta{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px 18px; font-size:14px; color:rgba(255,255,255,.75); }
.property-card .pc-meta b{ color:#fff; font-weight:600; }
.property-card .pc-when{
  margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:space-between; font-size:14px; color:rgba(255,255,255,.85);
}
.pulse-dot{
  width:8px; height:8px; border-radius:50%; background:#7fd39a; display:inline-block; margin-right:8px;
  box-shadow: 0 0 0 rgba(127,211,154,.6); animation: pulse 2.2s infinite;
}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(127,211,154,.55);}
  70%{ box-shadow:0 0 0 9px rgba(127,211,154,0);}
  100%{ box-shadow:0 0 0 0 rgba(127,211,154,0);}
}

/* ---------- Stat tiles ---------- */
.stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin: 18px 0; }
.stat-tile{
  background: var(--paper); border-radius: var(--r-md); padding: 16px 12px;
  text-align:center; border:1px solid var(--line-soft); box-shadow: var(--shadow-1);
  transition: transform .15s var(--ease-spring);
}
.stat-tile:active{ transform: scale(.96); }
.stat-tile .num{ font-family: var(--serif); font-size: 30px; line-height:1; font-weight:700; }
.stat-tile .lbl{ font-size:11.5px; color: var(--ink-soft); margin-top:6px; line-height:1.3; }
.stat-tile.warn .num{ color:#8a5a2a; }
.stat-tile.urgent .num{ color: var(--danger); }

/* ---------- Section headers ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between; margin: 26px 0 12px;
}
.section-head h3{ font-size:19px; }
.section-head .see-all{ font-size:13px; color: var(--ink-soft); font-weight:600; }

/* ---------- List rows / Visitor cards ---------- */
.visitor-card{
  background: var(--paper); border-radius: var(--r-md); padding: 16px 18px;
  display:flex; align-items:center; gap:14px; border:1px solid var(--line-soft);
  box-shadow: var(--shadow-1); transition: transform .15s var(--ease-spring), box-shadow .2s;
  margin-bottom: 10px;
}
.visitor-card:active{ transform: scale(.985); }
.v-avatar{
  width:44px; height:44px; border-radius:50%; background: var(--mist-deep);
  display:flex; align-items:center; justify-content:center; font-family: var(--serif); font-size:17px; font-weight:700;
  flex:none; color: var(--ink);
}
.v-main{ flex:1; min-width:0; }
.v-name{ font-size:16.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.v-time{ font-size:12px; font-weight:600; color: var(--ink-faint); flex:none; white-space:nowrap; }
.v-sub{ font-size:13px; color: var(--ink-soft); margin-top:3px; line-height:1.4; }
.v-badges{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none; }
.v-status-row{ display:flex; align-items:center; gap:6px; }
.badge{
  font-size:11px; font-weight:700; padding:5px 10px; border-radius: var(--r-pill);
  letter-spacing:.02em; white-space:nowrap;
}
.badge-followup{ background:#fbe9e4; color:#a13b2b; }
.badge-capture{ background:#fbf1de; color:#8a5a2a; }
.badge-complete{ background:#e7f2ea; color:#3b6b4f; }
.chev{ color: var(--ink-faint); }

.empty-state{
  text-align:center; padding: 48px 20px; color: var(--ink-soft);
}
.empty-state .glyph{ font-size:34px; margin-bottom:14px; opacity:.5; }
.empty-state h3{ font-size:18px; color: var(--ink); margin-bottom:6px; }
.empty-state p{ font-size:14px; line-height:1.5; max-width:280px; margin:0 auto; }

/* ---------- Forms ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color: var(--ink-soft); margin-bottom:7px; letter-spacing:.01em; }
.field input[type=text], .field input[type=tel], .field input[type=email],
.field input[type=number], .field input[type=date], .field input[type=time], .field textarea{
  width:100%; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding: 15px 16px; font-size:16px; color: var(--ink); transition: border-color .15s, background .15s;
  -webkit-appearance:none;
}
.field select{
  width:100%; border:1px solid var(--line); background-color: var(--mist); border-radius: var(--r-sm);
  padding: 15px 40px 15px 16px; font-size:16px; color: var(--ink); transition: border-color .15s, background .15s;
  -webkit-appearance:none; appearance:none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a4a47' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center; background-size: 18px;
}
.field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color: var(--ink); background-color: var(--paper); }
.field textarea{ resize:vertical; min-height:76px; line-height:1.5; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.field .req-mark{ color: var(--danger); }
.field-note{ font-size:12px; color: var(--ink-faint); margin-top:6px; line-height:1.5; }

/* ---------- Shared Optional Detail control (one control, used everywhere) ---------- */
.optional-detail-wrap{ margin-top:14px; }
.optional-detail-label{ font-size:12px; font-weight:600; color: var(--ink-faint); margin-bottom:7px; letter-spacing:.01em; text-transform:uppercase; }
.optional-detail{
  width:100%; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding: 15px 16px; font-size:16px; color: var(--ink); line-height:1.4;
  resize:none; min-height:54px; overflow-y:hidden; font-family:inherit; -webkit-appearance:none; display:block;
  transition: border-color .15s, background .15s;
}
.optional-detail:focus{ outline:none; border-color: var(--ink); background: var(--paper); }

.chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  padding: 11px 18px; border-radius: var(--r-pill); background: var(--mist); border:1px solid var(--line);
  font-size:14.5px; font-weight:600; color: var(--ink-soft);
  transition: all .15s var(--ease-spring); user-select:none;
}
.chip.selected{ background: var(--ink); color:#fff; border-color: var(--ink); transform: scale(1.03); }
.chip:active{ transform: scale(.94); }

.toggle-row{ display:flex; gap:8px; }
.toggle-row .chip{ flex:1; text-align:center; }

/* ---------- Collapsed multi-select field (Motivation, Deal Breakers, Must/Nice-to-Haves) ---------- */
.ms-field{
  width:100%; text-align:left; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding:13px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition: border-color .15s, background .15s;
}
.ms-field:active{ background: var(--mist-deep); }
.ms-field-body{ flex:1; min-width:0; }
.ms-field-chev{ color: var(--ink-faint); flex:none; display:flex; transform: rotate(90deg); }
.ms-placeholder{ color: var(--ink-faint); font-size:15.5px; }
.ms-summary-text{ color: var(--ink); font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
.ms-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.ms-chip{ background: var(--ink); color:#fff; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius: var(--r-pill); }

/* ---------- Category → Specific Feedback picker (What They Liked / Concerns) ----------
   Tighter, evenly-weighted controls than the standard .chip so a full category never reads
   as a "wall of pills" — smaller font, tighter padding, consistent tap target. */
.chip-compact{ padding:8px 13px; font-size:13px; }
.cat-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.cat-tile{
  flex:1 1 calc(50% - 8px); min-width:130px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:13px 15px; border-radius:14px; background: var(--mist); border:1px solid var(--line);
  font-size:14px; font-weight:600; color: var(--ink); text-align:left;
  transition: all .15s var(--ease-spring);
}
.cat-tile:active{ transform: scale(.96); background: var(--mist-deep); }
.cat-tile-label{ min-width:0; }
.cat-tile-count{ flex:none; background: var(--ink); color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius: var(--r-pill); }
.cat-tile-other{ color: var(--ink-soft); }
.cat-back{
  display:flex; align-items:center; gap:2px; background:none; border:none; padding:2px 0 14px;
  font-size:13.5px; font-weight:600; color: var(--ink-soft);
}
.cat-back:active{ opacity:.6; }
.cat-active-label{ font-family:var(--serif); font-size:17px; font-weight:700; color: var(--ink); margin-bottom:14px; }
.cat-options{ row-gap:8px; }
.ms-selected-summary{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line-soft); }
.ms-selected-count{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color: var(--ink-faint); margin-bottom:5px; }
.ms-selected-preview{ font-size:13.5px; color: var(--ink-soft); line-height:1.4; }

/* "+ Add Custom" chip-entry (Motivation, Must-Haves, Nice-to-Haves, Deal Breakers) */
.custom-add-row{ display:flex; gap:8px; }
.ms-custom-input{
  flex:1; min-width:0; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding:12px 14px; font-size:15px; color: var(--ink); font-family:inherit;
}
.ms-custom-input:focus{ outline:none; border-color: var(--ink); background: var(--paper); }

/* ---------- This Home / Their Home Search (Visitor Profile v2) ----------
   Distinct-but-subtle visual identity: This Home cards carry a thin gold accent
   (the app's existing "priority" gold), Their Home Search cards carry a neutral
   charcoal accent — both stay within the black/white/neutral-gray foundation. */
.th-field{ margin-bottom:16px; }
.th-field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:9px; letter-spacing:.01em; }
.section-card-thishome{ border-left:3px solid var(--gold); }
.section-card-theirsearch{ border-left:3px solid var(--ink-soft); }
.subsection-head{ margin:22px 0 10px; }
.subsection-head h4{ font-family:var(--serif); font-size:16px; font-weight:700; color:var(--ink); }
.star-row{ display:flex; gap:4px; }
.star-btn{ background:none; border:none; padding:2px; font-size:30px; line-height:1; color:var(--line); transition:transform .12s var(--ease-spring); }
.star-btn:active{ transform:scale(.88); }
.star-btn.filled{ color:var(--gold); }
.single-story-row{ display:flex; align-items:center; gap:10px; padding:2px 0; }
.single-story-row input[type=checkbox]{ width:20px; height:20px; accent-color:var(--ink); flex:none; }
.single-story-row label{ font-size:14.5px; color:var(--ink); font-weight:500; }

/* ---------- Buyer Preferences ---------- */
.pref-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.pref-card-head .glyph{ font-size:20px; line-height:1; }
.pref-card-head h4{ font-family:var(--serif); font-size:18px; font-weight:700; }
.pref-category{ margin-bottom:16px; }
.pref-category:last-child{ margin-bottom:0; }
.pref-category-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color: var(--ink-faint); font-weight:700; margin-bottom:8px; }

/* ---------- FAB ---------- */
.fab-anchor{
  position: fixed; inset:0; max-width:640px; margin:0 auto; pointer-events:none; z-index:40;
}
.fab{
  position: absolute; right: 22px; bottom: calc(26px + env(safe-area-inset-bottom));
  width:60px; height:60px; border-radius:50%; background: var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-3);
  border:none; transition: transform .18s var(--ease-spring); pointer-events:auto;
}
.fab:active{ transform: scale(.9); }
.fab svg{ width:24px; height:24px; }

/* ---------- Bottom sheet ---------- */
.sheet-backdrop{
  position: fixed; inset:0; background: rgba(15,14,12,.42); z-index:60; opacity:0;
  transition: opacity .28s var(--ease); backdrop-filter: blur(2px);
}
.sheet-backdrop.show{ opacity:1; }
.sheet{
  position: fixed; left:0; right:0; bottom:0; z-index:61; max-width:640px; margin:0 auto;
  background: var(--paper); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-3);
  max-height: 88vh; display:flex; flex-direction:column;
  transform: translateY(100%); transition: transform .38s var(--ease-spring);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.show{ transform: translateY(0); }
.sheet-handle{ width:38px; height:5px; border-radius:3px; background: var(--line); margin:12px auto 4px; flex:none; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding: 10px 22px 6px; flex:none; }
.sheet-head h3{ font-size:20px; font-weight:700; }
.sheet-close{ width:32px; height:32px; border-radius:50%; background: var(--mist); border:none; display:flex; align-items:center; justify-content:center; }
.sheet-body{ padding: 10px 22px 22px; overflow-y:auto; }
.sheet-footer{ padding: 12px 22px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft); flex:none; }

/* ---------- Toast ---------- */
.toast{
  position: fixed; left:50%; bottom: calc(30px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color:#fff; padding: 13px 22px; border-radius: var(--r-pill); font-size:14px; font-weight:600;
  box-shadow: var(--shadow-3); z-index: 90; opacity:0; transition: all .3s var(--ease-spring); pointer-events:none;
  white-space:nowrap;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

/* ---------- Autosave indicator ---------- */
.autosave-indicator{
  font-size:11.5px; font-weight:600; color: var(--ink-faint); opacity:0; transition: opacity .3s var(--ease);
  padding:8px; white-space:nowrap;
}
.autosave-indicator.show{ opacity:1; color:#3b6b4f; }

/* ---------- Wrap-up ---------- */
.hero-wrap{ text-align:center; padding: 26px 6px 8px; }
.hero-wrap .glyph-ring{
  width:64px; height:64px; border-radius:50%; margin:0 auto 18px; background: var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-2);
}
.hero-wrap h1{ font-size: 26px; margin-bottom:6px; }
.hero-wrap p{ color: var(--ink-soft); font-size:15px; }

.priority-card{
  background: linear-gradient(160deg,#1c1a16,#0d0c0b); color:#fff; border-radius: var(--r-lg);
  padding:22px; margin-top:18px; box-shadow: var(--shadow-2);
}
.priority-card .pc-tag{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:700; margin-bottom:8px; }
.priority-card h3{ color:#fff; font-size:20px; }
.priority-card p{ color:rgba(255,255,255,.7); font-size:13.5px; margin-top:6px; line-height:1.5; }

/* ---------- Analytics / Seller Report distribution bars ---------- */
.dist-row{ margin-bottom:14px; }
.dist-row:last-child{ margin-bottom:0; }
.dist-row-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; font-size:14px; }
.dist-label{ color:var(--ink); font-weight:600; }
.dist-count{ color:var(--ink-faint); font-size:13px; font-weight:600; }
.dist-bar-track{ height:8px; border-radius:5px; background:var(--mist-deep); overflow:hidden; }
.dist-bar-fill{ height:100%; border-radius:5px; background:var(--ink); }

/* ---------- Snapshot ---------- */
.snap-block{ margin-bottom: 20px; }
.snap-block .sb-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color: var(--ink-faint); font-weight:700; margin-bottom:6px; }
.snap-block .sb-value{ font-size:15.5px; line-height:1.55; color: var(--ink); }
.snap-block .sb-value.empty{ color: var(--ink-faint); font-style:italic; }
.snap-header{ text-align:center; padding: 14px 0 6px; }
.snap-header .initial-ring{
  width:64px; height:64px; border-radius:50%; background: var(--mist-deep); margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center; font-family: var(--serif); font-size:24px; font-weight:700;
}
.snap-header h2{ font-size:24px; }
.snap-header .snap-sub{ color: var(--ink-soft); font-size:14px; margin-top:4px; }
.pill-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
.pill-static{ background: var(--mist); border:1px solid var(--line); border-radius: var(--r-pill); padding:7px 14px; font-size:12.5px; font-weight:600; color: var(--ink-soft); }
.pill-static.tappable{ cursor:pointer; }
.pill-static.pill-gold{ background: var(--gold); color:#fff; border-color: var(--gold); }

/* ---------- Task list ---------- */
.task-row-wrap{ padding: 6px 0; border-bottom:1px solid var(--line-soft); }
.task-row-wrap:last-child{ border-bottom:none; }
.task-row{ display:flex; align-items:center; gap:12px; padding:6px 0; }
.task-check{
  width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line); flex:none;
  display:flex; align-items:center; justify-content:center; transition: all .15s var(--ease-spring);
}
.task-check.done{ background: var(--ink); border-color: var(--ink); }
.task-check svg{ width:14px; height:14px; color:#fff; opacity:0; transition:opacity .1s; }
.task-check.done svg{ opacity:1; }
.task-text{ flex:1; font-size:15px; }
.task-text.done{ color: var(--ink-faint); text-decoration: line-through; }
.task-del{ color: var(--ink-faint); font-size:18px; padding:4px 8px; }
.task-meta-row{ display:flex; gap:8px; padding-left:36px; margin-top:2px; }
.task-meta-btn{ font-size:11.5px; padding:5px 10px; }

/* ---------- Segmented filter ---------- */
.seg{ display:flex; background: var(--mist-deep); border-radius: var(--r-pill); padding:4px; gap:2px; }
.seg button{ flex:1; border:none; background:transparent; padding:9px 8px; border-radius: var(--r-pill); font-size:13.5px; font-weight:600; color: var(--ink-soft); transition: all .18s var(--ease); }
.seg button.active{ background:#fff; color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------- Welcome ---------- */
.welcome-hero{ padding: 8px 20px 0; }
.brand-mark{ text-align:center; padding: 30px 0 10px; }
.brand-mark .mark{ font-family: var(--serif); font-size:15px; letter-spacing:.14em; text-transform:uppercase; color: var(--ink-soft); font-weight:700; }
.brand-mark .markline{ width:34px; height:1px; background: var(--line); margin: 10px auto 0; }

hr.hair{ border:none; border-top:1px solid var(--line-soft); margin: 18px 0; }

.kicker-row{ display:flex; align-items:center; gap:8px; color: var(--ink-soft); font-size:13px; margin-bottom:4px; }

/* ---------- Passcode ---------- */
.passcode-row{ display:flex; justify-content:center; margin: 18px 0 6px; }
.passcode-input{
  width:170px; text-align:center; font-size:32px; letter-spacing:16px; font-weight:700;
  border:1px solid var(--line); background: var(--mist); border-radius:16px; padding:16px 16px 16px 30px;
  font-family: var(--serif); -webkit-appearance:none;
}
.passcode-input:focus{ outline:none; border-color: var(--ink); background: var(--paper); }
.passcode-error{ color: var(--danger); font-size:13px; text-align:center; margin-top:10px; min-height:16px; }
.passcode-hint{ font-size:13.5px; color: var(--ink-soft); line-height:1.6; margin-bottom:6px; }

/* ---------- Visitor Sign-In (kiosk) ---------- */
.signin-screen{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
.signin-screen .content{ flex:1; padding-bottom:12px; }
.signin-brandline{ display:flex; align-items:center; justify-content:center; gap:10px; padding-top:6px; }
.signin-brand-ring{
  width:28px; height:28px; border-radius:50%; background: var(--ink); color:#fff; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.signin-brand-ring svg{ width:13px; height:13px; }
.signin-intro{ text-align:center; margin-bottom:26px; }
.signin-intro h1{ font-size:22px; font-weight:700; white-space:nowrap; }
.signin-intro .signin-welcome{ color: var(--ink-soft); font-size:15px; margin-top:16px; line-height:1.6; white-space:nowrap; }
@media (max-width:480px){
  .signin-intro h1{ white-space:normal; }
  .signin-intro .signin-welcome{ white-space:normal; max-width:340px; margin-left:auto; margin-right:auto; }
}
.signin-form-card{ padding: 28px 24px 30px; }
.signin-form-card .eyebrow{ margin-top:22px; margin-bottom:12px; }
.signin-form-card .eyebrow:first-child{ margin-top:0; }
.signin-form-card .field{ margin-bottom:20px; }
.kiosk-home-btn{
  display:flex; align-items:center; justify-content:center; margin: 10px auto 28px;
  width:42px; height:42px; border-radius:50%; background: var(--mist-deep); border:1px solid var(--line);
  color: var(--ink-faint);
}
.kiosk-home-btn svg{ width:17px; height:17px; }
.signin-hero{ position:relative; width:100%; height:34vh; min-height:200px; max-height:320px; overflow:hidden; flex:none; }
.signin-hero img{ width:100%; height:100%; object-fit:cover; display:block; }
.signin-hero-fade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0) 40%, var(--mist) 97%); }
.signin-screen.has-hero .signin-brandline{ margin-top:-52px; position:relative; z-index:2; }
.signin-confirm-wrap{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px;
}
.signin-confirm-wrap h1{ font-size:27px; margin: 16px 0 8px; }
.signin-confirm-wrap p{ color: var(--ink-soft); font-size:15px; max-width:320px; line-height:1.6; }
.signin-confirm-wrap .glyph-ring{
  width:64px; height:64px; border-radius:50%; background: var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-2);
}

/* ---------- Neighbor Home Value Follow-Up (one extra sign-in phase, Neighbors only) ----------
   Reuses .signin-screen/.section-head/.card/.toggle-row/.chip/.field/.btn-primary exactly as the
   main sign-in form so it reads as step 2 of the same form. Two small scoped pieces below are
   intentionally NOT the shared .kicker-row/.signin-intro: this screen's property-context line
   and heading are deliberately more compact/quiet than the main form's (a tighter "editorial"
   intro instead of a second full-size hero heading), while still using the same font tokens
   (--serif/--sans), colors and centering — this never touches the main form's own heading. */
.neighbor-context{
  display:flex; align-items:center; justify-content:center; gap:6px;
  color: var(--ink-soft); font-size:13px; font-weight:600; margin: 2px 0 20px;
}
.neighbor-context svg{ width:13px; height:13px; flex:none; opacity:.7; }
.neighbor-heading-wrap{ text-align:center; margin: 0 0 26px; }
.neighbor-heading-wrap h1{
  font-family: var(--serif); font-weight:700; letter-spacing:-0.02em; color: var(--ink);
  font-size:20px; line-height:1.3; max-width:300px; margin:0 auto 8px;
}
.neighbor-heading-wrap p{
  color: var(--ink-soft); font-weight:400; font-size:14.5px; line-height:1.55;
  max-width:270px; margin:0 auto;
}
.neighbor-address-reveal{
  max-height:0; opacity:0; overflow:hidden;
  transition: max-height .4s var(--ease), opacity .3s var(--ease), margin-top .4s var(--ease);
}
/* overflow:visible once expanded — otherwise the address-autocomplete suggestions list
   (which pops open below the input) would be clipped by this wrapper's own bounds. */
.neighbor-address-reveal.show{ max-height:320px; opacity:1; margin-top:14px; overflow:visible; }

/* ---------- Address autocomplete ---------- */
.autocomplete-wrap{ position:relative; }
.autocomplete-list{
  position:absolute; left:0; right:0; top:100%; margin-top:4px; background: var(--paper);
  border:1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow-2);
  z-index:5; max-height:220px; overflow-y:auto;
}
.autocomplete-item{ padding:12px 16px; font-size:14px; border-bottom:1px solid var(--line-soft); }
.autocomplete-item:last-child{ border-bottom:none; }
.autocomplete-item:active{ background: var(--mist); }
.autocomplete-item .ac-tag{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint); display:block; margin-top:2px; }

/* ---------- Contact card ---------- */
.contact-name-input{
  width:100%; text-align:center; border:none; background:transparent; font-family:var(--serif);
  font-size:21px; font-weight:700; color: var(--ink); padding:6px 4px;
}
.contact-name-input:focus{ outline:none; background: var(--mist); border-radius: var(--r-sm); }
.contact-sub-row{ display:flex; gap:8px; margin-top:4px; }
.contact-sub-input{
  flex:1; text-align:center; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding:10px 12px; font-size:14px; color: var(--ink-soft);
}
.contact-sub-input:focus{ outline:none; border-color: var(--ink); background: var(--paper); color: var(--ink); }

/* ---------- Follow-up action button ---------- */
.btn-followup-done{
  width:100%; background: var(--paper); border:1.5px solid var(--ink); color: var(--ink);
  border-radius: var(--r-pill); padding:14px 20px; font-weight:600; font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition: all .15s var(--ease-spring);
}
.btn-followup-done svg{ width:16px; height:16px; }
.btn-followup-done:active{ transform: scale(.97); background: var(--mist); }
.btn-followup-done.done{ background: var(--ink); color:#fff; border-color: var(--ink); }
#followup-done-wrap.hidden{ display:none; }

/* ---------- Preferred Areas (tag input) ---------- */
.area-chip{
  display:inline-flex; align-items:center; gap:7px; background: var(--mist); border:1px solid var(--line);
  border-radius: var(--r-pill); padding:9px 9px 9px 16px; font-size:14px; font-weight:600; color: var(--ink);
}
.area-chip button{
  background: var(--mist-deep); border:none; border-radius:50%; width:20px; height:20px; flex:none;
  display:flex; align-items:center; justify-content:center; color: var(--ink-soft); font-size:14px; line-height:1;
}
.area-add-row{ display:flex; gap:8px; margin-top:14px; }
.area-add-row input{
  flex:1; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding:13px 14px; font-size:15px; -webkit-appearance:none;
}
.area-add-row input:focus{ outline:none; border-color: var(--ink); background: var(--paper); }

/* ---------- Admin Settings ---------- */
.settings-swatch{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); padding:0; overflow:hidden; background:none; }
.settings-row{ display:flex; align-items:center; gap:14px; justify-content:space-between; }
.settings-help{ font-size:12.5px; color: var(--ink-faint); line-height:1.55; margin-top:8px; }
.logo-preview-wrap{ display:flex; align-items:center; gap:14px; }
.logo-preview{ width:56px; height:56px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background: var(--mist); }
.logo-placeholder{ width:56px; height:56px; border-radius:50%; background: var(--mist-deep); display:flex; align-items:center; justify-content:center; color: var(--ink-faint); flex:none; }
.file-btn-wrap{ position:relative; overflow:hidden; display:inline-block; }
.file-btn-wrap input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.file-btn-wrap input[type=file][disabled]{ pointer-events:none; }

/* ---------- Property Photo management (Edit Property sheet) ---------- */
.photo-manage-preview{
  width:100%; height:140px; border-radius: var(--r-sm); overflow:hidden; background: var(--mist-deep);
  margin-bottom:12px; display:flex; align-items:center; justify-content:center;
}
.photo-manage-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-manage-controls{ display:flex; gap:8px; flex-wrap:wrap; }
.photo-manage-status{
  font-size:12.5px; margin-top:10px; min-height:16px; color: var(--ink-soft);
  display:flex; align-items:center; gap:7px; line-height:1.4;
}
.photo-manage-status.error{ color: var(--danger); }
.photo-manage-status.success{ color: var(--success); }
.photo-spinner{
  width:12px; height:12px; border-radius:50%; flex:none;
  border:2px solid var(--line); border-top-color: var(--ink-soft);
  animation: photo-spin .7s linear infinite;
}
@keyframes photo-spin{ to{ transform: rotate(360deg); } }
.optlist-caption{ font-size:12px; color: var(--ink-faint); margin-bottom:12px; line-height:1.5; }
.signin-brand-ring img, .welcome-logo img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
.welcome-logo{ width:40px; height:40px; border-radius:50%; margin:0 auto 10px; overflow:hidden; }

/* ---------- Option Manager / Section & Field Controls rows ---------- */
.optrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft); }
.optrow:last-of-type{ border-bottom:none; }
.optrow-label{ font-size:14.5px; color:var(--ink); flex:1; }
.optrow-rename{ flex:1; border:1px solid var(--line); background:var(--mist); border-radius:10px; padding:9px 12px; font-size:14.5px; margin-right:10px; -webkit-appearance:none; }
.optrow-rename:focus{ outline:none; border-color:var(--ink); background:var(--paper); }
.optrow-actions{ display:flex; gap:4px; flex:none; }
.optrow-actions button{ background:var(--mist-deep); border:none; border-radius:8px; padding:6px 9px; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
.optrow-actions button:active{ background:var(--line); }
.archived-row{ opacity:.55; }
.settings-hub-card{ cursor:pointer; }
.settings-hub-card:active{ transform:scale(.98); }
.settings-hub-icon{ width:44px; height:44px; border-radius:12px; background:var(--mist-deep); display:flex; align-items:center; justify-content:center; flex:none; color: var(--ink-soft); }
.settings-hub-title{ font-size:15.5px; font-weight:600; color: var(--ink); }
.settings-hub-sub{ font-size:12.5px; color: var(--ink-faint); margin-top:2px; line-height:1.4; }
.settings-hub-chev{ color: var(--ink-faint); flex:none; }
.content-search-wrap{ margin-bottom:18px; }
.content-search-wrap input{ width:100%; border:1px solid var(--line); background:var(--mist); border-radius: var(--r-sm); padding:13px 16px; font-size:15px; -webkit-appearance:none; }
.content-search-wrap input:focus{ outline:none; border-color:var(--ink); background:var(--paper); }
.hidden{ display:none !important; }
.sync-banner{ position:fixed; top:0; left:0; right:0; z-index:9999; text-align:center; font-size:12.5px; font-weight:600; padding:7px 10px; color:#fff; background:#b23b3b; }
.sync-banner.connecting{ background:#8a7a3b; }
.sync-status-pill{ display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em; }
.sync-status-pill.connected{ background:#e2f0e6; color:#2f6b45; }
.sync-status-pill.connecting{ background:#f3edd8; color:#8a7423; }
.sync-status-pill.error{ background:#f6dede; color:#a3372f; }
.sync-status-pill.off{ background:var(--mist-deep); color:var(--ink-faint); }
</style>

<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS
   ============================================================ */
var VISIT_REASONS = ["Downsizing","Relocating","First Home","Investor","Upsizing","Just Exploring"];
/* fixed internal keys — never shown to admins, never renamed. Only the paired label arrays
   (in CONTENT_DEFAULTS.optionLists, mutable via Admin Settings) are ever renamed, so stored
   visitor records never lose their meaning even after the display text changes. */
var TIMELINE_KEYS = ["unknown","0-3","3-6","6-12","browsing"];
var REP_KEYS = ["represented","unrepresented","not-discussed"];
var VISIT_PURPOSE_KEYS = ["buy","sell","both","neighbor","exploring","browsing","investing"];
var CONTACT_TYPE_KEYS = ["buyer","seller","both","neighbor","investor","vendor","other"];

var TIMELINES = [["unknown","Unknown"],["0-3","0–3 months"],["3-6","3–6 months"],["6-12","6–12 months"],["browsing","Just looking"]];
var REP_STATUSES = [["represented","Represented"],["unrepresented","Unrepresented"],["not-discussed","Not Discussed"]];
var VISIT_PURPOSES = [["buy","Looking to Buy"],["sell","Looking to Sell"],["both","Buying & Selling"],["neighbor","Neighbor"],["exploring","Exploring the Area"],["browsing","Just Browsing"],["investing","Investing"]];
var CONTACT_TYPES = [["buyer","Buyer"],["seller","Seller"],["both","Buy + Sell"],["neighbor","Neighbor"],["investor","Investor"],["vendor","Vendor"],["other","Other"]];
/* Contact Type is auto-derived from what the visitor already told us at sign-in, so nobody
   has to stop and manually classify every guest. The agent can still tap the pill to correct it. */
var CONTACT_TYPE_AUTO_MAP = { buy:"buyer", sell:"seller", both:"both", neighbor:"neighbor", exploring:"buyer", browsing:"buyer", investing:"investor" };

/* "Real Estate Goal" (Their Home Search) reuses the visitPurpose field above — Investing was
   added as a 7th option specifically for that purpose. "Timeline" reuses buyingTimeline. */
var PARTY_SIZE_OPTIONS = ["1","2","3","4","5+"];

var BEDS_OPTIONS = ["1","2","3","4","5","6+"];
var BATHS_OPTIONS = ["1","1.5","2","2.5","3","3.5","4","4.5","5+"];
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

/* Organized into categories so the Motivation picker can show Category → Specific Feedback.
   All 12 pre-existing values are preserved verbatim (only reordered into groups) — no renames. */
var MOTIVATION_CATEGORIES = [
  { name:"Life Stage",              options:["First Home","Upsizing","Downsizing","Retiring"] },
  { name:"Life Change",             options:["Relocating","Job Change","Lifestyle Change","Closer to Family","PCSing"] },
  { name:"Real Estate / Financial", options:["Investment","Selling Current Home"] },
  { name:"Exploring",               options:["Exploring"] }
];
var MOTIVATION_OPTIONS = MOTIVATION_CATEGORIES.reduce(function(acc,c){ return acc.concat(c.options); }, []);

/* Nice-to-Haves — standardized onto the same taxonomy as Must-Haves. RENAME MAP (see
   NICE_TO_HAVE_RENAMES below) preserves already-saved selections that used old wording.
   A few pre-existing values ("Close to Shopping", "Solar Owned", "ADU Potential",
   "Low Mello-Roos") aren't part of the new named categories but are kept in
   LEGACY_NICE_TO_HAVE_EXTRAS below so they still surface (via the picker's automatic "More"
   tile) instead of silently disappearing for anyone who already selected them. */
var PREFERENCE_CATEGORIES = [
  { name:"Home Style & Layout", options:["Single Story","Two Story","Primary Bedroom on Main Level","Open Floor Plan","Home Office","Guest Room"] },
  { name:"Size & Space",        options:["2+ Bedrooms","3+ Bedrooms","4+ Bedrooms","2+ Bathrooms","3+ Bathrooms","Extra Storage"] },
  { name:"Kitchen & Condition", options:["Updated Kitchen","Large Kitchen","Move-In Ready","Newer / Updated Home"] },
  { name:"Outdoor & Lot",       options:["Large Backyard","Pool","Large Lot","Views","Patio / Outdoor Entertaining","Low-Maintenance Yard"] },
  { name:"Garage & Parking",    options:["2-Car Garage","3-Car Garage","RV / Boat Parking","Extra Driveway Parking"] },
  { name:"Location & Community", options:["Quiet Street","Cul-de-Sac","Gated Community","Walkable","Nearby Parks","Good School District"] },
  { name:"Cost & HOA",          options:["Low HOA","No HOA","No Mello-Roos"] }
];
var LEGACY_NICE_TO_HAVE_EXTRAS = ["Close to Shopping","Solar Owned","ADU Potential","Low Mello-Roos"];
var ALL_PREF_OPTIONS = PREFERENCE_CATEGORIES.reduce(function(acc,c){ return acc.concat(c.options); }, []).concat(LEGACY_NICE_TO_HAVE_EXTRAS);
var NICE_TO_HAVE_RENAMES = {
  "Primary Bedroom on First Floor": "Primary Bedroom on Main Level",
  "Three-Car Garage": "3-Car Garage",
  "RV Parking": "RV / Boat Parking",
  "Close to Parks": "Nearby Parks"
};

var PREFERRED_AREA_SEED = ["Chula Vista","Eastlake","Rancho Bernardo","Otay Ranch","Eastlake Vistas"];

var FONT_PAIRINGS = {
  classic:   { label:"Classic Serif",  serif:'"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif', sans:'-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif' },
  modern:    { label:"Modern Minimal", serif:'Georgia,"Times New Roman",serif', sans:'"Helvetica Neue",Arial,sans-serif' },
  editorial: { label:"Editorial",      serif:'"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif', sans:'"Segoe UI",-apple-system,Arial,sans-serif' }
};

/* legacy (Sprint 2.2) flat preference library, needed only for migrating old saved data */
var LEGACY_V2_PREFERENCE_LIBRARY = ["Single Story","Primary Bedroom on First Floor","2+ Bedrooms","3+ Bedrooms","4+ Bedrooms",
  "2+ Bathrooms","3+ Bathrooms","Open Floor Plan","Large Kitchen","Updated Kitchen","Move-In Ready",
  "Home Office","Guest Room","Large Backyard","Low-Maintenance Yard","Pool","Views","Two-Car Garage",
  "Three-Car Garage","RV Parking","ADU Potential","No HOA","Low HOA","No Mello-Roos","Low Mello-Roos",
  "Solar Owned","Quiet Street","Good School District","Close to Parks","Close to Shopping","Other"];

var FINANCING_TYPES = ["Cash","Conventional","FHA","VA","USDA","Jumbo","Unknown"];
/* Pre-Approval Status is reused as "Financing Status" under Their Home Search — Cash was
   folded in so a cash buyer's status can be captured in this same field. */
var PREAPPROVAL_STATUSES = ["Cash","Pre-Approved","Speaking With Lender","Needs Lender","Not Started","Unknown"];
var HOUSEHOLD_SIZES = ["1","2","3","4","5","6+"];
var CHILDREN_STATUSES = ["Yes","No","Not Discussed"];
var PET_OPTIONS = ["Dog","Cat","Multiple Pets","No Pets","Not Discussed"];
var PET_EXCLUSIVE = ["No Pets","Not Discussed"];
/* Reused as "This Home > Concerns" (formerly "What They Didn't Like") — organized into
   categories so the picker can show Category → Specific Feedback instead of one long list.
   RENAME MAP below preserves any already-saved selections/admin option-list entries that used
   the old pre-consolidation wording (see migrateContentShape/migrateVisitorRecord). */
var DEALBREAKER_CATEGORIES = [

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---- Data Sync (optional Firebase backend) — off by default; a device is only ever
   a client of this if an admin pastes in Firebase config or a paired sync code. ---- */
function defaultSyncConfig(){

}
function defaultState(){
  return { openHouses: [], visitors: [], activeOpenHouseId: null, settings: { adminPasscode: "" }, content: deepMergeDefaults({}, CONTENT_DEFAULTS), sync: defaultSyncConfig() };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY_V3) || localStorage.getItem(LEGACY_STORAGE_KEY_V2) || localStorage.getItem(LEGACY_STORAGE_KEY_V1);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.openHouses) return parsed;
    }
  }catch(e){}
  return defaultState();
}

/* ---- content configuration: deep-merge saved overrides onto current defaults so any
   new keys introduced in a future release are always present, while preserving every
   edit an admin has already made ---- */
function deepMergeDefaults(target, defaults){
  if(typeof defaults !== "object" || defaults===null){
    return target!==undefined ? target : defaults;
  }
  if(Array.isArray(defaults)){
    /* deep-clone (not reference-share) so admin edits never mutate CONTENT_DEFAULTS itself —
       that shared object is also what "Reset to Default" reads from. */
    return target!==undefined ? target : JSON.parse(JSON.stringify(defaults));
  }
  target = (target && typeof target==="object" && !Array.isArray(target)) ? target : {};
  Object.keys(defaults).forEach(function(k){ target[k] = deepMergeDefaults(target[k], defaults[k]); });
  return target;
}
function cfg(path){ var v = getPath(state.content, path); return v===undefined ? getPath(CONTENT_DEFAULTS, path) : v; }
function slugify(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || uid(); }

  };

function formatPhoneDisplay(raw){

  if(digits.length===10) return "("+digits.slice(0,3)+") "+digits.slice(3,6)+"-"+digits.slice(6);

}

/* ---- Shared migration steps, used both at local boot (migrateState) AND every time
   remote data arrives via Firebase Sync (Sync.applyRemote). This split exists because of
   a regression: applyRemote used to rebuild state.content with deepMergeDefaults alone,
   skipping every one-time shape migration below — so a stale remote snapshot (pushed by
   any device that hadn't loaded the current version yet) would silently overwrite an
   already-upgraded local shape, e.g. resetting the Visitor Profile's section list back to
   its pre-Command-Center ids and making "This Home"/"Their Home Search" disappear even
   though the code rendering them was correct. Every place state.content gets rebuilt from
   a serialized source must run through migrateContentShape() so this can't happen again. */
function migrateContentShape(){
  migrateKeyedListShape("contactTypes", "contactTypeLabels", CONTACT_TYPE_KEYS);
  migrateKeyedListShape("visitPurposes", "visitPurposeLabels", VISIT_PURPOSE_KEYS);
  migrateKeyedListShape("timelines", "timelineLabels", TIMELINE_KEYS);
  migrateKeyedListShape("representations", "representationLabels", REP_KEYS);
  migrateTeamMemberShape();
  mergeNewKeyedOption("visitPurposes", "investing", "Investing");
  /* "What They Didn't Like" → "Concerns" (neutral, professional language) — only applied if
     the label was still the un-customized old default. */
  renameContentDefaultIfUnchanged("pages.visitorDetail.sectionDealBreakers", "What They Didn't Like", "Concerns");
  Object.keys(DEALBREAKER_RENAMES).forEach(function(old){ renameOptionListItem("dealBreakerOptions", old, DEALBREAKER_RENAMES[old]); });
  Object.keys(THIS_HOME_LIKED_RENAMES).forEach(function(old){ renameOptionListItem("thisHomeLikedOptions", old, THIS_HOME_LIKED_RENAMES[old]); });
  mergeNewSimpleOptionItems("dealBreakerOptions", DEALBREAKER_OPTIONS);
  mergeNewSimpleOptionItems("thisHomeLikedOptions", THIS_HOME_LIKED_OPTIONS);
  /* Their Home Search categorized-picker update: Must-Haves / Deal Breakers both have an
     admin-editable option list, so renames + new-item merges follow the same established
     pattern as Concerns/What They Liked above. Motivation only got reordered (no renames/new
     items) so it needs no extra step; Nice-to-Haves has no admin option list (never did — see
     ALL_PREF_OPTIONS/LEGACY_NICE_TO_HAVE_EXTRAS) so it's handled purely at the visitor-record
     level below. */
  Object.keys(MUST_HAVE_RENAMES).forEach(function(old){ renameOptionListItem("mustHaveOptions", old, MUST_HAVE_RENAMES[old]); });
  Object.keys(SEARCH_DEALBREAKER_RENAMES).forEach(function(old){ renameOptionListItem("searchDealBreakerOptions", old, SEARCH_DEALBREAKER_RENAMES[old]); });
  mergeNewSimpleOptionItems("mustHaveOptions", MUST_HAVE_OPTIONS);
  mergeNewSimpleOptionItems("searchDealBreakerOptions", SEARCH_DEALBREAKER_OPTIONS);
  /* Neighbor Home Value Follow-Up: "Prepare Market Analysis" is a new Next Action option. */
  mergeNewSimpleOptionItems("nextActions", NEXT_ACTIONS);
  mergeNewSimpleOptionItems("preApprovalStatuses", PREAPPROVAL_STATUSES);
  migrateVisitorDetailSectionsV2();
  mergeNewFieldConfigs("visitorDetailSimple");
}
/* Same rationale for individual visitor records: any place a visitor record is adopted
   from a serialized source (local storage OR a remote sync payload) must run it through
   this exact normalizer, or a stale/foreign copy of a record can reintroduce missing fields. */
function migrateVisitorRecord(v){
  if(v.storyAnchor !== undefined){ if(v.reasonForVisit===undefined) v.reasonForVisit = v.storyAnchor; delete v.storyAnchor; }
  if(v.reasonForVisit===undefined) v.reasonForVisit = "";
  if(v.representationStatus === "has-agent") v.representationStatus = "represented";
  if(v.representationStatus === "unsure") v.representationStatus = "not-discussed";
  if(!v.representationStatus) v.representationStatus = "not-discussed";
  if(!v.buyingTimeline) v.buyingTimeline = "unknown";
  if(v.storyNote===undefined) v.storyNote = "";
  if(v.visitPurpose===undefined) v.visitPurpose = "";
  if(v.visitPurposeOther===undefined) v.visitPurposeOther = "";
  if(!v.contactType) v.contactType = CONTACT_TYPE_AUTO_MAP[v.visitPurpose] || "buyer";
  if(v.source===undefined) v.source = "agent";
  if(v.phone){ var f = formatPhoneDisplay(v.phone); if(f) v.phone = f; }
  /* Group vs. Visitor counting: every sign-in record is one Group; partySize is how many
     people came with it. Records captured before this field existed default to 1 (the safe,
     conservative assumption — never inflates historical visitor counts). */
  if(!v.partySize) v.partySize = "1";
  v.detail = migrateVisitorDetail(v.detail);
  /* Consolidate any already-saved Concerns / What They Liked selections that used the old
     pre-consolidation wording — see DEALBREAKER_RENAMES / THIS_HOME_LIKED_RENAMES. Existing
     feedback is preserved, just relabeled to its cleaner equivalent. */
  Object.keys(DEALBREAKER_RENAMES).forEach(function(old){ renameSelectedValue(v.detail.dealBreakers.selected, old, DEALBREAKER_RENAMES[old]); });
  Object.keys(THIS_HOME_LIKED_RENAMES).forEach(function(old){ renameSelectedValue(v.detail.thisHome.liked, old, THIS_HOME_LIKED_RENAMES[old]); });
  /* Same consolidation for the Their Home Search categorized-picker update — Must-Haves,
     Nice-to-Haves, and Deal Breakers each preserve already-saved selections under their
     cleaner, de-duplicated wording. Motivation has no renames. */
  Object.keys(MUST_HAVE_RENAMES).forEach(function(old){ renameSelectedValue(v.detail.mustHaves.selected, old, MUST_HAVE_RENAMES[old]); });
  Object.keys(NICE_TO_HAVE_RENAMES).forEach(function(old){ renameSelectedValue(v.detail.niceToHaves.selected, old, NICE_TO_HAVE_RENAMES[old]); });
  Object.keys(SEARCH_DEALBREAKER_RENAMES).forEach(function(old){ renameSelectedValue(v.detail.searchDealBreakers.selected, old, SEARCH_DEALBREAKER_RENAMES[old]); });
  return v;
}
function migrateState(){
  if(!state.settings) state.settings = { adminPasscode: "" };
  if(!state.sync) state.sync = defaultSyncConfig();
  state.content = deepMergeDefaults(state.content, CONTENT_DEFAULTS);
  migrateContentShape();
  state.visitors.forEach(migrateVisitorRecord);
  syncOptionListsFromContent();
}

function saveState(){
  /* Returns true/false so callers that need real confirmation (e.g. the property photo
     upload flow) can tell an actual persisted save apart from a silently-dropped one — most
     existing callers ignore this return value entirely, which is unaffected. A write can fail
     here if the JSON (most often a large embedded photo) exceeds the browser's localStorage
     quota; previously that failure was swallowed with no feedback anywhere in the app. */
  var ok = true;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ ok = false; }
  if(typeof Sync !== "undefined" && Sync && Sync.push) Sync.push();
  return ok;
}

function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

function getPath(obj, path){
  var parts = path.split("."); var o = obj;
  for(var i=0;i<parts.length;i++){ if(o==null) return undefined; o = o[parts[i]]; }
  return o;
}
function setPath(obj, path, val){
  var parts = path.split("."); var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}

function formatDateLong(iso){
  if(!iso) return "";
  var parts = iso.split("-"); var d = new Date(parts[0], parts[1]-1, parts[2]);
  if(cfg("formats.dateFormat")==="numeric") return pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear();
  return d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
}
function formatDateShort(iso){
  if(!iso) return "";
  var parts = iso.split("-"); var d = new Date(parts[0], parts[1]-1, parts[2]);
  if(cfg("formats.dateFormat")==="numeric") return pad(d.getMonth()+1)+"/"+pad(d.getDate());
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}
function formatTime(t){
  if(!t) return "";
  var bits = t.split(":"); var h = parseInt(bits[0],10); var m = bits[1];
  if(cfg("formats.timeFormat")==="24h") return pad(h)+":"+m;
  var ap = h>=12 ? "PM" : "AM"; var h12 = h%12; if(h12===0) h12=12;
  return h12 + ":" + m + " " + ap;
}
function timeRange(oh){ return formatTime(oh.startTime) + " – " + formatTime(oh.endTime); }
function formatSignInTime(ts){
  if(!ts) return "";
  var d = new Date(ts);
  var h = d.getHours(), m = pad(d.getMinutes());
  if(cfg("formats.timeFormat")==="24h") return pad(h)+":"+m;
  var ap = h>=12 ? "PM" : "AM"; var h12 = h%12; if(h12===0) h12=12;
  return h12 + ":" + m + " " + ap;
}
/* A phone number is only a problem when it's partially entered — 1 to 9 digits.
   Blank is fine (nobody's required to give a phone unless the field says so
   elsewhere), and 10 digits is a complete number. This only catches the case a
   visitor got interrupted mid-digit and the form let it through anyway. */
function phoneIncomplete(phone){
  if(!phone) return false;
  var digits = String(phone).replace(/[^0-9]/g,"");
  return digits.length > 0 && digits.length < 10;
}
function chronologicalQueue(list){

}
function propertyTitle(oh){ return oh.address || "Untitled Property"; }
function propertyCityLine(oh){

  if(oh.city) bits.push(oh.city);
  if(oh.stateAbbr) bits.push(oh.stateAbbr);
  if(oh.zip) bits.push(oh.zip);
  return bits.join(", ").replace(", "+oh.stateAbbr+", ", ", "+oh.stateAbbr+" ");
}
function propertyOneLine(oh){
  var bits = [propertyTitle(oh)];
  var cityLine = propertyCityLine(oh);
  if(cityLine) bits.push(cityLine);
  return bits.join(", ");
}
function fmtPrice(p){
  if(p==null || p==="") return "";
  var n = parseFloat(String(p).replace(/[^0-9.]/g,""));
  if(isNaN(n)) return p;
  return (cfg("formats.currencySymbol")==="off" ? "" : "$")+n.toLocaleString("en-US");
}
function bindCurrencyInput(inputEl, initialValue){
  if(initialValue !== "" && initialValue != null){ inputEl.value = fmtPrice(initialValue); }
  inputEl.addEventListener("input", function(){
    var digits = inputEl.value.replace(/[^0-9]/g,"");
    if(!digits){ inputEl.value=""; return; }
    inputEl.value = (cfg("formats.currencySymbol")==="off" ? "" : "$")+parseInt(digits,10).toLocaleString("en-US");
  });
}
function currencyValue(inputEl){
  var digits = inputEl.value.replace(/[^0-9]/g,"");
  return digits ? parseInt(digits,10) : "";
}
function formatPhoneProgressive(digits){
  digits = digits.slice(0,10);
  var len = digits.length;
  if(len===0) return "";
  if(cfg("formats.phoneStyle")==="dashes"){
    if(len<4) return digits;
    if(len<7) return digits.slice(0,3)+"-"+digits.slice(3);
    return digits.slice(0,3)+"-"+digits.slice(3,6)+"-"+digits.slice(6);
  }
  if(len<4) return "("+digits;
  if(len<7) return "("+digits.slice(0,3)+") "+digits.slice(3);
  return "("+digits.slice(0,3)+") "+digits.slice(3,6)+"-"+digits.slice(6);
}
function bindPhoneInput(inputEl, onChange){
  inputEl.addEventListener("input", function(){
    var digits = inputEl.value.replace(/[^0-9]/g,"");
    inputEl.value = formatPhoneProgressive(digits);
    if(onChange) onChange(inputEl.value);
  });
}

/* ---- status + priority logic ---- */
function visitorsFor(openHouseId){
  return state.visitors.filter(function(v){ return v.openHouseId === openHouseId; });
}
function hasFollowUpCommitment(d){
  return !!((d.followUp.promise && d.followUp.promise.trim()) || d.followUp.nextAction);
}
function visitorStatus(v){
  var d = v.detail;
  var needsFollowUp = hasFollowUpCommitment(d) && d.followUp.status !== "Completed";
  var needsCapture = v.capturedLater && !d.notesComplete;
  if(needsFollowUp) return "follow-up";
  if(needsCapture) return "capture";
  return "complete";
}
function isMeaningfulOpportunity(v){
  return v.representationStatus === "unrepresented" || v.buyingTimeline === "0-3" || v.buyingTimeline === "3-6";
}
function priorityScore(v){
  var d = v.detail;
  var s = 0;
  var st = visitorStatus(v);
  if(st==="follow-up") s += 30;
  if(st==="capture") s += 10;
  if(v.representationStatus==="unrepresented") s += 8;
  if(v.buyingTimeline==="0-3") s += 8;
  else if(v.buyingTimeline==="3-6") s += 5;
  else if(v.buyingTimeline==="6-12") s += 2;
  if(d.connectionSummary && d.connectionSummary.trim()) s += 2;
  return s;
}
function sortedQueue(list){
  var order = { "follow-up":0, "capture":1, "complete":2 };
  return list.slice().sort(function(a,b){
    var oa = order[visitorStatus(a)], ob = order[visitorStatus(b)];
    if(oa !== ob) return oa - ob;
    return priorityScore(b) - priorityScore(a) || (b.createdAt - a.createdAt);
  });
}
function highestPriorityConnection(list){
  if(!list.length) return null;
  var sorted = list.slice().sort(function(a,b){ return priorityScore(b)-priorityScore(a) || (b.createdAt-a.createdAt); });
  return sorted[0];
}

/* ---- own-history address suggestions (works fully offline) ---- */
function ownHistorySuggestions(query){
  var q = query.trim().toLowerCase();
  if(q.length<2) return [];
  var seen = {};
  var results = [];
  state.openHouses.slice().sort(function(a,b){ return b.createdAt-a.createdAt; }).forEach(function(oh){
    var addr = (oh.address||"").toLowerCase();
    if(addr && addr.indexOf(q)>-1 && !seen[oh.address]){
      seen[oh.address] = true;
      results.push(oh);
    }
  });
  return results.slice(0,5);
}

/* ---- preferred-area suggestions: seed list + every area any visitor has used, offline ---- */
function preferredAreaSuggestions(query){
  var q = (query||"").trim().toLowerCase();
  var seen = {}; var results = [];
  var all = PREFERRED_AREA_SEED.slice();
  state.visitors.forEach(function(v){ (v.detail.preferredAreas||[]).forEach(function(a){ all.push(a); }); });
  all.forEach(function(a){
    var key = a.toLowerCase();
    if(seen[key]) return;
    if(q && key.indexOf(q)===-1) return;
    seen[key] = true; results.push(a);
  });
  return results.slice(0,6);
}

   BOTTOM SHEET
   ============================================================ */
var sheetStack = [];
function openSheet(html, onMount){
  var backdrop = document.createElement("div");
  backdrop.className = "sheet-backdrop";
  var sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = '<div class="sheet-handle"></div>' + html;
  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);
  requestAnimationFrame(function(){ backdrop.classList.add("show"); sheet.classList.add("show"); });
  backdrop.addEventListener("click", function(){ closeSheet(); });
  function closeSheet(){
    backdrop.classList.remove("show"); sheet.classList.remove("show");
    setTimeout(function(){ backdrop.remove(); sheet.remove(); }, 320);
    sheetStack.pop();
  }
  sheetStack.push(closeSheet);
  if(onMount) onMount(sheet, closeSheet);
  return closeSheet;
}

function attachAddressAutocomplete(sheet, prefix){
  var input = sheet.querySelector("#"+prefix+"-address");
  var wrap = input.closest(".autocomplete-wrap");
  var fieldRefs = {
    city: sheet.querySelector("#"+prefix+"-city"),
    state: sheet.querySelector("#"+prefix+"-state"),
    zip: sheet.querySelector("#"+prefix+"-zip"),
    beds: sheet.querySelector("#"+prefix+"-beds"),
    baths: sheet.querySelector("#"+prefix+"-baths"),
    sqft: sheet.querySelector("#"+prefix+"-sqft"),
    price: sheet.querySelector("#"+prefix+"-price")
  };
  var listEl = null;
  var debounceTimer = null;

  function closeList(){ if(listEl){ listEl.remove(); listEl = null; } }
  function renderList(items){
    closeList();
    if(!items || !items.length) return;
    listEl = document.createElement("div");
    listEl.className = "autocomplete-list";
    listEl.innerHTML = items.map(function(it,i){
      return '<div class="autocomplete-item" data-ac-idx="'+i+'">'+esc(it.label)+'<span class="ac-tag">'+esc(it.tag)+'</span></div>';
    }).join("");
    wrap.appendChild(listEl);
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-ac-idx]"), function(el){
      el.addEventListener("mousedown", function(e){ e.preventDefault(); });
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-ac-idx"),10);
        applySuggestion(items[idx]);
        closeList();
      });
    });
  }
  function applySuggestion(item){
    input.value = item.address || input.value;
    if(item.city!=null) fieldRefs.city.value = item.city;
    if(item.state!=null) fieldRefs.state.value = item.state;
    if(item.zip!=null) fieldRefs.zip.value = item.zip;
    if(item.beds!=null && !fieldRefs.beds.value) fieldRefs.beds.value = item.beds;
    if(item.baths!=null && !fieldRefs.baths.value) fieldRefs.baths.value = item.baths;
    if(item.sqft!=null && !fieldRefs.sqft.value) fieldRefs.sqft.value = item.sqft;
    if(item.price!=null && item.price!=="" && !fieldRefs.price.value){ fieldRefs.price.value = fmtPrice(item.price); }
  }
  input.addEventListener("input", function(){
    clearTimeout(debounceTimer);
    var q = input.value;
    if(q.trim().length<3){ closeList(); return; }
    debounceTimer = setTimeout(function(){
      var historyItems = ownHistorySuggestions(q).map(function(oh){
        return { label: oh.address, tag:"Previously hosted", address: oh.address, city: oh.city, state: oh.stateAbbr, zip: oh.zip, beds: oh.beds, baths: oh.baths, sqft: oh.sqft, price: oh.price };
      });
      renderList(historyItems);
      if(typeof fetch === "function"){
        var controller = (typeof AbortController === "function") ? new AbortController() : null;
        var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, 3000) : null;
        fetch("https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=us&limit=5&q="+encodeURIComponent(q), controller ? {signal:controller.signal} : {})
          .then(function(res){ return res.json(); })
          .then(function(data){
            if(timeoutId) clearTimeout(timeoutId);
            var liveItems = (data||[]).map(function(r){
              var a = r.address || {};
              var street = [a.house_number,a.road].filter(Boolean).join(" ");
              return { label: r.display_name, tag:"Address lookup", address: street||r.display_name, city: a.city||a.town||a.village||"", state: stateAbbrFromName(a.state||""), zip: a.postcode||"" };
            });
            renderList(historyItems.concat(liveItems).slice(0,8));
          })
          .catch(function(){ /* offline or blocked — history suggestions remain visible */ });
      }
    }, 350);
  });
  input.addEventListener("blur", function(){ setTimeout(closeList, 200); });
}

/* Reads the file, downscales it (max 1600px on the long edge) and re-encodes it as a
   compressed JPEG via an offscreen canvas so the resulting base64 string is small enough to
   reliably fit in localStorage and sync quickly — full-resolution phone photos, once base64
   encoded, can easily exceed the browser's per-origin storage quota, which is what was
   silently failing before (see saveState()). Never rejects on a compression problem: if the
   image can't be decoded/drawn (or this runs somewhere without canvas support), it resolves
   with the original uncompressed data instead of blocking the upload. Only resolves null if
   the file itself couldn't be read at all. */
/* Photo persistence budget: kept well under typical browser per-origin localStorage quotas
   (5-10MB), leaving headroom for multiple properties' photos plus visitor data sharing the
   same storage. If a photo can't be brought under this size, we say so plainly rather than
   attempting the save and risking a silent/cryptic quota failure. */
var PHOTO_MAX_CHARS = 1.3 * 1024 * 1024;
/* Progressively smaller/lower-quality re-encodes, tried in order until one fits the budget. */
var PHOTO_COMPRESS_ATTEMPTS = [
  {maxDim:1600, quality:0.82},
  {maxDim:1280, quality:0.75},
  {maxDim:1024, quality:0.68},
  {maxDim:800,  quality:0.6},
  {maxDim:640,  quality:0.5}
];
function compressPhotoForStorage(file){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onerror = function(){ resolve({dataUrl:null, error:"Couldn't read that photo — try again."}); };
    reader.onload = function(){
      var rawDataUrl = String(reader.result || "");
      if(!rawDataUrl){ resolve({dataUrl:null, error:"Couldn't read that photo — try again."}); return; }
      var settled = false;
      function settle(v){ if(settled) return; settled = true; resolve(v); }
      /* If image decoding never completes (unsupported environment, or a very large file
         taking longer than expected on this device), fall back to the raw file ONLY if it's
         already small enough to safely persist as-is. Otherwise, fail with a clear message —
         silently attempting to save a multi-MB raw blob is what caused unreliable "it just
         doesn't work" uploads before. */
      var safetyTimer = setTimeout(function(){
        if(rawDataUrl.length <= PHOTO_MAX_CHARS){ settle({dataUrl:rawDataUrl, error:null}); }
        else{ settle({dataUrl:null, error:"This photo is taking too long to process on this device. Try a smaller photo."}); }
      }, 4000);
      try{
        var img = new Image();
        img.onerror = function(){
          clearTimeout(safetyTimer);
          if(rawDataUrl.length <= PHOTO_MAX_CHARS){ settle({dataUrl:rawDataUrl, error:null}); }
          else{ settle({dataUrl:null, error:"Couldn't read that photo — try again."}); }
        };
        img.onload = function(){
          clearTimeout(safetyTimer);
          try{
            var iw = img.naturalWidth || img.width || 1600, ih = img.naturalHeight || img.height || 1600;
            var best = null;
            for(var i=0;i<PHOTO_COMPRESS_ATTEMPTS.length;i++){
              var a = PHOTO_COMPRESS_ATTEMPTS[i];
              try{
                var scale = Math.min(1, a.maxDim / Math.max(iw, ih));
                var w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
                var canvas = document.createElement("canvas");
                canvas.width = w; canvas.height = h;
                var ctx = canvas.getContext && canvas.getContext("2d");
                if(!ctx) break;
                ctx.drawImage(img, 0, 0, w, h);
                var out = canvas.toDataURL("image/jpeg", a.quality);
                if(!out || out.length < 50) continue;
                if(!best || out.length < best.length) best = out;
                if(out.length <= PHOTO_MAX_CHARS) break;
              }catch(attemptErr){ /* try the next, smaller attempt */ }
            }
            if(!best){
              /* Canvas compression unavailable in this environment. Use the raw file only if
                 it's already small enough; otherwise fail clearly instead of guessing. */
              if(rawDataUrl.length <= PHOTO_MAX_CHARS){ settle({dataUrl:rawDataUrl, error:null}); }
              else{ settle({dataUrl:null, error:"This photo is too large to process on this device. Try a smaller photo."}); }
              return;
            }
            if(best.length > PHOTO_MAX_CHARS){
              settle({dataUrl:null, error:"This photo is still too large after compression. Try a different photo."});
              return;
            }
            settle({dataUrl:best, error:null});
          }catch(e){ settle({dataUrl:null, error:"Couldn't process that photo — try again."}); }
        };
        img.src = rawDataUrl;
      }catch(e){
        clearTimeout(safetyTimer);
        if(rawDataUrl.length <= PHOTO_MAX_CHARS){ settle({dataUrl:rawDataUrl, error:null}); }
        else{ settle({dataUrl:null, error:"Couldn't read that photo — try again."}); }
      }
    };
    reader.readAsDataURL(file);
  });
}

        wireRemoveButton(btn);
      }else if(!oh.photoDataUrl && existingRemoveBtn){
        existingRemoveBtn.remove();
      }
    }

    function handlePhotoFile(file){
      /* Guards against a second upload firing while the first is still processing/saving —
         the file input is also disabled below for the same reason. */
      if(photoUploading) return;
      photoUploading = true;
      if(photoFileInput) photoFileInput.disabled = true;
      setPhotoStatus("uploading", "Uploading photo…");
      var previousPhoto = oh.photoDataUrl;
      compressPhotoForStorage(file).then(function(result){
        photoUploading = false;
        if(photoFileInput){ photoFileInput.disabled = false; photoFileInput.value = ""; }
        if(!result || !result.dataUrl){
          setPhotoStatus("error", (result && result.error) || "Couldn't read that photo — try again.");
          return;
        }
        oh.photoDataUrl = result.dataUrl;
        var persisted = saveState();
        if(!persisted){
          /* Keep the previously saved photo — never leave an unsaved, temporary reference
             in place and call it done. */
          oh.photoDataUrl = previousPhoto;
          setPhotoStatus("error", "Couldn't save photo — it may be too large. Try again or use a smaller image.");
          return;
        }
        refreshPhotoUI();
        setPhotoStatus("success", "Photo saved");
        appEl.removeEventListener("click", globalClickHandler);
        render();
      });
    }
    if(photoFileInput){
      photoFileInput.addEventListener("change", function(){
        var file = photoFileInput.files && photoFileInput.files[0];
        if(!file) return;
        handlePhotoFile(file);
      });
    }

    function wireRemoveButton(btn){
      btn.addEventListener("click", function(){
        var confirmBody =
          '<div class="sheet-head"><h3>Remove this property photo?</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
          '<div class="sheet-body"><p style="font-size:14px;color:var(--ink-soft);line-height:1.6;">This photo will no longer appear on the visitor-facing pages for this open house.</p></div>' +
          '<div class="sheet-footer"><div class="btn-row">' +
            '<button class="btn btn-secondary" data-sheet-cancel>Cancel</button>' +
            '<button class="btn btn-danger" id="confirm-remove-photo">Remove</button>' +
          '</div></div>';
        openSheet(confirmBody, function(csheet, cclose){
          csheet.querySelector("[data-sheet-close]").addEventListener("click", cclose);
          csheet.querySelector("[data-sheet-cancel]").addEventListener("click", cclose);
          csheet.querySelector("#confirm-remove-photo").addEventListener("click", function(){
            oh.photoDataUrl = "";
            saveState();
            cclose();
            refreshPhotoUI();
            setPhotoStatus("", "Photo removed");
            appEl.removeEventListener("click", globalClickHandler);
            render();
          });
        });
      });
    }
    var photoRemoveBtn = sheet.querySelector("#f-photo-remove");
    if(photoRemoveBtn) wireRemoveButton(photoRemoveBtn);

    sheet.querySelector("#btn-save-oh").addEventListener("click", function(){
      oh.address = sheet.querySelector("#f-address").value.trim();
      oh.city = sheet.querySelector("#f-city").value.trim();
      oh.stateAbbr = sheet.querySelector("#f-state").value.trim();
      oh.zip = sheet.querySelector("#f-zip").value.trim();
      oh.price = currencyValue(sheet.querySelector("#f-price"));
      oh.beds = sheet.querySelector("#f-beds").value.trim();
      oh.baths = sheet.querySelector("#f-baths").value.trim();
      oh.sqft = sheet.querySelector("#f-sqft").value.trim();
      oh.date = sheet.querySelector("#f-date").value || oh.date;
      oh.startTime = sheet.querySelector("#f-start").value || oh.startTime;
      oh.endTime = sheet.querySelector("#f-end").value || oh.endTime;
      saveState();
      close();
      toast("Property updated");
      render();
    });
  });
}

/* Gates any admin-only destination behind the 4-digit passcode. This is a light privacy
   screen for a public kiosk hand-off, not enterprise-grade authentication — every
   passcode prompt in this app says so plainly. */
function sheetPasscodeGate(onSuccess){
  onSuccess = onSuccess || function(){ nav("workspace"); };
  var pc = cfg("pages.passcode");
  var hasCode = !!(state.settings.adminPasscode && state.settings.adminPasscode.length===4);
  if(!hasCode){
    var body1 = '<div class="sheet-head"><h3>'+esc(pc.gateTitle)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
      '<div class="sheet-body"><p class="passcode-hint">'+esc(pc.gateHint)+'</p></div>' +
      '<div class="sheet-footer"><button class="btn btn-primary" id="pg-continue">'+esc(pc.continueButton)+'</button></div>';
    openSheet(body1, function(sheet, close){
      sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
      sheet.querySelector("#pg-continue").addEventListener("click", function(){ close(); onSuccess(); });
    });
    return;
  }
  var body2 = '<div class="sheet-head"><h3>'+esc(pc.unlockTitle)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body">' +
      '<div class="passcode-row"><input type="tel" inputmode="numeric" maxlength="4" id="pg-code" class="passcode-input" placeholder="••••"></div>' +
      '<div class="passcode-error" id="pg-error"></div>' +
    '</div>' +
    '<div class="sheet-footer"><button class="btn btn-primary" id="pg-unlock">'+esc(pc.unlockButton)+'</button></div>';
  openSheet(body2, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    var codeInput = sheet.querySelector("#pg-code");
    codeInput.focus();
    function tryUnlock(){
      var val = codeInput.value.trim();
      if(val === state.settings.adminPasscode){ close(); onSuccess(); }
      else{ sheet.querySelector("#pg-error").textContent = pc.incorrectMessage; codeInput.value=""; codeInput.focus(); }
    }
    sheet.querySelector("#pg-unlock").addEventListener("click", tryUnlock);
    codeInput.addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });
  });
}

function sheetSetPasscode(){
  var pc = cfg("pages.passcode");
  var body = '<div class="sheet-head"><h3>'+esc(pc.setTitle)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body">' +
      '<p class="passcode-hint">'+esc(pc.setHint)+'</p>' +
      '<div class="passcode-row"><input type="tel" inputmode="numeric" maxlength="4" id="sp-code" class="passcode-input" placeholder="••••" value="'+esc(state.settings.adminPasscode||"")+'"></div>' +
    '</div>' +
    '<div class="sheet-footer"><button class="btn btn-primary" id="sp-save">'+esc(pc.saveButton)+'</button></div>';
  openSheet(body, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    sheet.querySelector("#sp-save").addEventListener("click", function(){
      var val = sheet.querySelector("#sp-code").value.trim();
      if(!/^\d{4}$/.test(val)){ sheet.querySelector("#sp-code").focus(); return; }
      state.settings.adminPasscode = val;
      saveState();
      close();
      toast("Passcode saved");
    });
  });
}

      '</div>'
  };

  return '<div class="screen signin-screen'+(hasPhoto?' has-hero':'')+'">' +
    heroHtml +
    '<div style="padding-top:'+(hasPhoto?'0':'36px')+';">'+brandline+'</div>' +

    '</div>';
