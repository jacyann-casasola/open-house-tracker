function mountSignIn(){
  var oh = activeOpenHouse();
  if(!oh) return;
  var picked = { representationStatus:"", visitPurpose:"" };

  var repGroup = document.querySelector("#s-rep");
  var purposeGroup = document.querySelector("#s-purpose");
  var phoneInput = document.querySelector("#s-phone");
  if(phoneInput){ bindPhoneInput(phoneInput); }
  initAutosizeTextareas(document);

  function wire(group, key){
    if(!group) return;
    group.addEventListener("click", function(e){
      var btn = e.target.closest(".chip"); if(!btn) return;
      var val = btn.getAttribute("data-val");
      var same = picked[key] === val;
      Array.prototype.forEach.call(group.querySelectorAll(".chip"), function(c){ c.classList.remove("selected"); });
      if(same){ picked[key] = ""; } else { picked[key] = val; btn.classList.add("selected"); }
    });
  }
  wire(repGroup, "representationStatus");
  wire(purposeGroup, "visitPurpose");

  var submitBtn = document.querySelector("#s-submit");
  if(submitBtn){
    submitBtn.addEventListener("click", function(){
      var nameEl = document.querySelector("#s-name");
      var phoneEl = document.querySelector("#s-phone");
      var emailEl = document.querySelector("#s-email");
      var name = nameEl ? nameEl.value.trim() : "";
      var phone = phoneEl ? phoneEl.value.trim() : "";
      var email = emailEl ? emailEl.value.trim() : "";
      if(fieldCfg("signin","name").required!==false && nameEl && !name){ nameEl.focus(); return; }
      if(fieldCfg("signin","phone").required && phoneEl && !phone){ phoneEl.focus(); return; }
      if(phoneIncomplete(phone)){ if(phoneEl) phoneEl.focus(); toast("Enter a complete 10-digit phone number, or leave it blank"); return; }
      if(fieldCfg("signin","email").required && emailEl && !email){ emailEl.focus(); toast("Email is required"); return; }
      if(email && !EMAIL_RE.test(email)){ if(emailEl) emailEl.focus(); toast("Enter a valid email address, or leave it blank"); return; }
      var otherEl = document.querySelector("#s-purpose-other");
      var v = newVisitor(oh.id, {
        name: name, phone: phone, email: email,
        representationStatus: picked.representationStatus,
        visitPurpose: picked.visitPurpose,
        visitPurposeOther: otherEl ? otherEl.value.trim() : "",
        /* Group size is no longer asked at self-serve sign-in — newVisitor() defaults
           partySize to "1", so every self-signed-in lead counts as one visitor. Quick
           Capture (agent-facing) still lets an agent note a larger group by hand when
           they can see it in person. */
        source: "selfSignIn"
      }, true);
      state.visitors.push(v);
      saveState();
      /* Neighbor Home Value Follow-Up: everyone else goes straight to the normal thank-you
         screen (unchanged); a Neighbor sees one extra low-pressure phase first, reusing this
         exact same visitor record (v.id) — no duplicate record is ever created. */
      if(picked.visitPurpose === "neighbor"){
        nav("signin", { phase:"neighborOffer", visitorId: v.id });
      } else {
        nav("signin", { phase:"confirm" });
        setTimeout(function(){ nav("signin", { phase:"form" }); }, 2800);
      }
    });
  }
}

/* Neighbor Home Value Follow-Up — only mounted for phase:"neighborOffer", which only ever
   happens right after a Neighbor's own sign-in submission (see mountSignIn above). */
function mountNeighborOffer(){
  var nv = findVisitor(route.params.visitorId);
  if(!nv){
    /* Safety net only — should not happen in normal use, since we always pass the id of the
       record we just created. Falls back to the standard completion experience. */
    nav("signin", { phase:"confirm" });
    setTimeout(function(){ nav("signin", { phase:"form" }); }, 2800);
    return;
  }
  var d = nv.detail;

  function goToConfirm(){
    nav("signin", { phase:"confirm" });
    setTimeout(function(){ nav("signin", { phase:"form" }); }, 2800);
  }

  var yesBtn = document.querySelector("#n-yes");
  var noBtn = document.querySelector("#n-no");
  var reveal = document.querySelector("#n-address-reveal");
  var addressEl = document.querySelector("#n-address");
  var submitBtn = document.querySelector("#n-submit");

  /* Yes/No ONLY ever set which option is selected and toggle the address field's visibility —
     neither one saves anything or navigates anywhere. Submit is the one and only action that
     commits the response and advances the screen, so this variable (not a save write) is the
     single source of truth for what a later Submit press should do. */
  var selection = null; /* null | "yes" | "no" */

  function updateSubmitState(){
    if(!submitBtn) return;
    if(selection === "yes"){
      submitBtn.disabled = !(addressEl && addressEl.value.trim());
    }else if(selection === "no"){
      submitBtn.disabled = false;
    }else{
      submitBtn.disabled = true;
    }
  }

  if(yesBtn){
    yesBtn.addEventListener("click", function(){
      selection = "yes";
      yesBtn.classList.add("selected");
      if(noBtn) noBtn.classList.remove("selected");
      if(reveal){
        reveal.classList.add("show");
        setTimeout(function(){ if(addressEl) addressEl.focus(); }, 350);
      }
      updateSubmitState();
    });
  }
  if(noBtn){
    noBtn.addEventListener("click", function(){
      selection = "no";
      noBtn.classList.add("selected");
      if(yesBtn) yesBtn.classList.remove("selected");
      /* Hides the address field, but deliberately does NOT clear its value — if the visitor
         switches back to Yes later in this same session, whatever they'd started typing is
         still there, exactly as requested. */
      if(reveal) reveal.classList.remove("show");
      updateSubmitState();
    });
  }
  if(addressEl){
    addressEl.addEventListener("input", updateSubmitState);
    /* Address autocomplete/typeahead — see attachNeighborAddressAutocomplete() below. Manual
       typing always keeps working even if suggestions fail to load (offline, blocked, etc). */
    attachNeighborAddressAutocomplete(addressEl, nv.openHouseId ? state.openHouses.find(function(o){ return o.id===nv.openHouseId; }) : activeOpenHouse());
  }
  if(submitBtn){
    submitBtn.addEventListener("click", function(){
      if(submitBtn.disabled) return;
      if(selection === "yes"){
        var address = addressEl ? addressEl.value.trim() : "";
        if(!address){ if(addressEl) addressEl.focus(); toast("Enter your property address"); return; }
        /* Reuses this visitor's existing record — never creates a second one. Source stays
           whatever it already was (the current Open House), contact type/priority is left as
           the auto-detected "Neighbor" (see CONTACT_TYPE_AUTO_MAP), so this person can still
           separately be tracked as a potential buyer/seller without being forced into one
           category. */
        d.homeAddress = address;
        d.homeValuationRequested = true;
        if(!d.followUp.nextAction) d.followUp.nextAction = "Prepare Market Analysis";
      }
      /* selection === "no": intentionally writes nothing — no address, no valuation flag, no
         follow-up action. Declining is not a negative lead status, just an explicit no-op. */
      saveState();
      goToConfirm();
    });
  }
}

/* Home Address autocomplete/typeahead for the Neighbor Home Value screen. Reuses the exact
   same free, keyless provider (OpenStreetMap Nominatim) and .autocomplete-list/.autocomplete-item
   styling already established by attachAddressAutocomplete() (used for the admin Property
   Address field) — no new visual language, no API key, and nothing to configure. Unlike the
   admin version, this one:
     - has no "previously hosted" history list (a neighbor's home was never a past open house),
     - softly biases results toward the current Open House's area via a one-time geocode of the
       property address (bounded=0, so it never EXCLUDES results elsewhere — a neighbor may
       legitimately be typing an address in another city),
     - shows the street as the primary line and "City, ST ZIP" as a secondary line.
   If the network call fails, is blocked, or is slow, suggestions simply don't appear — typing
   and submitting the address manually always keeps working. */
function attachNeighborAddressAutocomplete(input, oh){
  var wrap = input.closest(".autocomplete-wrap");
  if(!wrap) return;
  var listEl = null, debounceTimer = null, biasBox = null, biasRequested = false;

  function closeList(){ if(listEl){ listEl.remove(); listEl = null; } }
  function renderList(items){
    closeList();
    if(!items || !items.length) return;
    listEl = document.createElement("div");
    listEl.className = "autocomplete-list";
    listEl.innerHTML = items.map(function(it, i){
      return '<div class="autocomplete-item" data-ac-idx="'+i+'">'+esc(it.street) +
        (it.secondary ? '<span class="ac-tag" style="text-transform:none;letter-spacing:normal;">'+esc(it.secondary)+'</span>' : '') +
      '</div>';
    }).join("");
    wrap.appendChild(listEl);
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-ac-idx]"), function(el){
      el.addEventListener("mousedown", function(e){ e.preventDefault(); });
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-ac-idx"), 10);
        input.value = items[idx].full;
        closeList();
        input.dispatchEvent(new Event("input", { bubbles:true }));
      });
    });
  }
  function ensureBiasBox(){
    if(biasRequested || !oh || typeof fetch !== "function") return;
    biasRequested = true;
    var q = [oh.address, oh.city, oh.stateAbbr, oh.zip].filter(Boolean).join(", ");
    if(!q) return;
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(data){ if(data && data[0] && data[0].boundingbox) biasBox = data[0].boundingbox; })
      .catch(function(){ /* biasing is a nice-to-have only — plain lookup still works */ });
  }
  input.addEventListener("input", function(){
    clearTimeout(debounceTimer);
    var q = input.value;
    if(q.trim().length < 3){ closeList(); return; }
    ensureBiasBox();
    debounceTimer = setTimeout(function(){
      if(typeof fetch !== "function") return;
      var url = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=us&limit=6&q="+encodeURIComponent(q);
      if(biasBox){
        /* Soft bias only (bounded=0) — never restricts results to this box, since a neighbor
           may legitimately own property outside today's open house area. */
        var pad = 0.35;
        var south = parseFloat(biasBox[0])-pad, north = parseFloat(biasBox[1])+pad;
        var west = parseFloat(biasBox[2])-pad, east = parseFloat(biasBox[3])+pad;
        url += "&viewbox="+west+","+north+","+east+","+south+"&bounded=0";
      }
      var controller = (typeof AbortController === "function") ? new AbortController() : null;
      var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, 3000) : null;
      fetch(url, controller ? {signal:controller.signal} : {})
        .then(function(res){ return res.json(); })
        .then(function(data){
          if(timeoutId) clearTimeout(timeoutId);
          var items = (data||[]).map(function(r){
            var a = r.address || {};
            var street = [a.house_number, a.road].filter(Boolean).join(" ") || (r.display_name||"").split(",")[0];
            var city = a.city || a.town || a.village || a.hamlet || "";
            var st = stateAbbrFromName(a.state||"");
            var zip = a.postcode || "";
            var cityStateZip = [city, [st, zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
            var full = [street, cityStateZip].filter(Boolean).join(", ") || r.display_name;
            return { street: street || r.display_name, secondary: cityStateZip, full: full };
          }).filter(function(it){ return it.street; });
          renderList(items);
        })
        .catch(function(){ /* offline or blocked — manual entry still works */ });
    }, 350);
  });
  input.addEventListener("blur", function(){ setTimeout(closeList, 200); });
}

      '</div></div>'
  };

      var group = sheet.querySelector(containerId);
      if(!group) return;
      group.addEventListener("click", function(e){
        var btn = e.target.closest(".chip"); if(!btn) return;
        var isSame = picked[key] === btn.getAttribute("data-val");
        Array.prototype.forEach.call(group.querySelectorAll(".chip"), function(c){ c.classList.remove("selected"); });
        if(isSame){ picked[key] = ""; } else { picked[key] = btn.getAttribute("data-val"); btn.classList.add("selected"); }
      });
    }
    wireChips("#q-reason","reasonForVisit");
    wireChips("#q-timeline","buyingTimeline");
    wireChips("#q-rep","representationStatus");
    var qPartyGroup = sheet.querySelector("#q-party");

        btn.classList.add("selected");
      });
    }

    function val(sel){ var el = sheet.querySelector(sel); return el ? el.value.trim() : ""; }
    function gather(){
      return {
        name: val("#q-name"),
        phone: val("#q-phone"),
        email: val("#q-email"),
        storyNote: val("#q-storynote"),
        reasonForVisit: picked.reasonForVisit,
        buyingTimeline: picked.buyingTimeline,
        representationStatus: picked.representationStatus,
        partySize: picked.partySize,
        source: "agent"
      };
    }
    function saveVisitor(capturedLater){
      var data = gather();
      var nameEl = sheet.querySelector("#q-name");
      if(fieldCfg("quickCapture","name").required!==false && nameEl && !data.name){ nameEl.focus(); return; }
      if(phoneIncomplete(data.phone)){ if(qPhoneEl) qPhoneEl.focus(); toast("Enter a complete 10-digit phone number, or leave it blank"); return; }
      var qEmailEl = sheet.querySelector("#q-email");
      if(fieldCfg("quickCapture","email").required && qEmailEl && !data.email){ qEmailEl.focus(); toast("Email is required"); return; }
      if(data.email && !EMAIL_RE.test(data.email)){ if(qEmailEl) qEmailEl.focus(); toast("Enter a valid email address, or leave it blank"); return; }
      var v = newVisitor(oh.id, data, capturedLater);
      state.visitors.push(v);
      saveState();
      close();
      toast(capturedLater ? "Saved — capture more later" : "Visitor saved");
      render();
    }
    sheet.querySelector("#q-save").addEventListener("click", function(){ saveVisitor(false); });
    sheet.querySelector("#q-later").addEventListener("click", function(){ saveVisitor(true); });
  });
}

/* ---- Collapsed multi-select dropdown: Motivation, Deal Breakers, Must-Haves, Nice-to-Haves.
   Tapping the field opens a sheet with the full option list; once closed, the field itself
   only ever shows the options that were actually picked (or a placeholder), never the whole list. */
var MULTI_SELECT_CONFIG = {

     Deal Breakers all now use the same Category → Specific Feedback interaction as Concerns /
     What They Liked, plus a chip-style "+ Add Custom" (customAdd:true) — typed custom entries
     are pushed straight into the selected array so they display and count exactly like any
     other selection. The underlying stored values are always the individual specific items,
     never the category name, so existing summaries/exports keep working unchanged. */
  motivation:    { title:"Motivation",              path:"motivation.selected",           flat: MOTIVATION_OPTIONS,       categories: MOTIVATION_CATEGORIES,       customAdd:true, customPlaceholder:"Type a custom motivation…",     compactSummary:true, placeholder:"Select motivation(s)…" },

     existing saved selections carry forward as-is. Category → Specific Feedback picker: the
     underlying stored values are still the individual specific items (never the category name),
     so Analytics keeps aggregating exactly as before. */
  dealBreakers:  { title:"Concerns",                path:"dealBreakers.selected",         flat: DEALBREAKER_OPTIONS,      categories: DEALBREAKER_CATEGORIES,      otherNotePath:"dealBreakers.note",   placeholder:"Select concern(s)…",     otherPlaceholder:"Add a short note…" },
  mustHaves:     { title:"Must-Haves",              path:"mustHaves.selected",            flat: MUST_HAVE_OPTIONS,        categories: MUST_HAVE_CATEGORIES,        otherKey:"niceToHaves", customAdd:true, customPlaceholder:"Type a custom must-have…",   compactSummary:true, placeholder:"Select must-have(s)…" },
  /* Standardized onto the exact same category taxonomy as Must-Haves (see PREFERENCE_CATEGORIES
     above) — previously used a "grouped" mode that showed every category at once. flat here is
     ALL_PREF_OPTIONS, which also carries a few legacy values that fell outside the new named
     categories (see LEGACY_NICE_TO_HAVE_EXTRAS) so they still surface via the "More" tile. */
  niceToHaves:   { title:"Nice-to-Haves",            path:"niceToHaves.selected",          flat: ALL_PREF_OPTIONS,         categories: PREFERENCE_CATEGORIES,       otherKey:"mustHaves",   customAdd:true, customPlaceholder:"Type a custom nice-to-have…", compactSummary:true, placeholder:"Select nice-to-have(s)…" },
  pets:          { title:"Pets",                     path:"pets.selected",                 flat: PET_OPTIONS,               exclusive: PET_EXCLUSIVE, placeholder:"Select pet detail(s)…" },
  /* Category → Specific Feedback picker: underlying stored values are still the individual
     specific items (never the category name), so Analytics keeps aggregating exactly as before. */
  thisHomeLiked: { title:"What They Liked",          path:"thisHome.liked",                flat: THIS_HOME_LIKED_OPTIONS,  categories: THIS_HOME_LIKED_CATEGORIES,  otherNotePath:"thisHome.likedNote",  placeholder:"Select what stood out…", otherPlaceholder:"Add a short note…" },
  propertyType:  { title:"Property Type",            path:"propertyType",                  flat: PROPERTY_TYPE_OPTIONS,    placeholder:"Select property type(s)…" },
  searchDealBreakers: { title:"Deal Breakers",       path:"searchDealBreakers.selected",    flat: SEARCH_DEALBREAKER_OPTIONS, categories: SEARCH_DEALBREAKER_CATEGORIES, customAdd:true, customPlaceholder:"Type a custom deal breaker…", compactSummary:true, placeholder:"Select deal breaker(s)…" }
};
function multiSelectFieldHtml(key, selectedArr){
  selectedArr = selectedArr || [];
  var entry = MULTI_SELECT_CONFIG[key];
  var body;
  if(!selectedArr.length){
    body = '<span class="ms-placeholder">'+esc(entry.placeholder)+'</span>';
  } else if(entry.compactSummary){
    /* Their Home Search categorized-picker update: a short text line ("X · Y · +3 more")
       instead of a chip wall, so the Visitor page stays calm even with many selections.
       Scoped to entry.compactSummary — This Home fields (Concerns/What They Liked) keep their
       existing .ms-chips display untouched. */
    var preview = selectedArr.slice(0,2).join(" · ") + (selectedArr.length>2 ? "  +"+(selectedArr.length-2)+" more" : "");
    body = '<span class="ms-summary-text">'+esc(preview)+'</span>';
  } else {
    body = '<div class="ms-chips">' + selectedArr.map(function(v){ return '<span class="ms-chip">'+esc(v)+'</span>'; }).join("") + '</div>';
  }
  return '<button type="button" class="ms-field" data-action="openMultiSelect" data-ms-key="'+esc(key)+'">' +
    '<span class="ms-field-body">'+body+'</span><span class="ms-field-chev">'+ICONS.chev+'</span>' +
  '</button>';
}
function sheetMultiSelectPicker(v, key){
  var entry = MULTI_SELECT_CONFIG[key];
  if(!entry) return;
  var d = v.detail;
  var selected = (getPath(d, entry.path) || []).slice();
  var otherArr = entry.otherKey ? (getPath(d, entry.otherKey+".selected") || []).slice() : null;
  var otherNoteDraft = entry.otherNotePath ? (getPath(d, entry.otherNotePath) || "") : "";
  var bodyEl = null; /* assigned once the sheet is mounted, below */

  /* Category → Specific Feedback: null = showing the category grid; a number = showing that
     category's options; "other" = showing the free-text "Other" entry. Selections made in any
     category persist in `selected` regardless of which category is currently open, so moving
     between categories never loses previous picks. */
  var activeCategory = null;

  /* Reads #ms-custom-input, pushes a trimmed non-empty/non-duplicate value straight into
     `selected` (so it displays and counts exactly like any predefined option), then re-renders
     the "Other" screen with the input cleared and the new item listed as a chip. */
  function addCustomFromInput(){
    var inp = document.getElementById("ms-custom-input");
    if(!inp) return;
    var val = (inp.value||"").trim();
    if(val && selected.indexOf(val)===-1) selected.push(val);
    bodyEl.innerHTML = rowsHtml();
  }

  function selectedSummaryHtml(){
    if(!selected.length) return "";
    var preview = selected.slice(0,4).join(" · ") + (selected.length>4 ? "  +"+(selected.length-4)+" more" : "");
    return '<div class="ms-selected-summary"><span class="ms-selected-count">Selected · '+selected.length+'</span><span class="ms-selected-preview">'+esc(preview)+'</span></div>';
  }

  /* Builds the category grid from entry.categories, filtered against the live (admin-editable)
     option list so archived/removed items never show — any option that's in the live list but
     not in a named category (e.g. an admin-added custom item) falls into an auto "More" tile
     rather than being silently hidden. */
  function buildCategoryList(){
    var assigned = {};
    var cats = (entry.categories||[]).map(function(cat){
      var opts = cat.options.filter(function(o){ return entry.flat.indexOf(o) > -1; });
      opts.forEach(function(o){ assigned[o] = true; });
      return { name: cat.name, options: opts };
    }).filter(function(c){ return c.options.length; });
    var extra = entry.flat.filter(function(o){ return !assigned[o]; });
    if(extra.length) cats.push({ name:"More", options: extra });
    return cats;
  }

  function categoryTileHtml(cat, idx){
    var count = cat.options.filter(function(o){ return selected.indexOf(o)>-1; }).length;
    return '<button type="button" class="cat-tile" data-cat-idx="'+idx+'">' +
      '<span class="cat-tile-label">'+esc(cat.name)+'</span>' +
      (count ? '<span class="cat-tile-count">'+count+'</span>' : '') +
    '</button>';
  }

  /* Custom entries (customAdd mode) are pushed straight into `selected` — anything the user
     typed that isn't one of the predefined/admin options. Rendered as removable chips inside
     the "Other" screen using the same [data-ms-val] toggle as every other option. */
  function customSelectedItems(){
    return selected.filter(function(s){ return entry.flat.indexOf(s) === -1; });
  }

  function rowsHtml(){
    if(entry.categories){
      var cats = buildCategoryList();
      if(activeCategory === null){
        var otherCount = entry.customAdd ? customSelectedItems().length : (entry.otherNotePath && otherNoteDraft.trim().length>0 ? 1 : 0);
        return '<div class="cat-grid">' +
            cats.map(function(cat,idx){ return categoryTileHtml(cat, idx); }).join("") +
            ((entry.otherNotePath || entry.customAdd) ? '<button type="button" class="cat-tile cat-tile-other" data-cat-idx="other"><span class="cat-tile-label">'+(entry.customAdd?"+ Add Custom":"+ Other")+'</span>'+(otherCount?'<span class="cat-tile-count">'+(entry.customAdd?otherCount:"•")+'</span>':'')+'</button>' : '') +
          '</div>' +
          selectedSummaryHtml();
      }
      if(activeCategory === "other"){
        if(entry.customAdd){
          var customItems = customSelectedItems();
          return '<button type="button" class="cat-back" data-cat-back>‹ All Categories</button>' +
            '<div class="cat-active-label">Add Custom</div>' +
            '<div class="custom-add-row">' +
              '<input type="text" id="ms-custom-input" class="ms-custom-input" placeholder="'+esc(entry.customPlaceholder||"Type a custom item…")+'">' +
              '<button type="button" class="btn btn-secondary btn-sm" id="ms-custom-add">Add</button>' +
            '</div>' +
            (customItems.length ? '<div class="chip-group cat-options" style="margin-top:14px;">' + customItems.map(function(opt){
              return '<button type="button" class="chip chip-compact selected" data-ms-val="'+esc(opt)+'">'+esc(opt)+'</button>';
            }).join("") + '</div>' : '') +
            selectedSummaryHtml();
        }
        return '<button type="button" class="cat-back" data-cat-back>‹ All Categories</button>' +
          '<div class="cat-active-label">Other</div>' +
          '<textarea class="optional-detail" id="ms-other-note" placeholder="'+esc(entry.otherPlaceholder||entry.placeholder)+'">'+esc(otherNoteDraft)+'</textarea>' +
          selectedSummaryHtml();
      }
      var cat = cats[activeCategory];
      if(!cat){ activeCategory = null; return rowsHtml(); }
      return '<button type="button" class="cat-back" data-cat-back>‹ All Categories</button>' +
        '<div class="cat-active-label">'+esc(cat.name)+'</div>' +
        '<div class="chip-group cat-options">' + cat.options.map(function(opt){
          return '<button type="button" class="chip chip-compact'+(selected.indexOf(opt)>-1?" selected":"")+'" data-ms-val="'+esc(opt)+'">'+esc(opt)+'</button>';
        }).join("") + '</div>' +
        selectedSummaryHtml();
    }
    if(entry.grouped){
      return entry.grouped.map(function(cat){
        return '<div class="pref-category">' +
          '<div class="pref-category-label">'+esc(cat.name)+'</div>' +
          '<div class="chip-group">' +
            cat.options.map(function(opt){
              return '<button type="button" class="chip'+(selected.indexOf(opt)>-1?" selected":"")+'" data-ms-val="'+esc(opt)+'">'+esc(opt)+'</button>';
            }).join("") +
          '</div>' +
        '</div>';
      }).join("");
    }
    return '<div class="chip-group">' + entry.flat.map(function(opt){
      return '<button type="button" class="chip'+(selected.indexOf(opt)>-1?" selected":"")+'" data-ms-val="'+esc(opt)+'">'+esc(opt)+'</button>';
    }).join("") + '</div>';
  }

  var body =
    '<div class="sheet-head"><h3>'+esc(entry.title)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body" id="ms-body">' + rowsHtml() + '</div>' +
    '<div class="sheet-footer"><button class="btn btn-primary" id="ms-done">Done</button></div>';

  openSheet(body, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    bodyEl = sheet.querySelector("#ms-body");
    bodyEl.addEventListener("click", function(e){
      var catTile = e.target.closest("[data-cat-idx]");
      if(catTile){
        var ci = catTile.getAttribute("data-cat-idx");
        activeCategory = (ci === "other") ? "other" : parseInt(ci,10);
        bodyEl.innerHTML = rowsHtml();
        return;
      }
      var backBtn = e.target.closest("[data-cat-back]");
      if(backBtn){
        activeCategory = null;
        bodyEl.innerHTML = rowsHtml();
        return;
      }
      var addBtn = e.target.closest("#ms-custom-add");
      if(addBtn){
        addCustomFromInput();
        return;
      }
      var chip = e.target.closest("[data-ms-val]");
      if(!chip) return;
      var val = chip.getAttribute("data-ms-val");
      var idx = selected.indexOf(val);
      if(idx>-1){ selected.splice(idx,1); }
      else{
        if(entry.exclusive && entry.exclusive.indexOf(val)>-1){
          /* Picking an exclusive value (e.g. "No Pets") clears everything else. */
          selected = [val];
        } else {
          if(entry.exclusive){ selected = selected.filter(function(x){ return entry.exclusive.indexOf(x)===-1; }); }
          selected.push(val);
        }
        if(otherArr){ var oIdx = otherArr.indexOf(val); if(oIdx>-1) otherArr.splice(oIdx,1); }
      }
      bodyEl.innerHTML = rowsHtml();
    });
    bodyEl.addEventListener("input", function(e){
      if(e.target && e.target.id === "ms-other-note") otherNoteDraft = e.target.value;
    });
    bodyEl.addEventListener("keydown", function(e){
      if(e.target && e.target.id === "ms-custom-input" && e.key === "Enter"){
        e.preventDefault();
        addCustomFromInput();
      }
    });
    sheet.querySelector("#ms-done").addEventListener("click", function(){
      setPath(d, entry.path, selected);
      if(entry.otherKey) setPath(d, entry.otherKey+".selected", otherArr);
      if(entry.otherNotePath) setPath(d, entry.otherNotePath, otherNoteDraft);
      saveState(); flashAutosave();
      close();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    });
  });
}

/* 1–5 star tap control (This Home > Overall Rating). Reuses the generic [data-single]
   click handler — tapping the currently-set star clears the rating back to 0. */
function starRatingHtml(rating){
  rating = parseInt(rating,10) || 0;
  var out = '<div class="star-row">';
  for(var i=1;i<=5;i++){
    out += '<button type="button" class="star-btn'+(i<=rating?" filled":"")+'" data-single="thisHome.rating" data-val="'+i+'" aria-label="'+i+' star'+(i>1?"s":"")+'">'+(i<=rating?"★":"☆")+'</button>';
  }
  out += '</div>';
  return out;
}

/* Delete Visitor — permanently removes this visitor record (contact info, This Home feedback,
   Their Home Search criteria, follow-up, tasks, Home Valuation Request/address — everything
   lives on this one record, see newVisitor()/migrateVisitorDetail(), so removing it is a single
   array filter, not a multi-table cleanup) and nothing else. Since Analytics, the Seller
   Report, Follow-Up, and every count on Workspace/Queue are all computed live from
   state.visitors on every render (see visitorsFor()/openHouseThisHomeStats()/etc.) rather than
   cached anywhere, they reflect the deletion immediately with no separate recalculation step.
   This is a hard delete, not a soft/archived flag — there is currently no "Contact" record
   independent of a "Visit" in this app's data model (see newVisitor()), so a visitor's sign-in
   record IS their only record for that open house; deleting it cannot orphan or corrupt a
   separate contact, and it never touches state.openHouses or any other visitor. */
function sheetConfirmDeleteVisitor(v){
  var body =
    '<div class="sheet-head"><h3>Delete this visitor?</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body"><p style="font-size:14px;color:var(--ink-soft);line-height:1.6;">This will permanently remove this visitor and their associated open house feedback, follow-up information, and tasks. This action cannot be undone.</p></div>' +
    '<div class="sheet-footer"><div class="btn-row">' +
      '<button class="btn btn-secondary" data-sheet-cancel>Cancel</button>' +
      '<button class="btn btn-danger" id="confirm-delete-visitor">Delete Visitor</button>' +
    '</div></div>';
  openSheet(body, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    sheet.querySelector("[data-sheet-cancel]").addEventListener("click", close);
    sheet.querySelector("#confirm-delete-visitor").addEventListener("click", function(){
      state.visitors = state.visitors.filter(function(x){ return x.id !== v.id; });
      saveState();
      close();
      toast("Visitor deleted");
      nav("queue");
    });
  });
}

/* ============================================================
   OPEN HOUSE ANALYTICS + SELLER REPORT
   A "Group" is one sign-in record; "Visitors" sums partySize across every group in the
   open house (a couple + child who all sign in together is 1 Group / 3 Visitors). Every
   aggregate below is built only from This Home feedback fields — never names, contact
   info, personal search notes, financing, or follow-up data — so the exact same numbers
   can safely feed both the internal Analytics view and the seller-facing report.
   ============================================================ */
function partySizeCount(v){
  var n = parseInt(String(v.partySize||"1").replace(/[^0-9]/g,""),10);
  return (!n || isNaN(n)) ? 1 : n;
}
function openHouseGroupsAndVisitors(list){
  return {
    groups: list.length,
    visitors: list.reduce(function(sum,v){ return sum + partySizeCount(v); }, 0)
  };
}
function tallyOptions(list, getter){
  var counts = {};
  list.forEach(function(v){
    var val = getter(v);
    if(val==null || val==="") return;
    if(Array.isArray(val)){ val.forEach(function(x){ if(x) counts[x] = (counts[x]||0)+1; }); }
    else{ counts[val] = (counts[val]||0)+1; }
  });
  return Object.keys(counts).map(function(k){ return { label:k, count:counts[k] }; }).sort(function(a,b){ return b.count-a.count; });
}
function averageRating(list){
  var rated = list.filter(function(v){ return parseInt(v.detail.thisHome.rating,10)>0; });
  if(!rated.length) return 0;
  var sum = rated.reduce(function(s,v){ return s+parseInt(v.detail.thisHome.rating,10); }, 0);
  return Math.round((sum/rated.length)*10)/10;
}
/* Neighbor Home Value Follow-Up — internal engagement counts only. Never surfaces names,
   addresses, or any other personally-identifying detail; the Seller Report only ever reads
   the aggregate potentialSellerLeads NUMBER from this (see buildWhatWeHeardSummary). */
function neighborStats(list){
  var neighbors = list.filter(function(v){ return v.contactType==="neighbor"; });
  var valuationRequests = neighbors.filter(function(v){ return v.detail.homeValuationRequested; });
  return {
    visitors: neighbors.length,
    valuationRequests: valuationRequests.length,
    /* Every neighbor who requested a valuation is, by definition, a potential seller
       opportunity — this doesn't force them into "seller" as their only contact type. */
    potentialSellerLeads: valuationRequests.length
  };
}
function openHouseThisHomeStats(oh){
  var list = visitorsFor(oh.id);
  var gv = openHouseGroupsAndVisitors(list);
  return {
    list: list,
    groups: gv.groups,
    visitors: gv.visitors,
    avgRating: averageRating(list),
    interestLevel: tallyOptions(list, function(v){ return v.detail.thisHome.interestLevel; }),
    wouldConsiderOffer: tallyOptions(list, function(v){ return v.detail.thisHome.wouldConsiderOffer; }),
    liked: tallyOptions(list, function(v){ return v.detail.thisHome.liked; }),
    concerns: tallyOptions(list, function(v){ return v.detail.dealBreakers.selected; }),
    priceReaction: tallyOptions(list, function(v){ return v.detail.thisHome.priceReaction; }),
    fit: tallyOptions(list, function(v){ return v.detail.thisHome.fit; }),
    neighbor: neighborStats(list)
  };
}
/* Internal-only — surfaces names, so this is never used on the Seller Report. */
function leadOpportunities(list){
  return list.filter(function(v){
    var th = v.detail.thisHome;
    return th.wouldConsiderOffer==="Yes" || th.interestLevel==="Very Interested" || v.detail.followUp.leadTemperature==="Hot";
  }).sort(function(a,b){ return (parseInt(b.detail.thisHome.rating,10)||0) - (parseInt(a.detail.thisHome.rating,10)||0); });
}
function distributionBarsHtml(items){
  if(!items.length) return '<div style="color:var(--ink-faint);font-size:13.5px;">No responses yet</div>';
  var max = Math.max.apply(null, items.map(function(i){ return i.count; }));
  return items.map(function(i){
    var widthPct = max ? Math.round((i.count/max)*100) : 0;
    return '<div class="dist-row">' +
      '<div class="dist-row-top"><span class="dist-label">'+esc(i.label)+'</span><span class="dist-count">'+i.count+'</span></div>' +
      '<div class="dist-bar-track"><div class="dist-bar-fill" style="width:'+widthPct+'%;"></div></div>' +
    '</div>';
  }).join("");
}
/* Auto-generated, strictly from counted data — never invented or estimated. */
function buildWhatWeHeardSummary(stats){
  if(!stats.list.length) return "No feedback was captured for this open house yet.";
  var lines = [];
  lines.push(stats.groups+" group"+(stats.groups===1?"":"s")+" ("+stats.visitors+" visitor"+(stats.visitors===1?"":"s")+") toured the home.");
  if(stats.avgRating) lines.push("Average overall rating was "+stats.avgRating+" out of 5.");
  if(stats.liked.length){
    var topLiked = stats.liked.slice(0,3).map(function(i){ return i.label.toLowerCase(); });
    lines.push("The "+topLiked.join(", ")+" stood out most to visitors.");
  }
  if(stats.concerns.length){
    lines.push("The most frequently mentioned concern was "+stats.concerns[0].label.toLowerCase()+" ("+stats.concerns[0].count+" group"+(stats.concerns[0].count===1?"":"s")+").");
  }
  if(stats.priceReaction.length){
    lines.push("On price, the most common reaction was that the home \""+stats.priceReaction[0].label+"\" ("+stats.priceReaction[0].count+" group"+(stats.priceReaction[0].count===1?"":"s")+").");
  }
  var yesEntry = stats.wouldConsiderOffer.find(function(i){ return i.label==="Yes"; });
  if(yesEntry && yesEntry.count) lines.push(yesEntry.count+" group"+(yesEntry.count===1?"":"s")+" indicated they would consider making an offer.");
  /* Aggregate-only, seller-safe: a plain count, never names or addresses. */
  if(stats.neighbor && stats.neighbor.potentialSellerLeads > 0){
    lines.push(stats.neighbor.potentialSellerLeads+" potential seller opportunit"+(stats.neighbor.potentialSellerLeads===1?"y":"ies")+" generated.");
  }
  return lines.join(" ");
}
function buildSellerReportPlainText(oh, stats, whatWeHeard){
  var lines = ["OPEN HOUSE SELLER REPORT — "+cfg("brand.companyName"), propertyOneLine(oh), formatDateLong(oh.date), ""];
  lines.push(stats.groups+" Groups / "+stats.visitors+" Visitors", "Average Rating: "+(stats.avgRating||"N/A")+"/5", "");
  lines.push("WHAT WE HEARD", whatWeHeard, "");
  function section(title, items){
    if(!items.length) return;
    lines.push(title.toUpperCase());
    items.forEach(function(i){ lines.push("- "+i.label+" ("+i.count+")"); });
    lines.push("");
  }
  section("What Buyers Liked", stats.liked);
  section("Concerns Raised", stats.concerns);
  section("Price Reaction", stats.priceReaction);
  section("Overall Fit", stats.fit);
  return lines.join("\n");
}

  return items.map(function(i){ return '<div class="snap-check-item">'+ICONS.check+'<span>'+esc(i)+'</span></div>'; }).join("");
}
function bulletListHtml(items){
  return items.map(function(i){ return '<div class="snap-bullet-item">'+esc(i)+'</div>'; }).join("");
}
function snapPlainLines(lines){
  return lines.filter(Boolean).map(function(l){ return '<div class="snap-plain-line">'+esc(l)+'</div>'; }).join("");
}
function snapKvRow(label, value){
  if(!value) return "";
  return '<div class="snap-kv"><div class="snap-kv-label">'+esc(label)+'</div><div class="snap-kv-value">'+esc(value)+'</div></div>';
}
function snapCard(title, inner){
  if(!inner) return "";
  return '<div class="section-head"><h3>'+esc(title)+'</h3></div><div class="card">'+inner+'</div>';
}
function formatDateMedium(iso){
  if(!iso) return "";
  var parts = iso.split("-"); var d = new Date(parts[0], parts[1]-1, parts[2]);
  if(cfg("formats.dateFormat")==="numeric") return pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear();
  return d.toLocaleDateString("en-US", { month:"long", day:"numeric" });
}

function buildSnapshotPlainText(v){
  var d = v.detail;
  var lines = ["CLIENT SNAPSHOT — Villa Casa Home Group", ""];
  var identity = [v.name, v.phone, v.email].filter(Boolean).join(" · ");
  if(identity) lines.push(identity);
  var badges = [v.contactType?contactTypeLabel(v.contactType):"", v.representationStatus?repLabel(v.representationStatus):"", (v.buyingTimeline&&v.buyingTimeline!=="unknown")?timelineLabel(v.buyingTimeline):""].filter(Boolean);
  if(badges.length) lines.push(badges.join(" · "));
  lines.push("");

  var whyVisited = [v.reasonForVisit, visitPurposeLabel(v.visitPurpose), v.visitPurposeOther].filter(Boolean).join(" / ");
  if(whyVisited || v.storyNote){
    lines.push("VISIT");
    if(whyVisited) lines.push(whyVisited);
    if(v.storyNote) lines.push(v.storyNote);
    lines.push("");
  }
  if(motivationSummaryText(d)){ lines.push("MOTIVATION"); lines.push(motivationSummaryText(d)); lines.push(""); }
  var prefsText = [];
  if(d.mustHaves.selected.length || d.mustHaves.note) prefsText.push("Must-Haves: "+prefCardSummaryText(d.mustHaves));
  if(d.niceToHaves.selected.length || d.niceToHaves.note) prefsText.push("Nice-to-Haves: "+prefCardSummaryText(d.niceToHaves));
  if(prefsText.length){ lines.push("BUYER PREFERENCES"); lines = lines.concat(prefsText); lines.push(""); }
  if(d.preferredAreas && d.preferredAreas.length){ lines.push("PREFERRED AREAS"); lines.push(d.preferredAreas.join(", ")); lines.push(""); }
  if(financingSummaryText(d)){ lines.push("FINANCING"); lines.push(financingSummaryText(d)); lines.push(""); }
  if(familySummaryText(d)){ lines.push("FAMILY"); lines.push(familySummaryText(d)); lines.push(""); }
  if(petsSummaryText(d)){ lines.push("PETS"); lines.push(petsSummaryText(d)); lines.push(""); }
  if(dealBreakersSummaryText(d)){ lines.push("DEAL BREAKERS"); lines.push(dealBreakersSummaryText(d)); lines.push(""); }
  if(followUpSummaryText(d)){ lines.push("FOLLOW-UP"); lines.push(followUpSummaryText(d)); lines.push(""); }
  if(d.connectionSummary){ lines.push("CONNECTION SUMMARY"); lines.push(d.connectionSummary); lines.push(""); }
  return lines.join("\n").trim()+"\n";
}

        '<h2>'+esc(v.name||"Unnamed Visitor")+'</h2>' +
        '<div class="snap-sub">'+esc([v.phone,v.email].filter(Boolean).join(" · ")||sd.noContactInfo)+'</div>' +
        (headerBadges.length ? '<div class="pill-row">'+headerBadges.join("")+'</div>' : '') +

/* ============================================================
   DATA SYNC — optional Firebase-backed real-time sync so the same
   open house data appears on every paired device. Off by default;
   only active once an admin pastes in Firebase config or a sync code.
   The Firebase SDK itself is only fetched from CDN when sync is
   actually configured, so the app has zero external dependencies
   in its default (no-sync) state.
   ============================================================ */
var FIREBASE_SDK_VERSION = "10.14.1";
function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    var existing = document.querySelector('script[data-src="'+src+'"]');
    if(existing){ resolve(); return; }
    var s = document.createElement("script");
    s.src = src; s.setAttribute("data-src", src);
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error("Failed to load "+src)); };
    document.head.appendChild(s);
  });
}
function loadFirebaseSDK(){
  if(window.firebase && window.firebase.apps){ return Promise.resolve(); }
  var base = "https://www.gstatic.com/firebasejs/"+FIREBASE_SDK_VERSION+"/";
  return loadScriptOnce(base+"firebase-app-compat.js")
    .then(function(){ return loadScriptOnce(base+"firebase-auth-compat.js"); })
    .then(function(){ return loadScriptOnce(base+"firebase-database-compat.js"); });
}
function encodeSyncCode(c){
  var payload = { apiKey:c.apiKey, authDomain:c.authDomain, databaseURL:c.databaseURL, projectId:c.projectId, appId:c.appId, roomId:c.roomId };
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }catch(e){ return ""; }
}
function decodeSyncCode(code){
  try{
    var json = decodeURIComponent(escape(atob(String(code||"").trim())));
    var obj = JSON.parse(json);
    if(!obj || !obj.apiKey || !obj.databaseURL || !obj.roomId) return null;
    return obj;
  }catch(e){ return null; }
}
function syncPayload(){
  return {
    openHouses: state.openHouses,
    visitors: state.visitors,
    activeOpenHouseId: state.activeOpenHouseId,
    content: state.content,
    updatedAt: Date.now()
  };
}
function updateSyncIndicator(){
  var existing = document.getElementById("sync-banner");
  var s = state.sync || {};
  if(!s.enabled || Sync.status==="connected" || Sync.status==="off"){
    if(existing) existing.remove();
    return;
  }
  if(!existing){
    existing = document.createElement("div");
    existing.id = "sync-banner";
    document.body.insertBefore(existing, document.body.firstChild);
  }
  existing.className = "sync-banner" + (Sync.status==="connecting" ? " connecting" : "");
  existing.textContent = Sync.status==="connecting" ? "Connecting to sync…" : "Sync connection error — saving on this device only";
}
var Sync = {
  db: null,
  ref: null,
  suppressPush: false,
  pushTimer: null,
  status: "off", /* off | connecting | connected | error */
  setStatus: function(s){
    this.status = s;
    updateSyncIndicator();
    /* the status pill lives inside the Settings screen markup, so only a re-render
       of that screen (not a global one) picks up an async connect/disconnect/error
       transition; leave every other screen untouched so we never yank focus away
       from whatever an agent is mid-typing elsewhere in the app. */
    if(typeof route !== "undefined" && route && route.name === "settings"){
      appEl.removeEventListener("click", globalClickHandler);
      render();
    }
  },
  init: function(){
    var c = state.sync;
    if(!c || !c.enabled || !c.apiKey || !c.databaseURL || !c.roomId){ this.setStatus("off"); return; }
    this.setStatus("connecting");
    loadFirebaseSDK().then(function(){
      try{
        if(!window.firebase.apps.length){
          window.firebase.initializeApp({
            apiKey: c.apiKey, authDomain: c.authDomain, databaseURL: c.databaseURL,
            projectId: c.projectId, appId: c.appId
          });
        }
        window.firebase.auth().signInAnonymously().then(function(){
          Sync.db = window.firebase.database();
          Sync.ref = Sync.db.ref("rooms/" + c.roomId + "/data");
          /* Check what's already in the room before this device writes anything —
             otherwise a second device pairing in could blindly overwrite the first
             device's data with its own (empty) local state before ever reading it. */
          Sync.ref.once("value").then(function(snap){
            var remote = snap.val();
            Sync.ref.on("value", function(snap2){
              var r = snap2.val();
              if(!r || Sync.suppressPush) return;
              Sync.applyRemote(r);
            });
            Sync.setStatus("connected");
            if(remote){ Sync.applyRemote(remote); }
            else{ Sync.push(); }
          }).catch(function(err){ Sync.setStatus("error"); if(window.console) console.error("Firebase read error", err); });
        }).catch(function(err){ Sync.setStatus("error"); if(window.console) console.error("Firebase auth error", err); });
      }catch(e){ Sync.setStatus("error"); if(window.console) console.error("Firebase init error", e); }
    }).catch(function(err){ Sync.setStatus("error"); if(window.console) console.error("Firebase SDK load error", err); });
  },
  applyRemote: function(remote){
    var localUpdatedAt = state._lastSyncedAt || 0;
    if(!remote.updatedAt || remote.updatedAt <= localUpdatedAt) return;
    state.openHouses = remote.openHouses || [];
    /* Firebase Realtime Database silently drops empty arrays/objects on write — a visitor
       with no tasks, no selected motivations, etc. comes back missing those keys entirely
       rather than as []. Route every incoming visitor record back through the exact same
       normalizer migrateState() uses for locally-loaded data (migrateVisitorRecord — covers
       migrateVisitorDetail plus partySize/contactType/etc. backfills), so the rest of the
       app can keep assuming every field always exists regardless of where the record came from. */
    state.visitors = (remote.visitors || []).map(migrateVisitorRecord);
    state.activeOpenHouseId = remote.activeOpenHouseId || null;
    state.content = deepMergeDefaults(remote.content || {}, CONTENT_DEFAULTS);
    /* Critical: a remote snapshot can be older-code than this device (e.g. pushed by a
       kiosk that hasn't reloaded yet). Run it through the same shape migrations as local
       boot so a stale snapshot can never regress an already-upgraded structure — this is
       what previously made "This Home"/"Their Home Search" vanish after sync pulled in an
       old section list that only still recognized Follow-Up and Tasks by id. */
    migrateContentShape();
    syncOptionListsFromContent();
    state._lastSyncedAt = remote.updatedAt;
    this.suppressPush = true;
    saveState();
    this.suppressPush = false;
    /* Immediately push the corrected shape back up so every other device sharing this
       room converges on the upgraded structure the next time it pulls, instead of waiting
       on some unrelated future edit to trigger the next push. */
    this.push();
    appEl.removeEventListener("click", globalClickHandler);
    render();
  },
  push: function(){
    if(this.status!=="connected" || !this.ref || this.suppressPush) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(function(){
      var payload = syncPayload();
      state._lastSyncedAt = payload.updatedAt;
      Sync.ref.set(payload).catch(function(err){ if(window.console) console.error("Firebase push error", err); });
    }, 600);
  },
  disconnect: function(){
    if(this.ref){ try{ this.ref.off(); }catch(e){} }
    this.db = null; this.ref = null;
    this.setStatus("off");
  }
};

function bindContentInputs(container){

    var key = el.getAttribute("data-content");
    var evt = (el.tagName==="TEXTAREA" || el.tagName==="INPUT") ? "input" : "change";
    el.addEventListener(evt, function(){
      setPath(state.content, key, el.value);
      saveState(); flashAutosave();

function bindLogoUpload(container){
  var fileInput = container.querySelector("#settings-logo-file");

    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        state.content.brand.logoDataUrl = String(reader.result||"");
        saveState(); flashAutosave();
        appEl.removeEventListener("click", globalClickHandler);
        render();
      };
      reader.readAsDataURL(file);
    });
  }
  var removeLogoBtn = container.querySelector("#settings-logo-remove");
  if(removeLogoBtn){
    removeLogoBtn.addEventListener("click", function(){
      state.content.brand.logoDataUrl = "";
      saveState(); flashAutosave();

      render();
    });
  }
}

function mountSettingsContent(){
  var container = document.querySelector(".screen");
  if(!container) return;
  bindContentInputs(container);
  var search = container.querySelector("#content-search");
  if(search){
    search.addEventListener("input", function(){
      var q = search.value.trim().toLowerCase();
      Array.prototype.forEach.call(container.querySelectorAll(".content-search-group"), function(group){
        var rows = group.querySelectorAll(".content-search-row");
        var anyVisible = false;
        Array.prototype.forEach.call(rows, function(row){
          var match = !q || (row.getAttribute("data-search-text")||"").indexOf(q) > -1;
          row.classList.toggle("hidden", !match);
          if(match) anyVisible = true;
        });
        group.classList.toggle("hidden", !anyVisible);
      });
    });
  }
}

function mountSettingsOptions(){
  var container = document.querySelector(".screen");
  if(!container) return;
  function rerender(){ saveState(); flashAutosave(); syncOptionListsFromContent(); appEl.removeEventListener("click", globalClickHandler); render(); }

  function addOption(listKey){
    var input = container.querySelector('[data-optadd-input="'+listKey+'"]');
    if(!input) return;
    var val = input.value.trim();
    if(!val) return;
    var ok = KEYED_OPTION_LISTS.indexOf(listKey)>-1 ? addKeyedOption(listKey, val) : addSimpleOption(listKey, val);
    if(!ok){ toast("That option already exists"); return; }
    rerender();
  }

  container.addEventListener("click", function(e){
    var mv = e.target.closest("[data-opt-move]");
    if(mv){ moveSimpleOption(mv.getAttribute("data-opt-list"), mv.getAttribute("data-opt-value"), mv.getAttribute("data-opt-dir")==="up"?-1:1); rerender(); return; }
    var ar = e.target.closest("[data-opt-archive]");
    if(ar){ archiveSimpleOption(ar.getAttribute("data-opt-list"), ar.getAttribute("data-opt-value")); rerender(); return; }
    var un = e.target.closest("[data-opt-unarchive]");
    if(un){ unarchiveSimpleOption(un.getAttribute("data-opt-list"), un.getAttribute("data-opt-value")); rerender(); return; }
    var del = e.target.closest("[data-opt-delete]");
    if(del){ var r = deleteSimpleOption(del.getAttribute("data-opt-list"), del.getAttribute("data-opt-value")); toast(r==="archived" ? "In use — archived instead" : "Option deleted"); rerender(); return; }
    var kmv = e.target.closest("[data-opt-kmove]");
    if(kmv){ moveKeyedOption(kmv.getAttribute("data-opt-list"), kmv.getAttribute("data-opt-key"), kmv.getAttribute("data-opt-dir")==="up"?-1:1); rerender(); return; }
    var ktog = e.target.closest("[data-opt-ktoggle]");
    if(ktog){
      var lk = ktog.getAttribute("data-opt-list"), kk = ktog.getAttribute("data-opt-key");
      var item = (state.content.optionLists[lk]||[]).find(function(o){ return o.key===kk; });
      setKeyedOptionActive(lk, kk, item ? item.active===false : true);
      rerender(); return;
    }
    var kdel = e.target.closest("[data-opt-kdelete]");
    if(kdel){ var r2 = deleteKeyedOption(kdel.getAttribute("data-opt-list"), kdel.getAttribute("data-opt-key")); toast(r2==="archived" ? "In use — archived instead" : "Option deleted"); rerender(); return; }
    var addBtn = e.target.closest("[data-optadd-btn]");
    if(addBtn){ addOption(addBtn.getAttribute("data-optadd-btn")); return; }
  });

  Array.prototype.forEach.call(container.querySelectorAll("[data-optadd-input]"), function(input){
    input.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); addOption(input.getAttribute("data-optadd-input")); }
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-opt-rename]"), function(input){
    input.addEventListener("change", function(){
      var val = input.value.trim();
      if(!val){ input.value = input.defaultValue; return; }
      renameKeyedOption(input.getAttribute("data-opt-list"), input.getAttribute("data-opt-key"), val);
      saveState(); flashAutosave(); syncOptionListsFromContent();
    });
  });
}

    if(sm){ moveSectionConfig(sm.getAttribute("data-sec-page"), sm.getAttribute("data-sec-id"), sm.getAttribute("data-sec-dir")==="up"?-1:1); rerender(); return; }
    var st = e.target.closest("[data-sec-toggle]");
    if(st){ toggleSectionVisible(st.getAttribute("data-sec-page"), st.getAttribute("data-sec-id")); rerender(); return; }
    var fm = e.target.closest("[data-fld-move]");
    if(fm){ moveFieldConfig(fm.getAttribute("data-fld-page"), fm.getAttribute("data-fld-id"), fm.getAttribute("data-fld-dir")==="up"?-1:1); rerender(); return; }
    var fr = e.target.closest("[data-fld-req]");
    if(fr){ toggleFieldRequired(fr.getAttribute("data-fld-page"), fr.getAttribute("data-fld-id")); rerender(); return; }
    var ft = e.target.closest("[data-fld-toggle]");

      rerender(); return;

/* ============================================================
   MOUNT: wire up event listeners per-route after render
   ============================================================ */
function mountRoute(){
  appEl.removeEventListener("click", globalClickHandler);
  appEl.addEventListener("click", globalClickHandler);

  if(route.name==="visitorDetail"){ mountVisitorDetail(); }
  if(route.name==="snapshotDetail"){ mountSnapshotDetail(); }
  if(route.name==="sellerReport"){ mountSellerReport(); }
  if(route.name==="signin" && (route.params.phase||"form")==="form"){ mountSignIn(); }
  if(route.name==="signin" && route.params.phase==="neighborOffer"){ mountNeighborOffer(); }
  if(route.name==="settings"){ mountSettings(); }
}

function globalClickHandler(e){
  var navEl = e.target.closest("[data-nav]");
  if(navEl){
    var name = navEl.getAttribute("data-nav");
    var params = {};
    if(navEl.hasAttribute("data-id")) params.id = navEl.getAttribute("data-id");
    if(navEl.hasAttribute("data-filter")) params.filter = navEl.getAttribute("data-filter");
    if(navEl.hasAttribute("data-section")) params.section = navEl.getAttribute("data-section");
    appEl.removeEventListener("click", globalClickHandler);
    nav(name, params);
    return;
  }
  var actionEl = e.target.closest("[data-action]");
  if(actionEl){
    var action = actionEl.getAttribute("data-action");
    handleAction(action, actionEl);
    return;
  }
  var segEl = e.target.closest("[data-filter]");
  if(segEl && segEl.tagName==="BUTTON" && route.name==="queue"){
    appEl.removeEventListener("click", globalClickHandler);
    nav("queue", { filter: segEl.getAttribute("data-filter") });
    return;
  }
  var snapSeg = e.target.closest("[data-snapfilter]");
  if(snapSeg){
    appEl.removeEventListener("click", globalClickHandler);
    nav("snapshots", { filter: snapSeg.getAttribute("data-snapfilter") });
    return;
  }
  var archEl = e.target.closest("[data-view-archived]");
  if(archEl){
    var ohId = archEl.getAttribute("data-view-archived");
    var oh = state.openHouses.find(function(o){ return o.id===ohId; });
    if(oh) openArchivedSummary(oh);
    return;
  }
}

function handleAction(action, el){
  if(action==="createOpenHouse"){ sheetCreateOpenHouse(); return; }
  if(action==="editProperty"){ var oh = activeOpenHouse(); if(oh) sheetEditProperty(oh); return; }
  if(action==="quickAdd"){ sheetQuickCapture(); return; }
  if(action==="openViewMenu"){ openViewMenu(); return; }
  if(action==="resetContent"){
    state.content.signin = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.signin));
    state.content.quickCapture = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.quickCapture));
    state.content.pages = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.pages));
    saveState(); flashAutosave(); toast("Text reset to default");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="resetBranding"){
    state.content.brand = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.brand));
    saveState(); flashAutosave(); applyBrandStyles(); toast("Branding reset to default");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="resetFormats"){
    state.content.formats = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.formats));
    saveState(); flashAutosave(); toast("Formats reset to default");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="disconnectSync"){
    Sync.disconnect();
    state.sync = defaultSyncConfig();
    saveState(); toast("Sync disconnected");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="editContactType"){ var v3 = findVisitor(route.params.id); if(v3) sheetEditContactType(v3); return; }
  if(action==="deleteVisitor"){ var v7 = findVisitor(route.params.id); if(v7) sheetConfirmDeleteVisitor(v7); return; }
  if(action==="openMultiSelect"){
    var v6 = findVisitor(route.params.id);
    var msKey = el.getAttribute("data-ms-key");
    if(v6 && msKey) sheetMultiSelectPicker(v6, msKey);
    return;
  }
  if(action==="markNotesComplete"){
    var v = findVisitor(route.params.id);
    if(v){ v.detail.notesComplete = true; saveState(); flashAutosave(); toast("Notes marked complete"); appEl.removeEventListener("click", globalClickHandler); render(); }
    return;
  }
  if(action==="toggleFollowUp"){
    var v2 = findVisitor(route.params.id);
    if(v2){ v2.detail.followUp.status = v2.detail.followUp.status==="Completed" ? "Not Started" : "Completed"; saveState(); flashAutosave(); appEl.removeEventListener("click", globalClickHandler); render(); }
    return;
  }
  if(action==="finishDay"){
    var oh2 = activeOpenHouse();
    if(oh2){
      oh2.status = "archived";
      state.activeOpenHouseId = null;
      saveState();
      toast("Open house archived");
      appEl.removeEventListener("click", globalClickHandler);
      nav("welcome");
    }
    return;
  }
}

/* ---- Visitor Detail field bindings ---- */
function mountVisitorDetail(){
  var v = findVisitor(route.params.id);
  if(!v) return;
  var d = v.detail;
  var container = document.querySelector(".screen");
  var focusPrefNotePath = null;
  initAutosizeTextareas(container);

  /* text / textarea / select bindings — no full rerender (preserves focus + cursor).
     "name" and "email" live on the visitor record itself (v), not on v.detail (d) — every
     other data-field path is a nested detail path, so those two are special-cased. */
  Array.prototype.forEach.call(container.querySelectorAll("[data-field]"), function(el){
    var key = el.getAttribute("data-field");
    var evt = (el.tagName==="TEXTAREA" || el.tagName==="INPUT") ? "input" : "change";
    el.addEventListener(evt, function(){
      if(key==="name" || key==="email"){ v[key] = el.value; } else { setPath(d, key, el.value); }
      saveState(); flashAutosave();
      if(key==="followUp.promise" || key==="followUp.nextAction"){
        var wrap = document.getElementById("followup-done-wrap");
        if(wrap) wrap.classList.toggle("hidden", !hasFollowUpCommitment(d));
      }
      if(key==="financing.preApproval"){
        /* Lender Notes only appears when this is "Speaking With Lender" — that markup
           is conditionally rendered, so it needs a full rerender, not just a class toggle. */
        appEl.removeEventListener("click", globalClickHandler);
        render();
      }
    });
  });

  /* phone field — progressive live formatting, saved directly onto the visitor */
  var phoneEl = container.querySelector("[data-phone-field]");
  if(phoneEl){
    bindPhoneInput(phoneEl, function(val){ v.phone = val; saveState(); flashAutosave(); });
  }

  /* Currency-style inputs (This Home > Price They'd Consider, Financing > Budget Min/Max) —
     live-formatted like every other price field in the app, saved on blur-safe "input". */
  (function(){
    var priceEl = container.querySelector("#th-price-consider");
    if(priceEl){
      bindCurrencyInput(priceEl, d.thisHome.priceConsider);
      priceEl.addEventListener("input", function(){ d.thisHome.priceConsider = currencyValue(priceEl); saveState(); flashAutosave(); });
    }
    var minEl = container.querySelector("#fin-budget-min");
    if(minEl){
      bindCurrencyInput(minEl, d.financing.budgetMin);
      minEl.addEventListener("input", function(){ d.financing.budgetMin = currencyValue(minEl); saveState(); flashAutosave(); });
    }
    var maxEl = container.querySelector("#fin-budget-max");
    if(maxEl){
      bindCurrencyInput(maxEl, d.financing.budgetMax);
      maxEl.addEventListener("input", function(){ d.financing.budgetMax = currencyValue(maxEl); saveState(); flashAutosave(); });
    }
  })();

  /* Single Story Required — independent hard-requirement toggle, distinct from picking
     "Single Story" under Stories (a preference, not a dealbreaker). */
  var singleStoryEl = container.querySelector("#single-story-required");
  if(singleStoryEl){
    singleStoryEl.addEventListener("change", function(){
      d.singleStoryRequired = singleStoryEl.checked; saveState(); flashAutosave();
    });
  }

  /* Neighbor Home Value Follow-Up — lets an agent flag/unflag this by hand too (e.g. a
     Neighbor captured via Quick Capture rather than the kiosk). Triggers a full rerender
     since the "Home Valuation Requested" pill and Next Action line are conditionally
     rendered, not just class-toggled. */
  var valuationEl = container.querySelector("#home-valuation-requested");
  if(valuationEl){
    valuationEl.addEventListener("change", function(){
      d.homeValuationRequested = valuationEl.checked;
      if(d.homeValuationRequested && !d.followUp.nextAction) d.followUp.nextAction = "Prepare Market Analysis";
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    });
  }

  /* Preferred Areas — tag input with chips + remove + offline autocomplete */
  (function(){
    var input = container.querySelector("#pa-new");
    var addBtn = container.querySelector("#pa-add");
    var wrap = input ? input.closest(".autocomplete-wrap") : null;
    if(!input) return;
    var listEl = null;
    function closeList(){ if(listEl){ listEl.remove(); listEl = null; } }
    function renderList(items){
      closeList();
      if(!items || !items.length) return;
      listEl = document.createElement("div");
      listEl.className = "autocomplete-list";
      listEl.innerHTML = items.map(function(it,i){ return '<div class="autocomplete-item" data-pa-idx="'+i+'">'+esc(it)+'</div>'; }).join("");
      wrap.appendChild(listEl);
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-pa-idx]"), function(el){
        el.addEventListener("mousedown", function(e){ e.preventDefault(); });
        el.addEventListener("click", function(){ addArea(items[parseInt(el.getAttribute("data-pa-idx"),10)]); });
      });
    }
    function addArea(raw){
      var val = (raw!=null ? raw : input.value).trim();
      if(!val) return;
      var exists = (d.preferredAreas||[]).some(function(a){ return a.toLowerCase()===val.toLowerCase(); });
      if(!exists){ d.preferredAreas = (d.preferredAreas||[]).concat([val]); saveState(); flashAutosave(); }
      input.value = ""; closeList();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    }
    input.addEventListener("input", function(){ renderList(preferredAreaSuggestions(input.value)); });
    input.addEventListener("focus", function(){ renderList(preferredAreaSuggestions(input.value)); });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); addArea(); } });
    input.addEventListener("blur", function(){ setTimeout(closeList, 200); });
    if(addBtn){ addBtn.addEventListener("click", function(){ addArea(); }); }
    Array.prototype.forEach.call(container.querySelectorAll("[data-area-remove]"), function(el){
      el.addEventListener("click", function(){
        var val = el.getAttribute("data-area-remove");
        d.preferredAreas = (d.preferredAreas||[]).filter(function(a){ return a!==val; });
        saveState(); flashAutosave();
        appEl.removeEventListener("click", globalClickHandler);
        render();
      });
    });
  })();

  /* chip-based controls — full rerender after change (not focus-sensitive) */
  container.addEventListener("click", function(e){
    var prefCard = e.target.closest("[data-prefcard]");
    if(prefCard){
      var cardKey = prefCard.getAttribute("data-prefcard");
      var otherKey = cardKey === "mustHaves" ? "niceToHaves" : "mustHaves";
      var val = prefCard.getAttribute("data-val");
      var arr = d[cardKey].selected.slice();
      var idx = arr.indexOf(val);
      var wasAdded = false;
      if(idx>-1){ arr.splice(idx,1); }
      else{ arr.push(val); wasAdded = true; d[otherKey].selected = d[otherKey].selected.filter(function(x){ return x!==val; }); }
      d[cardKey].selected = arr;
      if(wasAdded && val==="Other"){ focusPrefNotePath = cardKey+".note"; }
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
      return;
    }
    var single = e.target.closest("[data-single]");
    if(single){
      var path = single.getAttribute("data-single");
      var sval = single.getAttribute("data-val");
      /* "Real Estate Goal" and "Timeline" (Their Home Search) reuse visitPurpose/buyingTimeline,
         which live on the visitor record itself, not under detail. */
      var targetObj = (path==="visitPurpose" || path==="buyingTimeline") ? v : d;
      var cur2 = getPath(targetObj, path);
      setPath(targetObj, path, cur2===sval ? "" : sval);
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
      return;
    }
    var multi = e.target.closest("[data-multi]");
    if(multi){
      var path2 = multi.getAttribute("data-multi");
      var val2 = multi.getAttribute("data-val");
      var groupEl = multi.closest("[data-exclusive]");
      var exclusiveVals = groupEl ? groupEl.getAttribute("data-exclusive").split("|") : [];
      var arr2 = (getPath(d, path2) || []).slice();
      var idx2 = arr2.indexOf(val2);
      if(idx2>-1){ arr2.splice(idx2,1); }
      else{
        if(exclusiveVals.indexOf(val2)>-1){ arr2 = [val2]; }
        else{ arr2 = arr2.filter(function(x){ return exclusiveVals.indexOf(x)===-1; }); arr2.push(val2); }
      }
      setPath(d, path2, arr2);
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
      return;
    }
  });

  if(focusPrefNotePath){
    var noteEl = container.querySelector('[data-field="'+focusPrefNotePath+'"]');
    if(noteEl) noteEl.focus();
  }

  var addTaskBtn = container.querySelector("#add-task");
  var taskInput = container.querySelector("#new-task");
  function addTask(){
    var text = taskInput.value.trim();
    if(!text) return;
    d.tasks.push({ id: uid(), text: text, done:false, dueDate:"", assignedTo:"" });
    saveState(); flashAutosave();
    appEl.removeEventListener("click", globalClickHandler);
    render();
  }
  if(addTaskBtn){ addTaskBtn.addEventListener("click", addTask); }
  if(taskInput){ taskInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); addTask(); } }); }

  Array.prototype.forEach.call(container.querySelectorAll("[data-task]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task");
      var t = d.tasks.find(function(x){ return x.id===id; });
      if(t){ t.done = !t.done; saveState(); flashAutosave(); appEl.removeEventListener("click", globalClickHandler); render(); }
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-task-del]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task-del");
      d.tasks = d.tasks.filter(function(x){ return x.id!==id; });
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-task-date]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task-date");
      var t = d.tasks.find(function(x){ return x.id===id; });
      if(!t) return;
      var body = '<div class="sheet-head"><h3>Due Date</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
        '<div class="sheet-body"><input type="date" id="td-date" value="'+esc(t.dueDate||"")+'" style="width:100%;border:1px solid var(--line);background:var(--mist);border-radius:14px;padding:15px 16px;font-size:16px;"></div>' +
        '<div class="sheet-footer"><button class="btn btn-primary" id="td-save">Save</button></div>';
      openSheet(body, function(sheet, close){
        sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
        sheet.querySelector("#td-save").addEventListener("click", function(){
          t.dueDate = sheet.querySelector("#td-date").value;
          saveState(); flashAutosave(); close();
          appEl.removeEventListener("click", globalClickHandler);
          render();
        });
      });
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-task-assignee]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task-assignee");
      var t = d.tasks.find(function(x){ return x.id===id; });
      if(!t) return;
      var body = '<div class="sheet-head"><h3>Assign Task</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
        '<div class="sheet-body"><div class="chip-group">' +
          ASSIGNEES.map(function(a){ return '<button type="button" class="chip'+(t.assignedTo===a?" selected":"")+'" data-assignee-val="'+esc(a)+'">'+esc(a)+'</button>'; }).join("") +
        '</div></div>';
      openSheet(body, function(sheet, close){
        sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
        Array.prototype.forEach.call(sheet.querySelectorAll("[data-assignee-val]"), function(btn){
          btn.addEventListener("click", function(){
            t.assignedTo = btn.getAttribute("data-assignee-val");
            saveState(); flashAutosave(); close();
            appEl.removeEventListener("click", globalClickHandler);
            render();
          });
        });
      });
    });
  });
}

function mountSnapshotDetail(){
  var v = findVisitor(route.params.id);
  if(!v) return;
  var plainText = buildSnapshotPlainText(v);
  var btn = document.getElementById("btn-copy-snap");
  if(btn){
    btn.addEventListener("click", function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(plainText).then(function(){ toast("Snapshot copied"); }).catch(function(){ fallbackCopy(plainText); });
      }else{
        fallbackCopy(plainText);
      }
    });
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Snapshot copied"); }catch(e){ toast("Copy not supported"); }
    document.body.removeChild(ta);
  }
}

/* ============================================================
   INIT
   ============================================================ */
Sync.init();
render();

})();
</script>
</body>
