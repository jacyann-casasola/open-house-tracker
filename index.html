/* ---- Data Sync ---- */
function syncStatusLabel(){
  var s = state.sync || {};
  if(!s.enabled) return "Not Set Up";
  if(Sync.status==="connected") return "Synced";
  if(Sync.status==="connecting") return "Connecting…";
  if(Sync.status==="error") return "Connection Error";
  return "Not Set Up";
}
function syncStatusClass(){
  var s = state.sync || {};
  if(!s.enabled) return "off";
  if(Sync.status==="connected") return "connected";
  if(Sync.status==="connecting") return "connecting";
  if(Sync.status==="error") return "error";
  return "off";
}
function screenSettingsSync(){
  var s = state.sync || defaultSyncConfig();
  var body;
  if(s.enabled){
    var code = encodeSyncCode(s);
    body =
      '<div class="section-head"><h3>Status</h3></div>' +
      '<div class="card">' +
        '<div class="settings-row"><span class="sync-status-pill '+syncStatusClass()+'">'+esc(syncStatusLabel())+'</span></div>' +
        '<div class="settings-help" style="margin-top:12px;">This device pushes and pulls visitor and open house data through your Firebase project in real time.</div>' +
      '</div>' +
      '<div class="section-head"><h3>Pair Another Device</h3></div>' +
      '<div class="card">' +
        '<div class="settings-help" style="margin-bottom:10px;">Paste this code into Data Sync on your other device (phone, iPad, etc.) to connect it to the same live data.</div>' +
        '<textarea readonly id="sync-code-display" style="width:100%;border:1px solid var(--line);background:var(--mist);border-radius:14px;padding:14px 16px;font-size:12.5px;min-height:80px;font-family:monospace;word-break:break-all;">'+esc(code)+'</textarea>' +
        '<button type="button" class="btn btn-secondary btn-sm" id="sync-copy-btn" style="margin-top:10px;">Copy Sync Code</button>' +
      '</div>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-action="disconnectSync" style="margin-bottom:12px;">Disconnect This Device</button>';
  }else{
    body =
      '<div class="settings-help" style="margin-bottom:18px;">Sync keeps visitor and open house data identical across every device, in real time, using a free Firebase project as the backend. Nothing here is required — the tracker works fully offline without it.</div>' +
      '<div class="section-head"><h3>Have a Sync Code?</h3></div>' +
      '<div class="card">' +
        '<div class="settings-help" style="margin-bottom:10px;">Paste the code from a device that\'s already connected.</div>' +
        '<textarea id="sync-code-input" placeholder="Paste sync code here…" style="width:100%;border:1px solid var(--line);background:var(--mist);border-radius:14px;padding:14px 16px;font-size:13px;min-height:80px;font-family:monospace;"></textarea>' +
        '<button type="button" class="btn btn-primary btn-sm" id="sync-connect-code-btn" style="margin-top:10px;">Connect</button>' +
      '</div>' +
      '<div class="section-head"><h3>First-Time Setup</h3></div>' +
      '<div class="card">' +
        '<div class="settings-help" style="margin-bottom:12px;">Paste these values from your Firebase project\'s Web App config.</div>' +
        '<div class="field"><label>API Key</label><input type="text" id="sync-apiKey" value="'+esc(s.apiKey)+'"></div>' +
        '<div class="field"><label>Auth Domain</label><input type="text" id="sync-authDomain" value="'+esc(s.authDomain)+'"></div>' +
        '<div class="field"><label>Database URL</label><input type="text" id="sync-databaseURL" value="'+esc(s.databaseURL)+'"></div>' +
        '<div class="field"><label>Project ID</label><input type="text" id="sync-projectId" value="'+esc(s.projectId)+'"></div>' +
        '<div class="field" style="margin-bottom:0;"><label>App ID</label><input type="text" id="sync-appId" value="'+esc(s.appId)+'"></div>' +
      '</div>' +
      '<button type="button" class="btn btn-primary btn-sm" id="sync-create-btn" style="margin-bottom:12px;">Create &amp; Connect</button>';
  }
  return '<div class="screen">' + topbar("Data Sync", {backTo:"settings"}) +
    '<div class="content">' + body + '</div></div>';
}
function mountSettingsSync(){
  var container = document.querySelector(".screen");
  if(!container) return;

  var copyBtn = container.querySelector("#sync-copy-btn");
  if(copyBtn){
    copyBtn.addEventListener("click", function(){
      var ta = container.querySelector("#sync-code-display");
      if(!ta) return;
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Sync code copied"); }).catch(function(){ toast("Copy not supported"); });
      }else{
        try{ document.execCommand("copy"); toast("Sync code copied"); }catch(e){ toast("Copy not supported"); }
      }
    });
  }

  var connectCodeBtn = container.querySelector("#sync-connect-code-btn");
  if(connectCodeBtn){
    connectCodeBtn.addEventListener("click", function(){
      var input = container.querySelector("#sync-code-input");
      var decoded = input ? decodeSyncCode(input.value) : null;
      if(!decoded){ toast("That code doesn't look right"); return; }
      state.sync = { enabled:true, apiKey:decoded.apiKey, authDomain:decoded.authDomain||"", databaseURL:decoded.databaseURL, projectId:decoded.projectId||"", appId:decoded.appId||"", roomId:decoded.roomId };
      saveState();
      Sync.init();
      toast("Connecting…");
      appEl.removeEventListener("click", globalClickHandler);
      render();
    });
  }

  var createBtn = container.querySelector("#sync-create-btn");
  if(createBtn){
    createBtn.addEventListener("click", function(){
      var apiKey = (container.querySelector("#sync-apiKey")||{}).value || "";
      var authDomain = (container.querySelector("#sync-authDomain")||{}).value || "";
      var databaseURL = (container.querySelector("#sync-databaseURL")||{}).value || "";
      var projectId = (container.querySelector("#sync-projectId")||{}).value || "";
      var appId = (container.querySelector("#sync-appId")||{}).value || "";
      if(!apiKey.trim() || !databaseURL.trim()){ toast("API Key and Database URL are required"); return; }
      state.sync = {
        enabled:true, apiKey:apiKey.trim(), authDomain:authDomain.trim(), databaseURL:databaseURL.trim(),
        projectId:projectId.trim(), appId:appId.trim(), roomId: slugify(cfg("brand.companyName")) + "-" + uid()
      };
      saveState();
      Sync.init();
      toast("Connecting…");
      appEl.removeEventListener("click", globalClickHandler);
      render();
    });
  }
}

/* ============================================================
   MOUNT: wire up event listeners per-route after render
   ============================================================ */
function mountRoute(){
  appEl.removeEventListener("click", globalClickHandler);
  appEl.addEventListener("click", globalClickHandler);

  if(route.name==="visitorDetail"){ mountVisitorDetail(); }
  if(route.name==="snapshotDetail"){ mountSnapshotDetail(); }
  if(route.name==="signin" && (route.params.phase||"form")==="form"){ mountSignIn(); }
  if(route.name==="settings"){ mountSettings(); }
}

function globalClickHandler(e){
  var navEl = e.target.closest("[data-nav]");
  if(navEl){
    var name = navEl.getAttribute("data-nav");
    var params = {};
    if(navEl.hasAttribute("data-id")) params.id = navEl.getAttribute("data-id");
    if(navEl.hasAttribute("data-filter")) params.filter = navEl.getAttribute("data-filter");
    if(navEl.hasAttribute("data-section")) params.section = navEl.getAttribute("data-section");
    appEl.removeEventListener("click", globalClickHandler);
    nav(name, params);
    return;
  }
  var actionEl = e.target.closest("[data-action]");
  if(actionEl){
    var action = actionEl.getAttribute("data-action");
    handleAction(action, actionEl);
    return;
  }
  var segEl = e.target.closest("[data-filter]");
  if(segEl && segEl.tagName==="BUTTON" && route.name==="queue"){
    appEl.removeEventListener("click", globalClickHandler);
    nav("queue", { filter: segEl.getAttribute("data-filter") });
    return;
  }
  var snapSeg = e.target.closest("[data-snapfilter]");
  if(snapSeg){
    appEl.removeEventListener("click", globalClickHandler);
    nav("snapshots", { filter: snapSeg.getAttribute("data-snapfilter") });
    return;
  }
  var archEl = e.target.closest("[data-view-archived]");
  if(archEl){
    var ohId = archEl.getAttribute("data-view-archived");
    var oh = state.openHouses.find(function(o){ return o.id===ohId; });
    if(oh) openArchivedSummary(oh);
    return;
  }
}

function handleAction(action, el){
  if(action==="createOpenHouse"){ sheetCreateOpenHouse(); return; }
  if(action==="editProperty"){ var oh = activeOpenHouse(); if(oh) sheetEditProperty(oh); return; }
  if(action==="quickAdd"){ sheetQuickCapture(); return; }
  if(action==="openViewMenu"){ openViewMenu(); return; }
  if(action==="resetContent"){
    state.content.signin = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.signin));
    state.content.quickCapture = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.quickCapture));
    state.content.pages = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.pages));
    saveState(); flashAutosave(); toast("Text reset to default");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="resetBranding"){
    state.content.brand = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.brand));
    saveState(); flashAutosave(); applyBrandStyles(); toast("Branding reset to default");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="resetFormats"){
    state.content.formats = JSON.parse(JSON.stringify(CONTENT_DEFAULTS.formats));
    saveState(); flashAutosave(); toast("Formats reset to default");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="disconnectSync"){
    Sync.disconnect();
    state.sync = defaultSyncConfig();
    saveState(); toast("Sync disconnected");
    appEl.removeEventListener("click", globalClickHandler); render();
    return;
  }
  if(action==="editContactType"){ var v3 = findVisitor(route.params.id); if(v3) sheetEditContactType(v3); return; }
  if(action==="markNotesComplete"){
    var v = findVisitor(route.params.id);
    if(v){ v.detail.notesComplete = true; saveState(); flashAutosave(); toast("Notes marked complete"); appEl.removeEventListener("click", globalClickHandler); render(); }
    return;
  }
  if(action==="toggleFollowUp"){
    var v2 = findVisitor(route.params.id);
    if(v2){ v2.detail.followUp.status = v2.detail.followUp.status==="Completed" ? "Not Started" : "Completed"; saveState(); flashAutosave(); appEl.removeEventListener("click", globalClickHandler); render(); }
    return;
  }
  if(action==="finishDay"){
    var oh2 = activeOpenHouse();
    if(oh2){
      oh2.status = "archived";
      state.activeOpenHouseId = null;
      saveState();
      toast("Open house archived");
      appEl.removeEventListener("click", globalClickHandler);
      nav("welcome");
    }
    return;
  }
}

function openArchivedSummary(oh){
  var list = visitorsFor(oh.id);
  var meaningful = list.filter(isMeaningfulOpportunity);
  var promises = list.filter(function(v){ return hasFollowUpCommitment(v.detail); });
  var body =
    '<div class="sheet-head"><h3>'+esc(propertyTitle(oh))+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body">' +
      '<div class="kicker-row">'+esc(formatDateLong(oh.date))+' · '+esc(timeRange(oh))+'</div>' +
      '<div class="stat-grid" style="margin-top:14px;">' +
        '<div class="stat-tile"><div class="num">'+list.length+'</div><div class="lbl">Visitors</div></div>' +
        '<div class="stat-tile"><div class="num">'+meaningful.length+'</div><div class="lbl">Opportunities</div></div>' +
        '<div class="stat-tile"><div class="num">'+promises.length+'</div><div class="lbl">Follow-Ups</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="sheet-footer"><button class="btn btn-secondary" id="btn-reactivate">Reopen as Active</button></div>';
  openSheet(body, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    sheet.querySelector("#btn-reactivate").addEventListener("click", function(){
      var current = activeOpenHouse();
      if(current) current.status = "archived";
      oh.status = "active";
      state.activeOpenHouseId = oh.id;
      saveState();
      close();
      nav("activeOpenHouse");
    });
  });
}

/* ---- Visitor Detail field bindings ---- */
function mountVisitorDetail(){
  var v = findVisitor(route.params.id);
  if(!v) return;
  var d = v.detail;
  var container = document.querySelector(".screen");
  var focusPrefNotePath = null;

  /* text / textarea / select bindings — no full rerender (preserves focus + cursor) */
  Array.prototype.forEach.call(container.querySelectorAll("[data-field]"), function(el){
    var key = el.getAttribute("data-field");
    var evt = (el.tagName==="TEXTAREA" || el.tagName==="INPUT") ? "input" : "change";
    el.addEventListener(evt, function(){
      setPath(d, key, el.value); saveState(); flashAutosave();
      if(key==="followUp.promise" || key==="followUp.nextAction"){
        var wrap = document.getElementById("followup-done-wrap");
        if(wrap) wrap.classList.toggle("hidden", !hasFollowUpCommitment(d));
      }
    });
  });

  /* phone field — progressive live formatting, saved directly onto the visitor */
  var phoneEl = container.querySelector("[data-phone-field]");
  if(phoneEl){
    bindPhoneInput(phoneEl, function(val){ v.phone = val; saveState(); flashAutosave(); });
  }

  /* Preferred Areas — tag input with chips + remove + offline autocomplete */
  (function(){
    var input = container.querySelector("#pa-new");
    var addBtn = container.querySelector("#pa-add");
    var wrap = input ? input.closest(".autocomplete-wrap") : null;
    if(!input) return;
    var listEl = null;
    function closeList(){ if(listEl){ listEl.remove(); listEl = null; } }
    function renderList(items){
      closeList();
      if(!items || !items.length) return;
      listEl = document.createElement("div");
      listEl.className = "autocomplete-list";
      listEl.innerHTML = items.map(function(it,i){ return '<div class="autocomplete-item" data-pa-idx="'+i+'">'+esc(it)+'</div>'; }).join("");
      wrap.appendChild(listEl);
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-pa-idx]"), function(el){
        el.addEventListener("mousedown", function(e){ e.preventDefault(); });
        el.addEventListener("click", function(){ addArea(items[parseInt(el.getAttribute("data-pa-idx"),10)]); });
      });
    }
    function addArea(raw){
      var val = (raw!=null ? raw : input.value).trim();
      if(!val) return;
      var exists = (d.preferredAreas||[]).some(function(a){ return a.toLowerCase()===val.toLowerCase(); });
      if(!exists){ d.preferredAreas = (d.preferredAreas||[]).concat([val]); saveState(); flashAutosave(); }
      input.value = ""; closeList();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    }
    input.addEventListener("input", function(){ renderList(preferredAreaSuggestions(input.value)); });
    input.addEventListener("focus", function(){ renderList(preferredAreaSuggestions(input.value)); });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); addArea(); } });
    input.addEventListener("blur", function(){ setTimeout(closeList, 200); });
    if(addBtn){ addBtn.addEventListener("click", function(){ addArea(); }); }
    Array.prototype.forEach.call(container.querySelectorAll("[data-area-remove]"), function(el){
      el.addEventListener("click", function(){
        var val = el.getAttribute("data-area-remove");
        d.preferredAreas = (d.preferredAreas||[]).filter(function(a){ return a!==val; });
        saveState(); flashAutosave();
        appEl.removeEventListener("click", globalClickHandler);
        render();
      });
    });
  })();

  /* chip-based controls — full rerender after change (not focus-sensitive) */
  container.addEventListener("click", function(e){
    var prefCard = e.target.closest("[data-prefcard]");
    if(prefCard){
      var cardKey = prefCard.getAttribute("data-prefcard");
      var otherKey = cardKey === "mustHaves" ? "niceToHaves" : "mustHaves";
      var val = prefCard.getAttribute("data-val");
      var arr = d[cardKey].selected.slice();
      var idx = arr.indexOf(val);
      var wasAdded = false;
      if(idx>-1){ arr.splice(idx,1); }
      else{ arr.push(val); wasAdded = true; d[otherKey].selected = d[otherKey].selected.filter(function(x){ return x!==val; }); }
      d[cardKey].selected = arr;
      if(wasAdded && val==="Other"){ focusPrefNotePath = cardKey+".note"; }
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
      return;
    }
    var single = e.target.closest("[data-single]");
    if(single){
      var path = single.getAttribute("data-single");
      var sval = single.getAttribute("data-val");
      var cur2 = getPath(d, path);
      setPath(d, path, cur2===sval ? "" : sval);
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
      return;
    }
    var multi = e.target.closest("[data-multi]");
    if(multi){
      var path2 = multi.getAttribute("data-multi");
      var val2 = multi.getAttribute("data-val");
      var groupEl = multi.closest("[data-exclusive]");
      var exclusiveVals = groupEl ? groupEl.getAttribute("data-exclusive").split("|") : [];
      var arr2 = (getPath(d, path2) || []).slice();
      var idx2 = arr2.indexOf(val2);
      if(idx2>-1){ arr2.splice(idx2,1); }
      else{
        if(exclusiveVals.indexOf(val2)>-1){ arr2 = [val2]; }
        else{ arr2 = arr2.filter(function(x){ return exclusiveVals.indexOf(x)===-1; }); arr2.push(val2); }
      }
      setPath(d, path2, arr2);
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
      return;
    }
  });

  if(focusPrefNotePath){
    var noteEl = container.querySelector('[data-field="'+focusPrefNotePath+'"]');
    if(noteEl) noteEl.focus();
  }

  var addTaskBtn = container.querySelector("#add-task");
  var taskInput = container.querySelector("#new-task");
  function addTask(){
    var text = taskInput.value.trim();
    if(!text) return;
    d.tasks.push({ id: uid(), text: text, done:false, dueDate:"", assignedTo:"" });
    saveState(); flashAutosave();
    appEl.removeEventListener("click", globalClickHandler);
    render();
  }
  if(addTaskBtn){ addTaskBtn.addEventListener("click", addTask); }
  if(taskInput){ taskInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); addTask(); } }); }

  Array.prototype.forEach.call(container.querySelectorAll("[data-task]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task");
      var t = d.tasks.find(function(x){ return x.id===id; });
      if(t){ t.done = !t.done; saveState(); flashAutosave(); appEl.removeEventListener("click", globalClickHandler); render(); }
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-task-del]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task-del");
      d.tasks = d.tasks.filter(function(x){ return x.id!==id; });
      saveState(); flashAutosave();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-task-date]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task-date");
      var t = d.tasks.find(function(x){ return x.id===id; });
      if(!t) return;
      var body = '<div class="sheet-head"><h3>Due Date</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
        '<div class="sheet-body"><input type="date" id="td-date" value="'+esc(t.dueDate||"")+'" style="width:100%;border:1px solid var(--line);background:var(--mist);border-radius:14px;padding:15px 16px;font-size:16px;"></div>' +
        '<div class="sheet-footer"><button class="btn btn-primary" id="td-save">Save</button></div>';
      openSheet(body, function(sheet, close){
        sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
        sheet.querySelector("#td-save").addEventListener("click", function(){
          t.dueDate = sheet.querySelector("#td-date").value;
          saveState(); flashAutosave(); close();
          appEl.removeEventListener("click", globalClickHandler);
          render();
        });
      });
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-task-assignee]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-task-assignee");
      var t = d.tasks.find(function(x){ return x.id===id; });
      if(!t) return;
      var body = '<div class="sheet-head"><h3>Assign Task</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
        '<div class="sheet-body"><div class="chip-group">' +
          ASSIGNEES.map(function(a){ return '<button type="button" class="chip'+(t.assignedTo===a?" selected":"")+'" data-assignee-val="'+esc(a)+'">'+esc(a)+'</button>'; }).join("") +
        '</div></div>';
      openSheet(body, function(sheet, close){
        sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
        Array.prototype.forEach.call(sheet.querySelectorAll("[data-assignee-val]"), function(btn){
          btn.addEventListener("click", function(){
            t.assignedTo = btn.getAttribute("data-assignee-val");
            saveState(); flashAutosave(); close();
            appEl.removeEventListener("click", globalClickHandler);
            render();
          });
        });
      });
    });
  });
}

function mountSnapshotDetail(){
  var v = findVisitor(route.params.id);
  if(!v) return;
  var plainText = buildSnapshotPlainText(v);
  var btn = document.getElementById("btn-copy-snap");
  if(btn){
    btn.addEventListener("click", function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(plainText).then(function(){ toast("Snapshot copied"); }).catch(function(){ fallbackCopy(plainText); });
      }else{
        fallbackCopy(plainText);
      }
    });
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Snapshot copied"); }catch(e){ toast("Copy not supported"); }
    document.body.removeChild(ta);
  }
}

   ============================================================ */
Sync.init();
render();
