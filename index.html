<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Open House Tracker — Villa Casa Home Group</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0c">
<style>
/* ============================================================
   VILLA CASA HOME GROUP — OPEN HOUSE TRACKER
   Design system: calm, premium, black/white/gray, serif + sans
   ============================================================ */

:root{
  --ink:#111110;
  --ink-soft:#4a4a47;
  --ink-faint:#8a8a86;
  --paper:#ffffff;
  --mist:#f4f3f1;
  --mist-deep:#eceae6;
  --line:#e3e1dc;
  --line-soft:#edece8;
  --accent:#111110;
  --danger:#a13b2b;
  --success:#3b6b4f;
  --gold:#a6813d;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(17,17,16,0.04), 0 1px 1px rgba(17,17,16,0.03);
  --shadow-2: 0 8px 28px rgba(17,17,16,0.08), 0 2px 8px rgba(17,17,16,0.04);
  --shadow-3: 0 24px 64px rgba(17,17,16,0.18), 0 4px 16px rgba(17,17,16,0.08);

  --ease: cubic-bezier(.16,.84,.32,1);
  --ease-spring: cubic-bezier(.2,1.1,.3,1);

  color-scheme: light;
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: var(--mist);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  min-height: 100vh;
  min-height: 100dvh;
}
h1,h2,h3,h4{ font-family: var(--serif); font-weight: 700; margin:0; letter-spacing:-0.02em; }
p{ margin:0; }
button{ font-family: inherit; cursor:pointer; }
input,textarea,select{ font-family: inherit; }
::selection{ background: var(--ink); color:var(--paper); }

/* ---------- App shell ---------- */
#app{
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  background: var(--mist);
}

.screen{ animation: rise .38s var(--ease); }
@keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:none; } }

.topbar{
  position: sticky; top:0; z-index: 20;
  display:flex; align-items:center; gap:12px;
  padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
  background: linear-gradient(var(--mist) 78%, transparent);
  backdrop-filter: saturate(160%) blur(8px);
}
.topbar .back{
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: var(--paper); border:1px solid var(--line);
  box-shadow: var(--shadow-1);
  flex:none;
  transition: transform .15s var(--ease), background .15s var(--ease);
}
.topbar .back:active{ transform: scale(.9); background: var(--mist-deep); }
.topbar .back svg{ width:16px; height:16px; }
.topbar h1{ font-size: 20px; flex:1; font-weight:700; }
.topbar .side-action{
  font-size:14px; color: var(--ink-soft); background:none; border:none; padding:8px; font-weight:600;
}

.content{ padding: 4px 20px 24px; }
.eyebrow{
  text-transform: uppercase; letter-spacing: .12em; font-size:11px; font-weight:600;
  color: var(--ink-faint); margin-bottom: 6px;
}

/* ---------- Buttons ---------- */
.btn{
  appearance:none; border:none; border-radius: var(--r-pill);
  padding: 16px 24px; font-size:16px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition: transform .15s var(--ease-spring), box-shadow .2s var(--ease), background .15s var(--ease), opacity .15s;
  width:100%;
}
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--ink); color: var(--paper); box-shadow: var(--shadow-2); }
.btn-primary:active{ box-shadow: var(--shadow-1); }
.btn-secondary{ background: var(--paper); color: var(--ink); border:1px solid var(--line); }
.btn-ghost{ background:transparent; color: var(--ink-soft); }
.btn-danger-ghost{ background:transparent; color: var(--danger); }
.btn-sm{ padding:10px 18px; font-size:14px; width:auto; }
.btn[disabled]{ opacity:.35; pointer-events:none; }
.btn-row{ display:flex; gap:12px; }
.btn-row .btn{ flex:1; }

.link-row{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:14px; color: var(--ink-soft); font-size:14px; font-weight:500;
}

/* ---------- Cards ---------- */
.card{
  background: var(--paper); border-radius: var(--r-md);
  box-shadow: var(--shadow-1); border:1px solid var(--line-soft);
  padding: 22px;
}
.card + .card{ margin-top:14px; }

.property-card{
  background: linear-gradient(160deg, #171613, #0c0c0b);
  color: var(--paper); border-radius: var(--r-lg);
  padding: 28px 24px; position:relative; overflow:hidden;
  box-shadow: var(--shadow-3);
}
.property-card::after{
  content:""; position:absolute; inset:0;
  background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.08), transparent 60%);
}
.property-card .pc-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:10px; }
.property-card h2{ font-size: 26px; line-height:1.25; color:#fff; font-weight:700; }
.property-card .pc-meta{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px 18px; font-size:14px; color:rgba(255,255,255,.75); }
.property-card .pc-meta b{ color:#fff; font-weight:600; }
.property-card .pc-when{
  margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:space-between; font-size:14px; color:rgba(255,255,255,.85);
}
.pulse-dot{
  width:8px; height:8px; border-radius:50%; background:#7fd39a; display:inline-block; margin-right:8px;
  box-shadow: 0 0 0 rgba(127,211,154,.6); animation: pulse 2.2s infinite;
}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(127,211,154,.55);}
  70%{ box-shadow:0 0 0 9px rgba(127,211,154,0);}
  100%{ box-shadow:0 0 0 0 rgba(127,211,154,0);}
}

/* ---------- Stat tiles ---------- */
.stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin: 18px 0; }
.stat-tile{
  background: var(--paper); border-radius: var(--r-md); padding: 16px 12px;
  text-align:center; border:1px solid var(--line-soft); box-shadow: var(--shadow-1);
  transition: transform .15s var(--ease-spring);
}
.stat-tile:active{ transform: scale(.96); }
.stat-tile .num{ font-family: var(--serif); font-size: 30px; line-height:1; font-weight:700; }
.stat-tile .lbl{ font-size:11.5px; color: var(--ink-soft); margin-top:6px; line-height:1.3; }
.stat-tile.warn .num{ color:#8a5a2a; }
.stat-tile.urgent .num{ color: var(--danger); }

/* ---------- Section headers ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between; margin: 26px 0 12px;
}
.section-head h3{ font-size:19px; }
.section-head .see-all{ font-size:13px; color: var(--ink-soft); font-weight:600; }

/* ---------- List rows / Visitor cards ---------- */
.visitor-card{
  background: var(--paper); border-radius: var(--r-md); padding: 16px 18px;
  display:flex; align-items:center; gap:14px; border:1px solid var(--line-soft);
  box-shadow: var(--shadow-1); transition: transform .15s var(--ease-spring), box-shadow .2s;
  margin-bottom: 10px;
}
.visitor-card:active{ transform: scale(.985); }
.v-avatar{
  width:44px; height:44px; border-radius:50%; background: var(--mist-deep);
  display:flex; align-items:center; justify-content:center; font-family: var(--serif); font-size:17px; font-weight:700;
  flex:none; color: var(--ink);
}
.v-main{ flex:1; min-width:0; }
.v-name{ font-size:16.5px; font-weight:600; }
.v-sub{ font-size:13px; color: var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.v-badges{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none; }
.badge{
  font-size:11px; font-weight:700; padding:5px 10px; border-radius: var(--r-pill);
  letter-spacing:.02em; white-space:nowrap;
}
.badge-followup{ background:#fbe9e4; color:#a13b2b; }
.badge-capture{ background:#fbf1de; color:#8a5a2a; }
.badge-complete{ background:#e7f2ea; color:#3b6b4f; }
.chev{ color: var(--ink-faint); }

.empty-state{
  text-align:center; padding: 48px 20px; color: var(--ink-soft);
}
.empty-state .glyph{ font-size:34px; margin-bottom:14px; opacity:.5; }
.empty-state h3{ font-size:18px; color: var(--ink); margin-bottom:6px; }
.empty-state p{ font-size:14px; line-height:1.5; max-width:280px; margin:0 auto; }

/* ---------- Forms ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color: var(--ink-soft); margin-bottom:7px; letter-spacing:.01em; }
.field input[type=text], .field input[type=tel], .field input[type=email],
.field input[type=number], .field input[type=date], .field input[type=time], .field textarea{
  width:100%; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding: 15px 16px; font-size:16px; color: var(--ink); transition: border-color .15s, background .15s;
  -webkit-appearance:none;
}
.field select{
  width:100%; border:1px solid var(--line); background-color: var(--mist); border-radius: var(--r-sm);
  padding: 15px 40px 15px 16px; font-size:16px; color: var(--ink); transition: border-color .15s, background .15s;
  -webkit-appearance:none; appearance:none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a4a47' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center; background-size: 18px;
}
.field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color: var(--ink); background-color: var(--paper); }
.field textarea{ resize:vertical; min-height:76px; line-height:1.5; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.field .req-mark{ color: var(--danger); }
.field-note{ font-size:12px; color: var(--ink-faint); margin-top:6px; line-height:1.5; }

/* ---------- Shared Optional Detail control (one control, used everywhere) ---------- */
.optional-detail-wrap{ margin-top:14px; }
.optional-detail-label{ font-size:12px; font-weight:600; color: var(--ink-faint); margin-bottom:7px; letter-spacing:.01em; text-transform:uppercase; }
.optional-detail{
  width:100%; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);
  padding: 15px 16px; font-size:16px; color: var(--ink); line-height:1.4;
  resize:none; height:54px; overflow-y:auto; font-family:inherit; -webkit-appearance:none; display:block;
  transition: border-color .15s, background .15s;
}
.optional-detail:focus{ outline:none; border-color: var(--ink); background: var(--paper); }

.chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  padding: 11px 18px; border-radius: var(--r-pill); background: var(--mist); border:1px solid var(--line);
  font-size:14.5px; font-weight:600; color: var(--ink-soft);
  transition: all .15s var(--ease-spring); user-select:none;
}
.chip.selected{ background: var(--ink); color:#fff; border-color: var(--ink); transform: scale(1.03); }
.chip:active{ transform: scale(.94); }

.toggle-row{ display:flex; gap:8px; }
.toggle-row .chip{ flex:1; text-align:center; }

/* ---------- Buyer Preferences ---------- */
.pref-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.pref-card-head .glyph{ font-size:20px; line-height:1; }
.pref-card-head h4{ font-family:var(--serif); font-size:18px; font-weight:700; }
.pref-category{ margin-bottom:16px; }
.pref-category:last-child{ margin-bottom:0; }
.pref-category-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color: var(--ink-faint); font-weight:700; margin-bottom:8px; }

/* ---------- FAB ---------- */
.fab-anchor{
  position: fixed; inset:0; max-width:640px; margin:0 auto; pointer-events:none; z-index:40;
}
.fab{
  position: absolute; right: 22px; bottom: calc(26px + env(safe-area-inset-bottom));
  width:60px; height:60px; border-radius:50%; background: var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-3);
  border:none; transition: transform .18s var(--ease-spring); pointer-events:auto;
}
.fab:active{ transform: scale(.9); }
.fab svg{ width:24px; height:24px; }

/* ---------- Bottom sheet ---------- */
.sheet-backdrop{
  position: fixed; inset:0; background: rgba(15,14,12,.42); z-index:60; opacity:0;
  transition: opacity .28s var(--ease); backdrop-filter: blur(2px);
}
.sheet-backdrop.show{ opacity:1; }
.sheet{
  position: fixed; left:0; right:0; bottom:0; z-index:61; max-width:640px; margin:0 auto;
  background: var(--paper); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-3);
  max-height: 88vh; display:flex; flex-direction:column;
  transform: translateY(100%); transition: transform .38s var(--ease-spring);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.show{ transform: translateY(0); }
.sheet-handle{ width:38px; height:5px; border-radius:3px; background: var(--line); margin:12px auto 4px; flex:none; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding: 10px 22px 6px; flex:none; }
.sheet-head h3{ font-size:20px; font-weight:700; }
.sheet-close{ width:32px; height:32px; border-radius:50%; background: var(--mist); border:none; display:flex; align-items:center; justify-content:center; }
.sheet-body{ padding: 10px 22px 22px; overflow-y:auto; }
.sheet-footer{ padding: 12px 22px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft); flex:none; }

/* ---------- Toast ---------- */
.toast{
  position: fixed; left:50%; bottom: calc(30px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color:#fff; padding: 13px 22px; border-radius: var(--r-pill); font-size:14px; font-weight:600;
  box-shadow: var(--shadow-3); z-index: 90; opacity:0; transition: all .3s var(--ease-spring); pointer-events:none;
  white-space:nowrap;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

/* ---------- Autosave indicator ---------- */
.autosave-indicator{
  font-size:11.5px; font-weight:600; color: var(--ink-faint); opacity:0; transition: opacity .3s var(--ease);
  padding:8px; white-space:nowrap;
}
.autosave-indicator.show{ opacity:1; color:#3b6b4f; }

/* ---------- Wrap-up ---------- */
.hero-wrap{ text-align:center; padding: 26px 6px 8px; }
.hero-wrap .glyph-ring{
  width:64px; height:64px; border-radius:50%; margin:0 auto 18px; background: var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-2);
}
.hero-wrap h1{ font-size: 26px; margin-bottom:6px; }
.hero-wrap p{ color: var(--ink-soft); font-size:15px; }

.priority-card{
  background: linear-gradient(160deg,#1c1a16,#0d0c0b); color:#fff; border-radius: var(--r-lg);
  padding:22px; margin-top:18px; box-shadow: var(--shadow-2);
}
.priority-card .pc-tag{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:700; margin-bottom:8px; }
.priority-card h3{ color:#fff; font-size:20px; }
.priority-card p{ color:rgba(255,255,255,.7); font-size:13.5px; margin-top:6px; line-height:1.5; }

/* ---------- Snapshot ---------- */
.snap-block{ margin-bottom: 20px; }
.snap-block .sb-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color: var(--ink-faint); font-weight:700; margin-bottom:6px; }
.snap-block .sb-value{ font-size:15.5px; line-height:1.55; color: var(--ink); }
.snap-block .sb-value.empty{ color: var(--ink-faint); font-style:italic; }
.snap-header{ text-align:center; padding: 14px 0 6px; }
.snap-header .initial-ring{
  width:64px; height:64px; border-radius:50%; background: var(--mist-deep); margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center; font-family: var(--serif); font-size:24px; font-weight:700;
}
.snap-header h2{ font-size:24px; }
.snap-header .snap-sub{ color: var(--ink-soft); font-size:14px; margin-top:4px; }
.pill-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
.pill-static{ background: var(--mist); border:1px solid var(--line); border-radius: var(--r-pill); padding:7px 14px; font-size:12.5px; font-weight:600; color: var(--ink-soft); }
.pill-static.tappable{ cursor:pointer; }

/* ---------- Task list ---------- */
.task-row-wrap{ padding: 6px 0; border-bottom:1px solid var(--line-soft); }
.task-row-wrap:last-child{ border-bottom:none; }
.task-row{ display:flex; align-items:center; gap:12px; padding:6px 0; }
.task-check{
  width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line); flex:none;
  display:flex; align-items:center; justify-content:center; transition: all .15s var(--ease-spring);
}
.task-check.done{ background: var(--ink); border-color: var(--ink); }
.task-check svg{ width:14px; height:14px; color:#fff; opacity:0; transition:opacity .1s; }
.task-check.done svg{ opacity:1; }
.task-text{ flex:1; font-size:15px; }
.task-text.done{ color: var(--ink-faint); text-decoration: line-through; }
.task-del{ color: var(--ink-faint); font-size:18px; padding:4px 8px; }
.task-meta-row{ display:flex; gap:8px; padding-left:36px; margin-top:2px; }
.task-meta-btn{ font-size:11.5px; padding:5px 10px; }

/* ---------- Segmented filter ---------- */
.seg{ display:flex; background: var(--mist-deep); border-radius: var(--r-pill); padding:4px; gap:2px; }
.seg button{ flex:1; border:none; background:transparent; padding:9px 8px; border-radius: var(--r-pill); font-size:13.5px; font-weight:600; color: var(--ink-soft); transition: all .18s var(--ease); }
.seg button.active{ background:#fff; color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------- Welcome ---------- */
.welcome-hero{ padding: 8px 20px 0; }
.brand-mark{ text-align:center; padding: 30px 0 10px; }
.brand-mark .mark{ font-family: var(--serif); font-size:15px; letter-spacing:.14em; text-transform:uppercase; color: var(--ink-soft); font-weight:700; }
.brand-mark .markline{ width:34px; height:1px; background: var(--line); margin: 10px auto 0; }

hr.hair{ border:none; border-top:1px solid var(--line-soft); margin: 18px 0; }

.kicker-row{ display:flex; align-items:center; gap:8px; color: var(--ink-soft); font-size:13px; margin-bottom:4px; }

/* ---------- Passcode ---------- */
.passcode-row{ display:flex; justify-content:center; margin: 18px 0 6px; }
.passcode-input{
  width:170px; text-align:center; font-size:32px; letter-spacing:16px; font-weight:700;
  border:1px solid var(--line); background: var(--mist); border-radius:16px; padding:16px 16px 16px 30px;
  font-family: var(--serif); -webkit-appearance:none;
}
.passcode-input:focus{ outline:none; border-color: var(--ink); background: var(--paper); }
.passcode-error{ color: var(--danger); font-size:13px; text-align:center; margin-top:10px; min-height:16px; }
.passcode-hint{ font-size:13.5px; color: var(--ink-soft); line-height:1.6; margin-bottom:6px; }

/* ---------- Visitor Sign-In (kiosk) ---------- */
.signin-screen{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
.signin-screen .content{ flex:1; padding-bottom:12px; }
.signin-brandline{ display:flex; align-items:center; justify-content:center; gap:10px; padding-top:6px; }
.signin-brand-ring{
  width:28px; height:28px; border-radius:50%; background: var(--ink); color:#fff; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.signin-brand-ring svg{ width:13px; height:13px; }
.signin-intro{ text-align:center; margin-bottom:26px; }
.signin-intro h1{ font-size:22px; font-weight:700; white-space:nowrap; }
.signin-intro .signin-welcome{ color: var(--ink-soft); font-size:15px; margin-top:16px; line-height:1.6; white-space:nowrap; }
@media (max-width:480px){
  .signin-intro h1{ white-space:normal; }
  .signin-intro .signin-welcome{ white-space:normal; max-width:340px; margin-left:auto; margin-right:auto; }
}
.signin-form-card{ padding: 28px 24px 30px; }
.signin-form-card .eyebrow{ margin-top:22px; margin-bottom:12px; }
.signin-form-card .eyebrow:first-child{ margin-top:0; }
.signin-form-card .field{ margin-bottom:20px; }
.kiosk-home-btn{
  display:flex; align-items:center; justify-content:center; margin: 10px auto 28px;
  width:42px; height:42px; border-radius:50%; background: var(--mist-deep); border:1px solid var(--line);
  color: var(--ink-faint);
}
.kiosk-home-btn svg{ width:17px; height:17px; }
.signin-confirm-wrap{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px;

.autocomplete-item{ padding:12px 16px; font-size:14px; border-bottom:1px solid var(--line-soft); }
.autocomplete-item:last-child{ border-bottom:none; }
.autocomplete-item:active{ background: var(--mist); }
.autocomplete-item .ac-tag{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint); display:block; margin-top:2px; }

/* ---------- Contact card ---------- */
.contact-name-input{
  width:100%; text-align:center; border:none; background:transparent; font-family:var(--serif);
  font-size:21px; font-weight:700; color: var(--ink); padding:6px 4px;

.contact-name-input:focus{ outline:none; background: var(--mist); border-radius: var(--r-sm); }
.contact-sub-row{ display:flex; gap:8px; margin-top:4px; }
.contact-sub-input{
  flex:1; text-align:center; border:1px solid var(--line); background: var(--mist); border-radius: var(--r-sm);

}
.contact-sub-input:focus{ outline:none; border-color: var(--ink); background: var(--paper); color: var(--ink); }

.btn-followup-done{

}
.btn-followup-done svg{ width:16px; height:16px; }

.area-add-row input{

.logo-placeholder{ width:56px; height:56px; border-radius:50%; background: var(--mist-deep); display:flex; align-items:center; justify-content:center; color: var(--ink-faint); flex:none; }

.file-btn-wrap input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.optlist-caption{ font-size:12px; color: var(--ink-faint); margin-bottom:12px; line-height:1.5; }
.signin-brand-ring img, .welcome-logo img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }

.optrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft); }
.optrow:last-of-type{ border-bottom:none; }
.optrow-label{ font-size:14.5px; color:var(--ink); flex:1; }

.optrow-rename:focus{ outline:none; border-color:var(--ink); background:var(--paper); }
.optrow-actions{ display:flex; gap:4px; flex:none; }
.optrow-actions button{ background:var(--mist-deep); border:none; border-radius:8px; padding:6px 9px; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
.optrow-actions button:active{ background:var(--line); }
.archived-row{ opacity:.55; }
.settings-hub-card{ cursor:pointer; }
.settings-hub-card:active{ transform:scale(.98); }
.settings-hub-icon{ width:44px; height:44px; border-radius:12px; background:var(--mist-deep); display:flex; align-items:center; justify-content:center; flex:none; color: var(--ink-soft); }
.settings-hub-title{ font-size:15.5px; font-weight:600; color: var(--ink); }
.settings-hub-sub{ font-size:12.5px; color: var(--ink-faint); margin-top:2px; line-height:1.4; }
.settings-hub-chev{ color: var(--ink-faint); flex:none; }
.content-search-wrap{ margin-bottom:18px; }
.content-search-wrap input{ width:100%; border:1px solid var(--line); background:var(--mist); border-radius: var(--r-sm); padding:13px 16px; font-size:15px; -webkit-appearance:none; }
.content-search-wrap input:focus{ outline:none; border-color:var(--ink); background:var(--paper); }

.sync-banner{ position:fixed; top:0; left:0; right:0; z-index:9999; text-align:center; font-size:12.5px; font-weight:600; padding:7px 10px; color:#fff; background:#b23b3b; }
.sync-banner.connecting{ background:#8a7a3b; }
.sync-status-pill{ display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em; }

/* ---- content configuration: deep-merge saved overrides onto current defaults so any
   new keys introduced in a future release are always present, while preserving every
   edit an admin has already made ---- */
function deepMergeDefaults(target, defaults){
  if(typeof defaults !== "object" || defaults===null){
    return target!==undefined ? target : defaults;
  }
  if(Array.isArray(defaults)){
    /* deep-clone (not reference-share) so admin edits never mutate CONTENT_DEFAULTS itself —
       that shared object is also what "Reset to Default" reads from. */
    return target!==undefined ? target : JSON.parse(JSON.stringify(defaults));
  }
  target = (target && typeof target==="object" && !Array.isArray(target)) ? target : {};
  Object.keys(defaults).forEach(function(k){ target[k] = deepMergeDefaults(target[k], defaults[k]); });
  return target;
}

  VISIT_PURPOSES.length = 0; (ol.visitPurposes||[]).filter(function(o){ return o.active!==false; }).forEach(function(o){ VISIT_PURPOSES.push([o.key, o.label]); });

    case "petOptions": return state.visitors.some(function(v){ return (v.detail.pets.selected||[]).indexOf(value)>-1; });
    case "dealBreakerOptions": return state.visitors.some(function(v){ return (v.detail.dealBreakers.selected||[]).indexOf(value)>-1; });
    case "financingTypes": return state.visitors.some(function(v){ return v.detail.financing.type===value; });
    case "preApprovalStatuses": return state.visitors.some(function(v){ return v.detail.financing.preApproval===value; });

  if(list.some(function(x){ return normOptVal(x)===normOptVal(value); })) return false;
  if(arch.some(function(x){ return normOptVal(x)===normOptVal(value); })) return false;

/* ---- migrate a single visitor.detail object to the current (v3) shape ---- */
function migrateVisitorDetail(old){
  old = old || {};
  var isV3 = old.mustHaves && typeof old.mustHaves === "object" && old.niceToHaves && typeof old.niceToHaves === "object" && old.motivation && Array.isArray(old.motivation.selected);
  if(isV3){
    old.mustHaves.selected = old.mustHaves.selected || [];
    old.mustHaves.note = old.mustHaves.note || "";
    old.niceToHaves.selected = old.niceToHaves.selected || [];
    old.niceToHaves.note = old.niceToHaves.note || "";
    old.motivation.note = old.motivation.note || "";
    old.financing = old.financing || { type:"", preApproval:"", lenderNotes:"" };
    old.financing.lenderNotes = old.financing.lenderNotes || "";
    old.family = old.family || { householdSize:"", children:"Not Discussed", note:"" };
    old.family.children = old.family.children || "Not Discussed";
    old.pets = old.pets || { selected:[], note:"" };
    old.dealBreakers = old.dealBreakers || { selected:[], note:"" };
    old.followUp = old.followUp || { promise:"", nextAction:"", date:"", assignedTo:"", status:"Not Started" };
    old.followUp.status = old.followUp.status || "Not Started";
    old.preferredAreas = old.preferredAreas || [];
    old.connectionSummary = old.connectionSummary || "";
    old.tasks = (old.tasks||[]).map(function(t){ return { id:t.id||uid(), text:t.text||"", done:!!t.done, dueDate:t.dueDate||"", assignedTo:t.assignedTo||"" }; });
    old.notesComplete = !!old.notesComplete;
    return old;
  }

  /* ---- coming from Sprint 2.2 (v2) or earlier shapes ---- */
  var motivationSelected = [];
  var motivationNote = "";
  if(old.motivation && typeof old.motivation === "object"){
    if(Array.isArray(old.motivation.selected)) motivationSelected = old.motivation.selected;
    else if(old.motivation.selected) motivationSelected = [old.motivation.selected];
    motivationNote = old.motivation.note || "";
  }else if(typeof old.motivation === "string" && old.motivation){
    motivationNote = old.motivation;
  }

  var mustHaves = { selected: [], note: "" };
  var niceToHaves = { selected: [], note: "" };
  var legacyExtras = [];
  if(old.preferences && typeof old.preferences === "object"){
    LEGACY_V2_PREFERENCE_LIBRARY.forEach(function(p){
      var v = old.preferences[p];
      if(!v) return;
      var stillExists = ALL_PREF_OPTIONS.indexOf(p) > -1;
      if(v === "must"){ if(stillExists) mustHaves.selected.push(p); else legacyExtras.push("Must-Have (legacy): "+p); }
      else if(v === "nice"){ if(stillExists) niceToHaves.selected.push(p); else legacyExtras.push("Nice-to-Have (legacy): "+p); }
    });
  }
  if(typeof old.mustHaves === "string" && old.mustHaves) mustHaves.note = old.mustHaves;
  if(typeof old.niceToHaves === "string" && old.niceToHaves) niceToHaves.note = old.niceToHaves;
  if(legacyExtras.length){ mustHaves.note = (mustHaves.note ? mustHaves.note+"\n" : "") + legacyExtras.filter(function(s){return s.indexOf("Must-Have")===0;}).join("\n"); }

  var financing = { type:"", preApproval:"", lenderNotes:"" };
  if(old.financing && typeof old.financing === "object"){ financing.type = old.financing.type||""; financing.preApproval = old.financing.preApproval||""; }
  else if(typeof old.financing === "string" && old.financing){ legacyExtras.push("Financing (legacy): "+old.financing); }

  var family = { householdSize:"", children:"Not Discussed", note:"" };
  if(old.family && typeof old.family === "object"){ family.householdSize = old.family.householdSize||""; family.children = old.family.children||"Not Discussed"; family.note = old.family.note||""; }
  else if(typeof old.family === "string" && old.family){ family.note = old.family; }

  var pets = { selected: [], note: "" };
  if(old.pets && typeof old.pets === "object"){ pets.selected = old.pets.selected||[]; pets.note = old.pets.note||""; }
  else if(typeof old.pets === "string" && old.pets){ pets.note = old.pets; }

  var dealBreakers = { selected: [], note: "" };
  if(old.dealBreakers && typeof old.dealBreakers === "object"){ dealBreakers.selected = old.dealBreakers.selected||[]; dealBreakers.note = old.dealBreakers.note||""; }
  else if(typeof old.dealBreakers === "string" && old.dealBreakers){ dealBreakers.note = old.dealBreakers; }

  var followUp = { promise:"", nextAction:"", date:"", assignedTo:"", status:"Not Started" };
  if(old.followUp && typeof old.followUp === "object"){
    followUp.promise = old.followUp.promise || "";
    followUp.nextAction = old.followUp.nextAction || "";
    followUp.date = old.followUp.date || "";
    followUp.assignedTo = old.followUp.assignedTo || "";
    followUp.status = old.followUp.status || "Not Started";
  }else{
    followUp.promise = old.followUpPromise || "";
    followUp.status = old.followUpDone ? "Completed" : "Not Started";
  }

  if(singleStoryLegacy(old)) legacyExtras.push("Single story preference (legacy): "+singleStoryLegacy(old));

  var connectionSummary = old.connectionSummary || "";
  var otherLegacy = legacyExtras.filter(function(s){ return s.indexOf("Must-Have")!==0; });
  if(otherLegacy.length) connectionSummary = (connectionSummary ? connectionSummary+"\n\n" : "") + otherLegacy.join("\n");

  return {
    motivation: { selected: motivationSelected, note: motivationNote },
    mustHaves: mustHaves,
    niceToHaves: niceToHaves,
    financing: financing,
    family: family,
    pets: pets,
    dealBreakers: dealBreakers,
    followUp: followUp,
    preferredAreas: old.preferredAreas || [],
    connectionSummary: connectionSummary,
    tasks: (old.tasks||[]).map(function(t){ return { id:t.id||uid(), text:t.text||"", done:!!t.done, dueDate:t.dueDate||"", assignedTo:t.assignedTo||"" }; }),
    notesComplete: !!old.notesComplete
  };
}

function formatPhoneDisplay(raw){

  if(digits.length===10) return "("+digits.slice(0,3)+") "+digits.slice(3,6)+"-"+digits.slice(6);
  return String(raw);
}

}

function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

function getPath(obj, path){
  var parts = path.split("."); var o = obj;
  for(var i=0;i<parts.length;i++){ if(o==null) return undefined; o = o[parts[i]]; }
  return o;
}
function setPath(obj, path, val){
  var parts = path.split("."); var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}

function formatDateLong(iso){
  if(!iso) return "";
  var parts = iso.split("-"); var d = new Date(parts[0], parts[1]-1, parts[2]);
  if(cfg("formats.dateFormat")==="numeric") return pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear();
  return d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
}
function formatDateShort(iso){
  if(!iso) return "";
  var parts = iso.split("-"); var d = new Date(parts[0], parts[1]-1, parts[2]);
  if(cfg("formats.dateFormat")==="numeric") return pad(d.getMonth()+1)+"/"+pad(d.getDate());
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}
function formatTime(t){
  if(!t) return "";
  var bits = t.split(":"); var h = parseInt(bits[0],10); var m = bits[1];
  if(cfg("formats.timeFormat")==="24h") return pad(h)+":"+m;
  var ap = h>=12 ? "PM" : "AM"; var h12 = h%12; if(h12===0) h12=12;
  return h12 + ":" + m + " " + ap;
}
function timeRange(oh){ return formatTime(oh.startTime) + " – " + formatTime(oh.endTime); }
function propertyTitle(oh){ return oh.address || "Untitled Property"; }
function propertyCityLine(oh){
  var bits = [];
  if(oh.city) bits.push(oh.city);
  if(oh.stateAbbr) bits.push(oh.stateAbbr);
  if(oh.zip) bits.push(oh.zip);
  return bits.join(", ").replace(", "+oh.stateAbbr+", ", ", "+oh.stateAbbr+" ");
}
function propertyOneLine(oh){
  var bits = [propertyTitle(oh)];
  var cityLine = propertyCityLine(oh);
  if(cityLine) bits.push(cityLine);
  return bits.join(", ");
}
function fmtPrice(p){
  if(p==null || p==="") return "";
  var n = parseFloat(String(p).replace(/[^0-9.]/g,""));
  if(isNaN(n)) return p;
  return (cfg("formats.currencySymbol")==="off" ? "" : "$")+n.toLocaleString("en-US");
}
function bindCurrencyInput(inputEl, initialValue){
  if(initialValue !== "" && initialValue != null){ inputEl.value = fmtPrice(initialValue); }
  inputEl.addEventListener("input", function(){
    var digits = inputEl.value.replace(/[^0-9]/g,"");
    if(!digits){ inputEl.value=""; return; }
    inputEl.value = (cfg("formats.currencySymbol")==="off" ? "" : "$")+parseInt(digits,10).toLocaleString("en-US");
  });
}
function currencyValue(inputEl){
  var digits = inputEl.value.replace(/[^0-9]/g,"");
  return digits ? parseInt(digits,10) : "";
}
function formatPhoneProgressive(digits){
  digits = digits.slice(0,10);
  var len = digits.length;
  if(len===0) return "";
  if(cfg("formats.phoneStyle")==="dashes"){
    if(len<4) return digits;
    if(len<7) return digits.slice(0,3)+"-"+digits.slice(3);
    return digits.slice(0,3)+"-"+digits.slice(3,6)+"-"+digits.slice(6);
  }
  if(len<4) return "("+digits;
  if(len<7) return "("+digits.slice(0,3)+") "+digits.slice(3);
  return "("+digits.slice(0,3)+") "+digits.slice(3,6)+"-"+digits.slice(6);
}
function bindPhoneInput(inputEl, onChange){
  inputEl.addEventListener("input", function(){
    var digits = inputEl.value.replace(/[^0-9]/g,"");
    inputEl.value = formatPhoneProgressive(digits);
    if(onChange) onChange(inputEl.value);

}

/* ---- status + priority logic ---- */
function visitorsFor(openHouseId){
  return state.visitors.filter(function(v){ return v.openHouseId === openHouseId; });
}
function hasFollowUpCommitment(d){
  return !!((d.followUp.promise && d.followUp.promise.trim()) || d.followUp.nextAction);
}
function visitorStatus(v){
  var d = v.detail;
  var needsFollowUp = hasFollowUpCommitment(d) && d.followUp.status !== "Completed";
  var needsCapture = v.capturedLater && !d.notesComplete;
  if(needsFollowUp) return "follow-up";
  if(needsCapture) return "capture";
  return "complete";
}
function isMeaningfulOpportunity(v){
  return v.representationStatus === "unrepresented" || v.buyingTimeline === "0-3" || v.buyingTimeline === "3-6";
}
function priorityScore(v){
  var d = v.detail;
  var s = 0;
  var st = visitorStatus(v);
  if(st==="follow-up") s += 30;
  if(st==="capture") s += 10;
  if(v.representationStatus==="unrepresented") s += 8;
  if(v.buyingTimeline==="0-3") s += 8;
  else if(v.buyingTimeline==="3-6") s += 5;
  else if(v.buyingTimeline==="6-12") s += 2;
  if(d.connectionSummary && d.connectionSummary.trim()) s += 2;
  return s;
}
function sortedQueue(list){
  var order = { "follow-up":0, "capture":1, "complete":2 };
  return list.slice().sort(function(a,b){
    var oa = order[visitorStatus(a)], ob = order[visitorStatus(b)];
    if(oa !== ob) return oa - ob;
    return priorityScore(b) - priorityScore(a) || (b.createdAt - a.createdAt);
  });
}
function highestPriorityConnection(list){
  if(!list.length) return null;
  var sorted = list.slice().sort(function(a,b){ return priorityScore(b)-priorityScore(a) || (b.createdAt-a.createdAt); });
  return sorted[0];
}

/* ---- own-history address suggestions (works fully offline) ---- */
function ownHistorySuggestions(query){
  var q = query.trim().toLowerCase();
  if(q.length<2) return [];
  var seen = {};
  var results = [];
  state.openHouses.slice().sort(function(a,b){ return b.createdAt-a.createdAt; }).forEach(function(oh){
    var addr = (oh.address||"").toLowerCase();
    if(addr && addr.indexOf(q)>-1 && !seen[oh.address]){
      seen[oh.address] = true;
      results.push(oh);
    }
  });
  return results.slice(0,5);
}

/* ---- preferred-area suggestions: seed list + every area any visitor has used, offline ---- */
function preferredAreaSuggestions(query){
  var q = (query||"").trim().toLowerCase();
  var seen = {}; var results = [];
  var all = PREFERRED_AREA_SEED.slice();
  state.visitors.forEach(function(v){ (v.detail.preferredAreas||[]).forEach(function(a){ all.push(a); }); });
  all.forEach(function(a){
    var key = a.toLowerCase();
    if(seen[key]) return;
    if(q && key.indexOf(q)===-1) return;
    seen[key] = true; results.push(a);
  });
  return results.slice(0,6);
}

function attachAddressAutocomplete(sheet, prefix){
  var input = sheet.querySelector("#"+prefix+"-address");
  var wrap = input.closest(".autocomplete-wrap");
  var fieldRefs = {
    city: sheet.querySelector("#"+prefix+"-city"),
    state: sheet.querySelector("#"+prefix+"-state"),
    zip: sheet.querySelector("#"+prefix+"-zip"),
    beds: sheet.querySelector("#"+prefix+"-beds"),
    baths: sheet.querySelector("#"+prefix+"-baths"),
    sqft: sheet.querySelector("#"+prefix+"-sqft"),
    price: sheet.querySelector("#"+prefix+"-price")
  };
  var listEl = null;
  var debounceTimer = null;

  function closeList(){ if(listEl){ listEl.remove(); listEl = null; } }
  function renderList(items){
    closeList();
    if(!items || !items.length) return;
    listEl = document.createElement("div");
    listEl.className = "autocomplete-list";
    listEl.innerHTML = items.map(function(it,i){
      return '<div class="autocomplete-item" data-ac-idx="'+i+'">'+esc(it.label)+'<span class="ac-tag">'+esc(it.tag)+'</span></div>';
    }).join("");
    wrap.appendChild(listEl);
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-ac-idx]"), function(el){
      el.addEventListener("mousedown", function(e){ e.preventDefault(); });
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-ac-idx"),10);
        applySuggestion(items[idx]);
        closeList();
      });
    });
  }
  function applySuggestion(item){
    input.value = item.address || input.value;
    if(item.city!=null) fieldRefs.city.value = item.city;
    if(item.state!=null) fieldRefs.state.value = item.state;
    if(item.zip!=null) fieldRefs.zip.value = item.zip;
    if(item.beds!=null && !fieldRefs.beds.value) fieldRefs.beds.value = item.beds;
    if(item.baths!=null && !fieldRefs.baths.value) fieldRefs.baths.value = item.baths;
    if(item.sqft!=null && !fieldRefs.sqft.value) fieldRefs.sqft.value = item.sqft;
    if(item.price!=null && item.price!=="" && !fieldRefs.price.value){ fieldRefs.price.value = fmtPrice(item.price); }
  }
  input.addEventListener("input", function(){
    clearTimeout(debounceTimer);
    var q = input.value;
    if(q.trim().length<3){ closeList(); return; }
    debounceTimer = setTimeout(function(){
      var historyItems = ownHistorySuggestions(q).map(function(oh){
        return { label: oh.address, tag:"Previously hosted", address: oh.address, city: oh.city, state: oh.stateAbbr, zip: oh.zip, beds: oh.beds, baths: oh.baths, sqft: oh.sqft, price: oh.price };
      });
      renderList(historyItems);
      if(typeof fetch === "function"){
        var controller = (typeof AbortController === "function") ? new AbortController() : null;
        var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, 3000) : null;
        fetch("https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=us&limit=5&q="+encodeURIComponent(q), controller ? {signal:controller.signal} : {})
          .then(function(res){ return res.json(); })
          .then(function(data){
            if(timeoutId) clearTimeout(timeoutId);
            var liveItems = (data||[]).map(function(r){
              var a = r.address || {};
              var street = [a.house_number,a.road].filter(Boolean).join(" ");
              return { label: r.display_name, tag:"Address lookup", address: street||r.display_name, city: a.city||a.town||a.village||"", state: stateAbbrFromName(a.state||""), zip: a.postcode||"" };
            });
            renderList(historyItems.concat(liveItems).slice(0,8));
          })
          .catch(function(){ /* offline or blocked — history suggestions remain visible */ });
      }
    }, 350);
  });
  input.addEventListener("blur", function(){ setTimeout(closeList, 200); });
}

/* Gates any admin-only destination behind the 4-digit passcode. This is a light privacy
   screen for a public kiosk hand-off, not enterprise-grade authentication — every
   passcode prompt in this app says so plainly. */
function sheetPasscodeGate(onSuccess){
  onSuccess = onSuccess || function(){ nav("workspace"); };
  var pc = cfg("pages.passcode");
  var hasCode = !!(state.settings.adminPasscode && state.settings.adminPasscode.length===4);
  if(!hasCode){
    var body1 = '<div class="sheet-head"><h3>'+esc(pc.gateTitle)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
      '<div class="sheet-body"><p class="passcode-hint">'+esc(pc.gateHint)+'</p></div>' +
      '<div class="sheet-footer"><button class="btn btn-primary" id="pg-continue">'+esc(pc.continueButton)+'</button></div>';
    openSheet(body1, function(sheet, close){
      sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
      sheet.querySelector("#pg-continue").addEventListener("click", function(){ close(); onSuccess(); });
    });
    return;
  }
  var body2 = '<div class="sheet-head"><h3>'+esc(pc.unlockTitle)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body">' +
      '<div class="passcode-row"><input type="tel" inputmode="numeric" maxlength="4" id="pg-code" class="passcode-input" placeholder="••••"></div>' +
      '<div class="passcode-error" id="pg-error"></div>' +
    '</div>' +
    '<div class="sheet-footer"><button class="btn btn-primary" id="pg-unlock">'+esc(pc.unlockButton)+'</button></div>';
  openSheet(body2, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    var codeInput = sheet.querySelector("#pg-code");
    codeInput.focus();
    function tryUnlock(){
      var val = codeInput.value.trim();
      if(val === state.settings.adminPasscode){ close(); onSuccess(); }
      else{ sheet.querySelector("#pg-error").textContent = pc.incorrectMessage; codeInput.value=""; codeInput.focus(); }
    }
    sheet.querySelector("#pg-unlock").addEventListener("click", tryUnlock);
    codeInput.addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });
  });
}

function sheetSetPasscode(){
  var pc = cfg("pages.passcode");
  var body = '<div class="sheet-head"><h3>'+esc(pc.setTitle)+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body">' +
      '<p class="passcode-hint">'+esc(pc.setHint)+'</p>' +
      '<div class="passcode-row"><input type="tel" inputmode="numeric" maxlength="4" id="sp-code" class="passcode-input" placeholder="••••" value="'+esc(state.settings.adminPasscode||"")+'"></div>' +
    '</div>' +
    '<div class="sheet-footer"><button class="btn btn-primary" id="sp-save">'+esc(pc.saveButton)+'</button></div>';
  openSheet(body, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    sheet.querySelector("#sp-save").addEventListener("click", function(){
      var val = sheet.querySelector("#sp-code").value.trim();
      if(!/^\d{4}$/.test(val)){ sheet.querySelector("#sp-code").focus(); return; }
      state.settings.adminPasscode = val;
      saveState();

}

function mountSignIn(){
  var oh = activeOpenHouse();
  if(!oh) return;
  var picked = { representationStatus:"", visitPurpose:"" };

  var repGroup = document.querySelector("#s-rep");
  var purposeGroup = document.querySelector("#s-purpose");
  var phoneInput = document.querySelector("#s-phone");
  if(phoneInput){ bindPhoneInput(phoneInput); }

  function wire(group, key){
    if(!group) return;
    group.addEventListener("click", function(e){
      var btn = e.target.closest(".chip"); if(!btn) return;
      var val = btn.getAttribute("data-val");
      var same = picked[key] === val;
      Array.prototype.forEach.call(group.querySelectorAll(".chip"), function(c){ c.classList.remove("selected"); });
      if(same){ picked[key] = ""; } else { picked[key] = val; btn.classList.add("selected"); }
    });
  }
  wire(repGroup, "representationStatus");
  wire(purposeGroup, "visitPurpose");

  var submitBtn = document.querySelector("#s-submit");
  if(submitBtn){
    submitBtn.addEventListener("click", function(){
      var nameEl = document.querySelector("#s-name");
      var phoneEl = document.querySelector("#s-phone");
      var emailEl = document.querySelector("#s-email");
      var name = nameEl ? nameEl.value.trim() : "";
      var phone = phoneEl ? phoneEl.value.trim() : "";
      var email = emailEl ? emailEl.value.trim() : "";
      if(fieldCfg("signin","name").required!==false && nameEl && !name){ nameEl.focus(); return; }
      if(fieldCfg("signin","phone").required && phoneEl && !phone){ phoneEl.focus(); return; }
      var otherEl = document.querySelector("#s-purpose-other");
      var v = newVisitor(oh.id, {
        name: name, phone: phone, email: email,
        representationStatus: picked.representationStatus,
        visitPurpose: picked.visitPurpose,
        visitPurposeOther: otherEl ? otherEl.value.trim() : "",
        source: "selfSignIn"
      }, true);
      state.visitors.push(v);
      saveState();
      nav("signin", { phase:"confirm" });
      setTimeout(function(){ nav("signin", { phase:"form" }); }, 2800);
    });
  }
}

        REP_STATUSES.map(function(t){ return '<button type="button" class="chip" data-val="'+t[0]+'">'+esc(t[1])+'</button>'; }).join("") +
      '</div></div>'
  };

  var body =
    '<div class="sheet-head"><h3>'+esc(cfg("quickCapture.title"))+'</h3><button class="sheet-close" data-sheet-close>'+ICONS.close+'</button></div>' +
    '<div class="sheet-body">' + assembleSections("quickCapture", qBlocks) + '</div>' +
    '<div class="sheet-footer">' +
      '<div class="btn-row">' +
        '<button class="btn btn-secondary" id="q-later">'+esc(cfg("quickCapture.captureLaterButton"))+'</button>' +
        '<button class="btn btn-primary" id="q-save">'+esc(cfg("quickCapture.saveButton"))+'</button>' +
      '</div>' +
    '</div>';

  openSheet(body, function(sheet, close){
    sheet.querySelector("[data-sheet-close]").addEventListener("click", close);
    var qPhoneEl = sheet.querySelector("#q-phone");
    if(qPhoneEl){ bindPhoneInput(qPhoneEl); }

    function wireChips(containerId, key){
      var group = sheet.querySelector(containerId);
      if(!group) return;
      group.addEventListener("click", function(e){
        var btn = e.target.closest(".chip"); if(!btn) return;
        var isSame = picked[key] === btn.getAttribute("data-val");
        Array.prototype.forEach.call(group.querySelectorAll(".chip"), function(c){ c.classList.remove("selected"); });
        if(isSame){ picked[key] = ""; } else { picked[key] = btn.getAttribute("data-val"); btn.classList.add("selected"); }
      });
    }
    wireChips("#q-reason","reasonForVisit");
    wireChips("#q-timeline","buyingTimeline");
    wireChips("#q-rep","representationStatus");

    function val(sel){ var el = sheet.querySelector(sel); return el ? el.value.trim() : ""; }
    function gather(){
      return {
        name: val("#q-name"),
        phone: val("#q-phone"),
        email: val("#q-email"),
        storyNote: val("#q-storynote"),
        reasonForVisit: picked.reasonForVisit,
        buyingTimeline: picked.buyingTimeline,
        representationStatus: picked.representationStatus,
        source: "agent"
      };
    }
    function saveVisitor(capturedLater){
      var data = gather();
      var nameEl = sheet.querySelector("#q-name");
      if(fieldCfg("quickCapture","name").required!==false && nameEl && !data.name){ nameEl.focus(); return; }
      var v = newVisitor(oh.id, data, capturedLater);
      state.visitors.push(v);
      saveState();
      close();
      toast(capturedLater ? "Saved — capture more later" : "Visitor saved");
      render();
    }
    sheet.querySelector("#q-save").addEventListener("click", function(){ saveVisitor(false); });
    sheet.querySelector("#q-later").addEventListener("click", function(){ saveVisitor(true); });
  });
}

  if(!iso) return "";
  var parts = iso.split("-"); var d = new Date(parts[0], parts[1]-1, parts[2]);
  if(cfg("formats.dateFormat")==="numeric") return pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear();
  return d.toLocaleDateString("en-US", { month:"long", day:"numeric" });
}

function buildSnapshotPlainText(v){
  var d = v.detail;
  var lines = ["CLIENT SNAPSHOT — Villa Casa Home Group", ""];
  var identity = [v.name, v.phone, v.email].filter(Boolean).join(" · ");
  if(identity) lines.push(identity);
  var badges = [v.contactType?contactTypeLabel(v.contactType):"", v.representationStatus?repLabel(v.representationStatus):"", (v.buyingTimeline&&v.buyingTimeline!=="unknown")?timelineLabel(v.buyingTimeline):""].filter(Boolean);
  if(badges.length) lines.push(badges.join(" · "));
  lines.push("");

  var whyVisited = [v.reasonForVisit, visitPurposeLabel(v.visitPurpose), v.visitPurposeOther].filter(Boolean).join(" / ");
  if(whyVisited || v.storyNote){
    lines.push("VISIT");
    if(whyVisited) lines.push(whyVisited);
    if(v.storyNote) lines.push(v.storyNote);
    lines.push("");
  }
  if(motivationSummaryText(d)){ lines.push("MOTIVATION"); lines.push(motivationSummaryText(d)); lines.push(""); }
  var prefsText = [];
  if(d.mustHaves.selected.length || d.mustHaves.note) prefsText.push("Must-Haves: "+prefCardSummaryText(d.mustHaves));
  if(d.niceToHaves.selected.length || d.niceToHaves.note) prefsText.push("Nice-to-Haves: "+prefCardSummaryText(d.niceToHaves));
  if(prefsText.length){ lines.push("BUYER PREFERENCES"); lines = lines.concat(prefsText); lines.push(""); }
  if(d.preferredAreas && d.preferredAreas.length){ lines.push("PREFERRED AREAS"); lines.push(d.preferredAreas.join(", ")); lines.push(""); }
  if(financingSummaryText(d)){ lines.push("FINANCING"); lines.push(financingSummaryText(d)); lines.push(""); }
  if(familySummaryText(d)){ lines.push("FAMILY"); lines.push(familySummaryText(d)); lines.push(""); }
  if(petsSummaryText(d)){ lines.push("PETS"); lines.push(petsSummaryText(d)); lines.push(""); }
  if(dealBreakersSummaryText(d)){ lines.push("DEAL BREAKERS"); lines.push(dealBreakersSummaryText(d)); lines.push(""); }
  if(followUpSummaryText(d)){ lines.push("FOLLOW-UP"); lines.push(followUpSummaryText(d)); lines.push(""); }
  if(d.connectionSummary){ lines.push("CONNECTION SUMMARY"); lines.push(d.connectionSummary); lines.push(""); }
  return lines.join("\n").trim()+"\n";
}

    financing: snapCard("Financing", financingInner),

/* ============================================================
   DATA SYNC — optional Firebase-backed real-time sync so the same
   open house data appears on every paired device. Off by default;
   only active once an admin pastes in Firebase config or a sync code.
   The Firebase SDK itself is only fetched from CDN when sync is
   actually configured, so the app has zero external dependencies
   in its default (no-sync) state.
   ============================================================ */
var FIREBASE_SDK_VERSION = "10.14.1";
function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    var existing = document.querySelector('script[data-src="'+src+'"]');
    if(existing){ resolve(); return; }
    var s = document.createElement("script");
    s.src = src; s.setAttribute("data-src", src);
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error("Failed to load "+src)); };
    document.head.appendChild(s);
  });
}
function loadFirebaseSDK(){
  if(window.firebase && window.firebase.apps){ return Promise.resolve(); }
  var base = "https://www.gstatic.com/firebasejs/"+FIREBASE_SDK_VERSION+"/";
  return loadScriptOnce(base+"firebase-app-compat.js")
    .then(function(){ return loadScriptOnce(base+"firebase-auth-compat.js"); })
    .then(function(){ return loadScriptOnce(base+"firebase-database-compat.js"); });
}
function encodeSyncCode(c){
  var payload = { apiKey:c.apiKey, authDomain:c.authDomain, databaseURL:c.databaseURL, projectId:c.projectId, appId:c.appId, roomId:c.roomId };
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }catch(e){ return ""; }
}
function decodeSyncCode(code){
  try{
    var json = decodeURIComponent(escape(atob(String(code||"").trim())));
    var obj = JSON.parse(json);
    if(!obj || !obj.apiKey || !obj.databaseURL || !obj.roomId) return null;
    return obj;
  }catch(e){ return null; }
}
function syncPayload(){
  return {
    openHouses: state.openHouses,
    visitors: state.visitors,
    activeOpenHouseId: state.activeOpenHouseId,
    content: state.content,
    updatedAt: Date.now()
  };
}
function updateSyncIndicator(){
  var existing = document.getElementById("sync-banner");
  var s = state.sync || {};
  if(!s.enabled || Sync.status==="connected" || Sync.status==="off"){
    if(existing) existing.remove();
    return;
  }
  if(!existing){
    existing = document.createElement("div");
    existing.id = "sync-banner";
    document.body.insertBefore(existing, document.body.firstChild);
  }
  existing.className = "sync-banner" + (Sync.status==="connecting" ? " connecting" : "");
  existing.textContent = Sync.status==="connecting" ? "Connecting to sync…" : "Sync connection error — saving on this device only";
}
var Sync = {
  db: null,
  ref: null,
  suppressPush: false,
  pushTimer: null,
  status: "off", /* off | connecting | connected | error */
  setStatus: function(s){
    this.status = s;
    updateSyncIndicator();
    /* the status pill lives inside the Settings screen markup, so only a re-render
       of that screen (not a global one) picks up an async connect/disconnect/error
       transition; leave every other screen untouched so we never yank focus away
       from whatever an agent is mid-typing elsewhere in the app. */
    if(typeof route !== "undefined" && route && route.name === "settings"){
      appEl.removeEventListener("click", globalClickHandler);
      render();
    }
  },
  init: function(){
    var c = state.sync;
    if(!c || !c.enabled || !c.apiKey || !c.databaseURL || !c.roomId){ this.setStatus("off"); return; }
    this.setStatus("connecting");
    loadFirebaseSDK().then(function(){
      try{
        if(!window.firebase.apps.length){
          window.firebase.initializeApp({
            apiKey: c.apiKey, authDomain: c.authDomain, databaseURL: c.databaseURL,
            projectId: c.projectId, appId: c.appId
          });
        }
        window.firebase.auth().signInAnonymously().then(function(){
          Sync.db = window.firebase.database();
          Sync.ref = Sync.db.ref("rooms/" + c.roomId + "/data");
          /* Check what's already in the room before this device writes anything —
             otherwise a second device pairing in could blindly overwrite the first
             device's data with its own (empty) local state before ever reading it. */
          Sync.ref.once("value").then(function(snap){
            var remote = snap.val();
            Sync.ref.on("value", function(snap2){
              var r = snap2.val();
              if(!r || Sync.suppressPush) return;
              Sync.applyRemote(r);
            });
            Sync.setStatus("connected");
            if(remote){ Sync.applyRemote(remote); }
            else{ Sync.push(); }
          }).catch(function(err){ Sync.setStatus("error"); if(window.console) console.error("Firebase read error", err); });
        }).catch(function(err){ Sync.setStatus("error"); if(window.console) console.error("Firebase auth error", err); });
      }catch(e){ Sync.setStatus("error"); if(window.console) console.error("Firebase init error", e); }
    }).catch(function(err){ Sync.setStatus("error"); if(window.console) console.error("Firebase SDK load error", err); });
  },
  applyRemote: function(remote){
    var localUpdatedAt = state._lastSyncedAt || 0;
    if(!remote.updatedAt || remote.updatedAt <= localUpdatedAt) return;
    state.openHouses = remote.openHouses || [];
    state.visitors = remote.visitors || [];
    state.activeOpenHouseId = remote.activeOpenHouseId || null;
    state.content = deepMergeDefaults(remote.content || {}, CONTENT_DEFAULTS);
    syncOptionListsFromContent();
    state._lastSyncedAt = remote.updatedAt;
    this.suppressPush = true;
    saveState();
    this.suppressPush = false;
    appEl.removeEventListener("click", globalClickHandler);
    render();
  },
  push: function(){
    if(this.status!=="connected" || !this.ref || this.suppressPush) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(function(){
      var payload = syncPayload();
      state._lastSyncedAt = payload.updatedAt;
      Sync.ref.set(payload).catch(function(err){ if(window.console) console.error("Firebase push error", err); });
    }, 600);
  },
  disconnect: function(){
    if(this.ref){ try{ this.ref.off(); }catch(e){} }
    this.db = null; this.ref = null;
    this.setStatus("off");
  }
};

function contentToggleRow(path, options){

    return '<button type="button" class="chip'+(cur===o[0]?" selected":"")+'" data-content-single="'+esc(path)+'" data-val="'+esc(o[0])+'">'+esc(o[1])+'</button>';

}
function bindContentInputs(container){
  Array.prototype.forEach.call(container.querySelectorAll("[data-content]"), function(el){
    var key = el.getAttribute("data-content");
    var evt = (el.tagName==="TEXTAREA" || el.tagName==="INPUT") ? "input" : "change";
    el.addEventListener(evt, function(){
      setPath(state.content, key, el.value);
      saveState(); flashAutosave();
      syncOptionListsFromContent();
      if(key.indexOf("brand.")===0) applyBrandStyles();
    });
  });
}
function bindContentSingleClicks(container){
  container.addEventListener("click", function(e){
    var single = e.target.closest("[data-content-single]");
    if(single){
      var path = single.getAttribute("data-content-single");
      var val = single.getAttribute("data-val");
      setPath(state.content, path, val);
      saveState(); flashAutosave();
      if(path.indexOf("brand.")===0) applyBrandStyles();
      appEl.removeEventListener("click", globalClickHandler);
      render();
    }
  });
}
function bindLogoUpload(container){
  var fileInput = container.querySelector("#settings-logo-file");
  if(fileInput){
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        state.content.brand.logoDataUrl = String(reader.result||"");
        saveState(); flashAutosave();
        appEl.removeEventListener("click", globalClickHandler);
        render();
      };
      reader.readAsDataURL(file);
    });
  }
  var removeLogoBtn = container.querySelector("#settings-logo-remove");
  if(removeLogoBtn){
    removeLogoBtn.addEventListener("click", function(){

function screenSettingsContent(){

    groups[f.group].push(f);
  });
  var body = order.map(function(g){
    var rows = groups[g].map(function(f){
      var val = cfg(f.path);
      var input = f.multiline
        ? '<textarea data-content="'+esc(f.path)+'" style="width:100%;border:1px solid var(--line);background:var(--mist);border-radius:14px;padding:14px 16px;font-size:15px;min-height:70px;font-family:inherit;">'+esc(val)+'</textarea>'
        : '<input type="text" data-content="'+esc(f.path)+'" value="'+esc(val)+'">';

    }).join("");
    return '<div class="content-search-group"><div class="section-head"><h3>'+esc(g)+'</h3></div><div class="card">'+rows+'</div></div>';
  }).join("");
  return '<div class="screen">' + topbar("Content & Copy", {backTo:"settings", rightHtml:'<div class="autosave-indicator" id="autosave-indicator">Saved</div>'}) +

function mountSettingsContent(){
  var container = document.querySelector(".screen");
  if(!container) return;
  bindContentInputs(container);
  var search = container.querySelector("#content-search");
  if(search){
    search.addEventListener("input", function(){
      var q = search.value.trim().toLowerCase();
      Array.prototype.forEach.call(container.querySelectorAll(".content-search-group"), function(group){
        var rows = group.querySelectorAll(".content-search-row");
        var anyVisible = false;
        Array.prototype.forEach.call(rows, function(row){
          var match = !q || (row.getAttribute("data-search-text")||"").indexOf(q) > -1;
          row.classList.toggle("hidden", !match);
          if(match) anyVisible = true;
        });
        group.classList.toggle("hidden", !anyVisible);
      });
    });
  }
}

function mountSettingsOptions(){
  var container = document.querySelector(".screen");
  if(!container) return;
  function rerender(){ saveState(); flashAutosave(); syncOptionListsFromContent(); appEl.removeEventListener("click", globalClickHandler); render(); }

  function addOption(listKey){
    var input = container.querySelector('[data-optadd-input="'+listKey+'"]');
    if(!input) return;
    var val = input.value.trim();
    if(!val) return;
    var ok = KEYED_OPTION_LISTS.indexOf(listKey)>-1 ? addKeyedOption(listKey, val) : addSimpleOption(listKey, val);
    if(!ok){ toast("That option already exists"); return; }
    rerender();
  }

  container.addEventListener("click", function(e){
    var mv = e.target.closest("[data-opt-move]");
    if(mv){ moveSimpleOption(mv.getAttribute("data-opt-list"), mv.getAttribute("data-opt-value"), mv.getAttribute("data-opt-dir")==="up"?-1:1); rerender(); return; }
    var ar = e.target.closest("[data-opt-archive]");
    if(ar){ archiveSimpleOption(ar.getAttribute("data-opt-list"), ar.getAttribute("data-opt-value")); rerender(); return; }
    var un = e.target.closest("[data-opt-unarchive]");
    if(un){ unarchiveSimpleOption(un.getAttribute("data-opt-list"), un.getAttribute("data-opt-value")); rerender(); return; }
    var del = e.target.closest("[data-opt-delete]");
    if(del){ var r = deleteSimpleOption(del.getAttribute("data-opt-list"), del.getAttribute("data-opt-value")); toast(r==="archived" ? "In use — archived instead" : "Option deleted"); rerender(); return; }
    var kmv = e.target.closest("[data-opt-kmove]");
    if(kmv){ moveKeyedOption(kmv.getAttribute("data-opt-list"), kmv.getAttribute("data-opt-key"), kmv.getAttribute("data-opt-dir")==="up"?-1:1); rerender(); return; }
    var ktog = e.target.closest("[data-opt-ktoggle]");
    if(ktog){
      var lk = ktog.getAttribute("data-opt-list"), kk = ktog.getAttribute("data-opt-key");
      var item = (state.content.optionLists[lk]||[]).find(function(o){ return o.key===kk; });
      setKeyedOptionActive(lk, kk, item ? item.active===false : true);
      rerender(); return;
    }
    var kdel = e.target.closest("[data-opt-kdelete]");
    if(kdel){ var r2 = deleteKeyedOption(kdel.getAttribute("data-opt-list"), kdel.getAttribute("data-opt-key")); toast(r2==="archived" ? "In use — archived instead" : "Option deleted"); rerender(); return; }
    var addBtn = e.target.closest("[data-optadd-btn]");
    if(addBtn){ addOption(addBtn.getAttribute("data-optadd-btn")); return; }
  });

  Array.prototype.forEach.call(container.querySelectorAll("[data-optadd-input]"), function(input){
    input.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); addOption(input.getAttribute("data-optadd-input")); }
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll("[data-opt-rename]"), function(input){
    input.addEventListener("change", function(){
      var val = input.value.trim();
      if(!val){ input.value = input.defaultValue; return; }
      renameKeyedOption(input.getAttribute("data-opt-list"), input.getAttribute("data-opt-key"), val);
      saveState(); flashAutosave(); syncOptionListsFromContent();
    });
  });
}
